<!-- 季节开幕定稿的 symbol 路径；负原点 symbol 的外层视口须从 0 起。
     构建时从 index.html 主题表补入两套 token，供外部 SVG 的渐变 stop 使用。 -->
<svg xmlns="http://www.w3.org/2000/svg">
<defs>
    <linearGradient id="g-pk-mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--pk-hi)"/><stop offset="1" style="stop-color:var(--pk-lo)"/></linearGradient>
    <linearGradient id="g-pk-side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--pk-side-hi)"/><stop offset="1" style="stop-color:var(--pk-side-lo)"/></linearGradient>
    <radialGradient id="g-pk-lit" cx="50%" cy="62%" r="62%"><stop offset="0" style="stop-color:var(--pk-light-core)"/><stop offset=".45" style="stop-color:var(--pk-light-mid)"/><stop offset="1" style="stop-color:var(--pk-light-edge)"/></radialGradient>
    <linearGradient id="g-saury" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--saury-back)"/><stop offset=".5" style="stop-color:var(--saury-mid)"/><stop offset="1" style="stop-color:var(--saury-belly)"/></linearGradient>
    <radialGradient id="g-petal" cx="50%" cy="88%" r="85%"><stop offset="0" style="stop-color:var(--petal-core)"/><stop offset="1" style="stop-color:var(--petal)"/></radialGradient>

    <symbol id="sym-pumpkin" viewBox="0 0 120 100" overflow="visible">
      <ellipse cx="37" cy="61" rx="30" ry="34" fill="url(#g-pk-side)"/>
      <ellipse cx="83" cy="61" rx="30" ry="34" fill="url(#g-pk-side)"/>
      <ellipse cx="60" cy="61" rx="29" ry="37" fill="url(#g-pk-mid)" style="stroke:var(--pk-rib)" stroke-opacity=".35" stroke-width="1"/>
      <path d="M57 27 C56 17 59 10 66 6 C68 5 70 7 69 9 C64 12 63 18 64 27 Z" style="fill:var(--pk-stem)"/>
    </symbol>
    <symbol id="sym-pk-face" viewBox="0 0 120 100" overflow="visible">
      <path d="M33 55 L48 55 L41 42 Z"/>
      <path d="M72 55 L87 55 L79 42 Z"/>
      <path d="M56 65 L64 65 L60 58 Z"/>
      <path d="M31 70 L39 73 L44 69 L50 74 L56 70 L64 70 L70 74 L76 69 L81 73 L89 70 C84 85 72 91 60 91 C48 91 36 85 31 70 Z"/>
    </symbol>
    <symbol id="sym-bat" viewBox="0 0 64 30" overflow="visible">
      <path d="M34 12 C40 6 52 4 63 8 C59 10 57 13 57 17 C54 14 50 14 48 18 C46 15 42 15 40 19 C38 16 36 16 34 18 Z"/>
      <path d="M30 12 C24 6 12 4 1 8 C5 10 7 13 7 17 C10 14 14 14 16 18 C18 15 22 15 24 19 C26 16 28 16 30 18 Z"/>
      <ellipse cx="32" cy="15" rx="4.2" ry="7"/>
      <path d="M28.6 10 L29.6 4.5 L31.2 9.4 Z M35.4 10 L34.4 4.5 L32.8 9.4 Z"/>
    </symbol>
    <symbol id="sym-saury" viewBox="0 0 170 22" overflow="visible">
      <path d="M16 11 L2 3.6 L7 11 L2 18.4 Z" style="fill:var(--saury-back)"/>
      <path d="M40 7.4 L46 3.9 L50 6.8 Z M40 14.6 L46 17.9 L50 15.1 Z" style="fill:var(--saury-back)" opacity=".85"/>
      <path d="M14 11 C34 5 96 4 132 6.5 C146 7.5 158 9 169 11 C158 12.4 146 13.6 132 14.6 C96 17 34 16.5 14 11 Z" fill="url(#g-saury)"/>
      <path d="M158 9.7 C162 10.2 166 10.6 169 11 C166 11.4 162 11.8 158 12.3 Z" style="fill:var(--saury-beak)"/>
      <circle cx="146" cy="10.1" r="1.9" style="fill:var(--welcome-white)" opacity=".85"/>
      <circle cx="146" cy="10.1" r="1.2" style="fill:var(--saury-eye)"/>
    </symbol>
    <symbol id="sym-saury-glint" viewBox="0 0 170 22" overflow="visible">
      <path d="M38 8.8 C70 7 108 6.8 134 7.8" fill="none" style="stroke:var(--welcome-white)" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="sym-petal" viewBox="-12 -13 24 25" overflow="visible">
      <path d="M0 11 C-6 7 -10 0 -8 -6 C-6.6 -10.4 -3 -11 0 -8 C3 -11 6.6 -10.4 8 -6 C10 0 6 7 0 11 Z" fill="url(#g-petal)"/>
    </symbol>
    <symbol id="sym-heart" viewBox="-12 -11 24 22" overflow="visible">
      <path d="M0 9.5 C-9 3 -11.5 -3 -8.5 -7 C-6 -10 -2 -9.5 0 -6 C2 -9.5 6 -10 8.5 -7 C11.5 -3 9 3 0 9.5 Z"/>
    </symbol>
    <symbol id="sym-fir" viewBox="0 0 100 160" overflow="visible">
      <path d="M44.5 128 H55.5 V156 H44.5 Z" style="fill:var(--tree)"/>
      <path d="M50 74 L96 136 Q50 123 4 136 Z" style="fill:var(--tree)"/>
      <path d="M4 136 L50 74 L96 136" fill="none" style="stroke:var(--tree-snow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
      <path d="M50 48 L88 103 Q50 92 12 103 Z" style="fill:var(--tree)"/>
      <path d="M12 103 L50 48 L88 103" fill="none" style="stroke:var(--tree-snow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
      <path d="M50 24 L80 72 Q50 63 20 72 Z" style="fill:var(--tree)"/>
      <path d="M20 72 L50 24 L80 72" fill="none" style="stroke:var(--tree-snow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
      <path d="M50 4 L72 44 Q50 37 28 44 Z" style="fill:var(--tree)"/>
      <path d="M28 44 L50 4 L72 44" fill="none" style="stroke:var(--tree-snow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
    </symbol>
    <symbol id="sym-star" viewBox="-11 -11 22 22" overflow="visible">
      <path d="M0 -10 L2.35 -3.24 L9.51 -3.09 L3.8 1.24 L5.88 8.09 L0 4 L-5.88 8.09 L-3.8 1.24 L-9.51 -3.09 L-2.35 -3.24 Z"/>
    </symbol>
    <symbol id="sym-bow" viewBox="0 0 64 44" overflow="visible">
      <path d="M29 19 L19 40 L24.5 37 L27 42 L33 20 Z M35 19 L45 40 L39.5 37 L37 42 L31 20 Z" style="fill:var(--rib-dark)"/>
      <path d="M32 16 C24 2 6 2 6 12 C6 22 22 24 32 16 Z M32 16 C40 2 58 2 58 12 C58 22 42 24 32 16 Z" style="fill:var(--rib)"/>
      <path d="M32 16 C25 8 13 8 12 12 C13 16 24 18 32 16 Z M32 16 C39 8 51 8 52 12 C51 16 40 18 32 16 Z" style="fill:var(--rib-dark)" opacity=".45"/>
      <rect x="28" y="11" width="8" height="10" rx="3" style="fill:var(--rib-dark)"/>
    </symbol>
    <symbol id="sym-teru" viewBox="0 0 44 74" overflow="visible">
      <path d="M11 27 C9 40 5 50 3 58 C8 56 11 61 16 58 C19 62 25 62 28 58 C33 61 36 56 41 58 C39 50 35 40 33 27 Z" style="fill:var(--teru);stroke:var(--teru-edge)" stroke-width="1"/>
      <path d="M12 28.5 C18 31.5 26 31.5 32 28.5" fill="none" style="stroke:var(--teru-tie)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="22" cy="17" r="12" style="fill:var(--teru);stroke:var(--teru-edge)" stroke-width="1"/>
      <circle cx="18" cy="16.5" r="1.4" style="fill:var(--teru-face)"/>
      <circle cx="26" cy="16.5" r="1.4" style="fill:var(--teru-face)"/>
      <path d="M18.5 20.5 Q22 23.5 25.5 20.5" fill="none" style="stroke:var(--teru-face)" stroke-width="1.2" stroke-linecap="round"/>
    </symbol>

<symbol id="sym-pk-lit" viewBox="0 0 120 100" overflow="visible"><use href="#sym-pk-face" width="120" height="100" fill="url(#g-pk-lit)"/></symbol>
</defs>
</svg>
