<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kuma · 完整任务树</title>
  <style>
    :root {
      color-scheme: dark;
      --bg0: #0d1318;
      --bg1: #151c23;
      --bg2: #1c252e;
      --bg3: #232f3a;
      --line: #2a3742;
      --line-soft: #22303c;
      --text: #e8eef4;
      --sub: #93a4b3;
      --dim: #5c6f7f;
      --accent: #4db8ff;
      --accent-dim: #2a6f9e;
      --gold: #e8c66a;
      --ok: #67c98a;
      --warn: #e8a04c;
      --bad: #e06c75;
      --scrollbar-track: #10171d;
      --scrollbar-thumb: #334957;
      --scrollbar-thumb-hover: #486476;
      --scrollbar-thumb-active: #5c7b90;
      --mono: 'Cascadia Code', 'Consolas', monospace;
      font-family: 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
    }
    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb); border: 2px solid var(--scrollbar-track);
      border-radius: 8px; background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
    ::-webkit-scrollbar-thumb:active { background: var(--scrollbar-thumb-active); }
    ::-webkit-scrollbar-corner { background: var(--scrollbar-track); }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: var(--bg0); color: var(--text);
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    #quest-tree-root, .tree-app { width: 100%; height: 100%; }
    .tree-app { display: flex; flex-direction: column; min-width: 0; }
    header {
      flex: none; min-height: 58px; display: flex; align-items: center; gap: 13px;
      padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--bg1);
    }
    .title { min-width: 220px; display: flex; flex-direction: column; gap: 2px; }
    .title b { font-size: 15px; font-weight: 600; }
    .search {
      flex: 1; min-width: 190px; max-width: 470px; display: flex; align-items: center; gap: 6px;
      padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--bg0); color: var(--dim);
    }
    .search:focus-within { border-color: var(--accent-dim); }
    .search input {
      min-width: 0; width: 100%; border: 0; outline: 0; background: transparent;
      color: var(--text); font-size: 11px;
    }
    .tree-actions { margin-left: auto; display: flex; gap: 5px; }
    .tree-actions button, .filter-row button, .category-filter select {
      border: 1px solid var(--line); border-radius: 5px;
      background: var(--bg2); color: var(--sub);
    }
    .tree-actions button { padding: 4px 9px; font-size: 10px; }
    .tree-actions button:hover { color: var(--accent); border-color: var(--accent-dim); }
    .filter-row {
      flex: none; min-height: 38px; display: flex; align-items: center; gap: 9px;
      padding: 5px 14px; border-bottom: 1px solid var(--line-soft); background: #111920;
    }
    .status-filters {
      min-width: 0; display: flex; align-items: center; gap: 4px;
      overflow-x: auto;
    }
    .status-filters button {
      flex: none; display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 7px; border-radius: 10px; font-size: 9.5px; white-space: nowrap;
    }
    .status-filters button:hover, .status-filters button.on {
      border-color: var(--accent-dim); background: #172733; color: var(--text);
    }
    .status-filters button i {
      width: 6px; height: 6px; border-radius: 50%; background: var(--state); flex: none;
    }
    .status-filters button b { color: var(--dim); font: 8.5px var(--mono); }
    .category-filter {
      flex: none; display: inline-flex; align-items: center; gap: 5px;
      color: var(--dim); font-size: 9.5px;
    }
    .category-filter select {
      padding: 3px 22px 3px 7px; outline: 0; font-size: 9.5px;
    }
    .shown-count { margin-left: auto; flex: none; color: var(--dim); font: 9px var(--mono); }
    .shown-count b { color: var(--text); }
    main {
      flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px;
      overflow: hidden;
    }
    .tree-scroll { min-width: 0; overflow: auto; padding: 14px 18px 28px; }
    .complete-tree, .complete-tree ul { margin: 0; padding: 0; list-style: none; }
    .complete-tree { width: max-content; min-width: min(100%, 760px); }
    .complete-tree ul {
      position: relative; margin: 2px 0 1px 14px; padding-left: 18px;
      border-left: 1px solid var(--line);
    }
    .complete-tree li { position: relative; min-width: 0; padding: 2px 0; }
    .complete-tree ul > li::before {
      content: ''; position: absolute; left: -18px; top: 16px; width: 16px;
      border-top: 1px solid var(--line);
    }
    details > summary {
      min-width: 0; display: flex; align-items: center; gap: 4px;
      list-style: none; border-radius: 6px;
    }
    details > summary::-webkit-details-marker { display: none; }
    .twisty {
      flex: none; width: 15px; height: 20px; display: grid; place-items: center;
      color: var(--dim);
    }
    .twisty::before { content: '›'; font-size: 16px; transition: transform 120ms ease; }
    details[open] > summary .twisty::before { transform: rotate(90deg); }
    .tree-line {
      min-width: 0; display: flex; align-items: center; gap: 4px; padding-left: 1px;
    }
    .leaf-mark {
      flex: none; width: 15px; color: var(--dim); font-style: normal; text-align: center;
    }
    .task-node {
      min-width: 260px; max-width: 720px; height: 27px;
      display: grid; grid-template-columns: 7px 54px minmax(120px, 1fr) auto;
      align-items: center; gap: 6px; padding: 3px 7px;
      border: 1px solid var(--line-soft); border-radius: 5px;
      background: var(--bg1); color: var(--sub); text-align: left;
    }
    .task-node:hover { border-color: var(--accent-dim); background: var(--bg2); color: var(--text); }
    .task-node.selected {
      border-color: var(--accent); background: #152c3a;
      box-shadow: inset 2px 0 0 var(--accent);
    }
    .task-node.on-path { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
    .task-node.context { opacity: .58; }
    .task-node.context:hover, .task-node.selected { opacity: 1; }
    .task-node.matched { color: var(--text); }
    .task-node .state {
      width: 6px; height: 6px; border-radius: 50%; background: var(--state);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--state) 14%, transparent);
    }
    .task-node code { color: var(--dim); font: 9px var(--mono); }
    .task-node b {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 10.5px; font-weight: 500;
    }
    .task-node .category {
      padding: 0 5px; border: 1px solid color-mix(in srgb, var(--category) 45%, var(--line));
      border-radius: 7px; color: var(--category); font-size: 8px; white-space: nowrap;
    }
    .child-count {
      flex: none; min-width: 18px; padding: 0 4px; border-radius: 7px;
      background: var(--bg2); color: var(--dim); font: 8px var(--mono); text-align: center;
    }
    .and-req {
      flex: none; max-width: 168px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding: 0 5px; border: 1px dashed color-mix(in srgb, var(--gold) 48%, var(--line));
      border-radius: 7px; color: var(--gold); font: 8px var(--mono);
    }
    .cross-links {
      display: flex; flex-wrap: wrap; gap: 3px 8px; margin: 2px 0 2px 24px;
      color: var(--dim); font-size: 8.5px;
    }
    .cross-links span { display: inline-flex; align-items: center; gap: 3px; }
    .cross-links button, .relation-list button {
      border: 0; border-bottom: 1px dotted currentColor; background: transparent;
      color: var(--accent); padding: 0; font-size: inherit;
    }
    .cross-links .missing { color: var(--warn); }
    .tree-empty { padding: 80px 20px; color: var(--dim); text-align: center; }
    /* 与主窗口同款出处小记号：常驻一枚「源」，全文进悬停 */
    .credit-mark {
      display: inline-block; vertical-align: 1px;
      font-size: 8.5px; line-height: 1; padding: 2px 3px;
      color: var(--dim); border: 1px solid var(--line); border-radius: 3px;
      cursor: help; user-select: none;
    }
    #tree-inspector {
      min-width: 0; display: flex; flex-direction: column; overflow: hidden;
      border-left: 1px solid var(--line); background: #111820;
    }
    .inspector-head {
      position: relative; flex: none; padding: 14px 14px 12px;
      border-bottom: 1px solid var(--line);
    }
    .inspector-head > span { display: flex; align-items: center; gap: 7px; }
    .inspector-head code { color: var(--accent); font: 10px var(--mono); }
    .inspector-head i {
      padding: 1px 5px; border: 1px solid color-mix(in srgb, var(--category) 45%, var(--line));
      border-radius: 7px; color: var(--category); font-size: 8px; font-style: normal;
    }
    .inspector-head > b {
      display: block; margin-top: 7px; padding-right: 70px;
      color: var(--text); font-size: 14px; line-height: 1.5;
    }
    .inspector-head > em {
      position: absolute; right: 12px; top: 13px;
      color: var(--state); font-size: 9px; font-style: normal;
    }
    .inspector-head > em::before {
      content: ''; display: inline-block; width: 6px; height: 6px; margin-right: 4px;
      border-radius: 50%; background: var(--state);
    }
    .inspector-head small { display: block; margin-top: 4px; color: var(--dim); font-size: 8.5px; }
    .inspector-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; }
    .inspector-body section {
      margin-bottom: 9px; padding: 9px 10px;
      border: 1px solid var(--line-soft); border-radius: 6px; background: var(--bg0);
    }
    .inspector-body h3 {
      margin: 0 0 6px; color: var(--dim);
      font-size: 9px; font-weight: 600; letter-spacing: .5px;
    }
    .inspector-body p {
      margin: 0; color: var(--sub); font-size: 10.5px; line-height: 1.75;
      white-space: pre-wrap;
    }
    .relation-list { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .relation-list button { color: #b9dfff; font-size: 9.5px; text-align: left; }
    .relation-list span { color: var(--dim); font-size: 9.5px; }
    /* 前置口径的双源说明：只有分歧/补缺/悬空时出现（与任务管理器同一份文案）。
       常驻只留这一枚短标，分歧内容全文进 title 悬停（族 14 收拢） */
    .chain-src-note {
      margin-left: 6px; color: var(--warn); font-size: 8.5px; font-weight: 400;
      letter-spacing: 0; cursor: help; user-select: none;
    }
    .open-main {
      flex: none; margin: 0 12px 12px; padding: 7px 10px;
      border: 1px solid var(--accent-dim); border-radius: 5px;
      background: #152b39; color: #bfe6ff; font-size: 10px;
    }
    .open-main:hover { border-color: var(--accent); background: #183547; }
    .inspector-empty, .loading {
      height: 100%; display: grid; place-items: center; color: var(--dim);
      font-size: 11px; text-align: center;
    }
    footer {
      flex: none; min-height: 25px; padding: 5px 13px;
      border-top: 1px solid var(--line-soft); background: var(--bg1);
      color: var(--dim); font-size: 8.5px;
    }
    @media (max-width: 980px) {
      main { grid-template-columns: minmax(0, 1fr) 285px; }
      .task-node { max-width: 600px; }
    }
  </style>
</head>
<body>
  <div id="quest-tree-root"><div class="loading">正在整理完整任务树……</div></div>
  <script src="./quest-tree.js"></script>
</body>
</html>
