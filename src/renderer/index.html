    .fleet-skin.narrow .ship {
      grid-template-columns: 38px 1fr 96px 36px;
      grid-template-areas: "fc who hp cond" "fc eq eq fa";
      row-gap: 0; padding: 5px 14px;
    }
    .fleet-skin.narrow .eq, .fleet-skin.narrow .fa2 { margin-top: 4px; }
    .fleet-skin.narrow .fc { grid-area: fc; }
    .fleet-skin.narrow .who { grid-area: who; }
    .fleet-skin.narrow .who { display: block; }
    .fleet-skin.narrow .who > b, .fleet-skin.narrow .who > span { display: block; }
    .fleet-skin.narrow .hpc { grid-area: hp; }
    .fleet-skin.narrow .cond { grid-area: cond; width: 28px; height: 28px; font-size: 10px; }
    .fleet-skin.narrow .fa2 { grid-area: fa; flex-direction: row; align-items: center; }
    .fleet-skin.narrow .fa2 .b { width: 16px; }
    .fleet-skin.narrow .eq { grid-area: eq; justify-content: flex-start; flex-wrap: wrap; }
    .fleet-skin.narrow .ship-detail { margin-left: 0; }

    /* ══ 锱 · 资源（移植自设计稿 07，.mod-zi 作用域）══ */
    .mod-zi { overflow: hidden; }
    .mod-zi .zi-app { flex: 1; min-height: 0; display: flex; background: var(--bg0); overflow-y: auto; }
    .mod-zi .main { flex: 1.6; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
    .mod-zi .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line-soft); border-bottom: 1px solid var(--line); }
    .mod-zi .tile { background: var(--bg1); padding: 9px 12px 8px; position: relative; }
    .mod-zi .tile .h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 10.5px; color: var(--sub); }
    .mod-zi .tile .h .ic {
      width: 16px; height: 16px; border-radius: 3px; display: grid; place-items: center;
      font-size: 9px; font-weight: 700; color: #0d1318;
    }
    .mod-zi .tile .h .ic .material-icon { width: 14px; height: 14px; }
    .mod-zi .tile .h .live-delta {
      flex: none; white-space: nowrap; font: 700 9px var(--mono); letter-spacing: 0;
      transform: translateY(-1px); text-shadow: 0 0 7px currentColor;
      pointer-events: none;
    }
    .mod-zi .tile .h .live-delta.up { color: var(--ok); }
    .mod-zi .tile .h .live-delta.dn { color: var(--bad); }
    /* 连续资源变动会反复重画磁贴；累计期间保持稳定，只在最后一次变化后淡出。 */
    .mod-zi .tile .h .live-delta.leaving { animation: zi-material-delta-out 420ms ease-in forwards; }
    @keyframes zi-material-delta-out {
      from { opacity: 1; transform: translateY(-1px); }
      to { opacity: 0; transform: translateY(-7px); }
    }
    .mod-zi .tile .v { font-family: var(--mono); font-size: 17px; font-weight: 600; margin-top: 2px; letter-spacing: 0.3px; }
    .mod-zi .tile .s { display: flex; align-items: center; gap: 6px; font-size: 9.5px; margin-top: 1px; min-height: 14px; }
    .mod-zi .tile .s .tr { font-family: var(--mono); }
    .mod-zi .tile .s .tr.up { color: var(--ok); }
    .mod-zi .tile .s .tr.dn { color: var(--bad); }
    .mod-zi .tile .s .tr.flat { color: var(--dim); }
    .mod-zi .tile .s .st { color: var(--dim); }
    .mod-zi .tile .s .st.regen { color: var(--ok); }
    .mod-zi .tile .s .st.near { color: var(--warn); }
    .mod-zi .tile .s .st.low { color: var(--bad); }
    /* 右栏不再自带滚动条：整块由 .zi-app 统一滚（原先父子都能滚 = 双滚轮，很难滚顺） */
    .mod-zi .side { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg1); }
    .mod-zi .scard { border-bottom: 1px solid var(--line-soft); padding: 11px 14px; }
    .mod-zi .scard .h {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;
      color: var(--sub); letter-spacing: 1px; margin-bottom: 8px;
    }
    .mod-zi .scard .h .aux { font-weight: 400; font-size: 10.5px; color: var(--dim); margin-left: auto; }
    /* 从别处跳进来时的磁贴高亮（15 稿：对应磁贴高亮） */
    .mod-zi .tile.hl {
      border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-dim) inset;
      animation: zi-tile-hl 2.2s ease-out;
    }
    @keyframes zi-tile-hl {
      0%, 40% { background: #16242f; }
      100% { background: transparent; }
    }
    .mod-zi .placeholder { font-size: 11px; color: var(--dim); line-height: 1.7; }
    .mod-zi .placeholder b { color: var(--sub); font-weight: 400; }
    /* 卡片脚注（数据边界说明），与 placeholder 同调但更小 */
    .mod-zi .ph2 { margin-top: 7px; font-size: 10px; color: var(--dim); line-height: 1.65; }
    .mod-zi .ph2 b { color: var(--sub); font-weight: 400; }
    /* 储备目标：窄了换行堆叠，绝不裁字段 */
    .mod-zi .tg-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      padding: 4px 0; border-bottom: 1px solid var(--line-soft); font-size: 11px;
    }
    .mod-zi .tg-row:last-of-type { border-bottom: none; }
    .mod-zi .tg-ic {
      flex: none; width: 15px; height: 15px; border-radius: 3px; color: #0d1318;
      font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .mod-zi .tg-bar { flex: 1 1 70px; min-width: 50px; height: 5px; border-radius: 3px; background: var(--bg0); overflow: hidden; }
    .mod-zi .tg-bar i { display: block; height: 100%; border-radius: 3px; opacity: 0.85; }
    .mod-zi .tg-num { font-family: var(--mono); font-size: 10.5px; color: var(--sub); white-space: nowrap; }
    .mod-zi .tg-num b { color: var(--text); font-weight: 600; }
    .mod-zi .tg-edit { cursor: pointer; border-bottom: 1px dotted var(--dim); }
    .mod-zi .tg-edit:hover { color: var(--accent); border-bottom-color: var(--accent); }
    .mod-zi .tg-input {
      width: 74px; background: var(--bg0); border: 1px solid var(--accent); border-radius: 3px;
      color: var(--text); font-family: var(--mono); font-size: 10.5px; padding: 1px 4px;
    }
    .mod-zi .tg-pct { font-family: var(--mono); font-size: 10.5px; color: var(--text); min-width: 42px; text-align: right; }
    .mod-zi .tg-eta { flex: 1 1 100%; font-size: 10px; color: var(--dim); padding-left: 21px; }
    .mod-zi .tg-eta b { font-family: var(--mono); color: var(--sub); font-weight: 600; }
    .mod-zi .tg-exp { margin-left: 5px; padding: 0; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; }
    .mod-zi .tg-exp:hover { text-decoration: underline; }
    .mod-zi .tg-ok { color: var(--ok); }
    .mod-zi .tg-warn { color: var(--warn); }
    .mod-zi .tg-bad { color: var(--bad); }
    /* 战略道具 */
    .mod-zi .si-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 3px 0; font-size: 11px; color: var(--text);
    }
    /* 只有带跳转的行才给手型：应急修理女神那行没有 data-useitem，点了没反应 */
    .mod-zi .si-row[data-useitem] { cursor: pointer; }
    .mod-zi .si-row[data-useitem]:hover .si-nm { color: var(--accent); }
    .mod-zi .si-nm { flex: 1 1 auto; min-width: 0; }
    .mod-zi .si-n { flex: none; font-family: var(--mono); font-size: 12px; color: var(--text); font-weight: 600; }
    .mod-zi .si-n.short { color: var(--bad); }
    /* 鉴 · 海域卷节点图（04 稿）：拓扑取自 fcd，走过/打过/Boss 由本地遭遇志叠加 */
    .mod-ji .mapgraph {
      width: 100%; height: auto; max-height: 340px; display: block; margin-bottom: 8px;
      border: 1px solid color-mix(in srgb, var(--accent-dim) 58%, var(--line));
      border-radius: 7px; background: #162327;
      filter: brightness(1.08) saturate(1.08);
    }
    .mod-ji .mg-code {
      padding: 0 5px; border: 1px solid #31584f; border-radius: 3px;
      color: #a9eadb; background: #162a29; font: 9px var(--mono);
    }
    .mod-ji .mg-e { stroke: var(--sub); opacity: .72; }
    .mod-ji .mg-e.on { stroke: var(--accent); opacity: .9; }
    /* 半径/字号/线宽由 JS 按各图 viewBox 尺寸算，这里不写死 */
    .mod-ji .mg-n circle { fill: var(--bg1); stroke: var(--sub); }
    .mod-ji .mg-n text { fill: var(--sub); font-family: var(--mono); }
    .mod-ji .mg-n.fought circle { fill: color-mix(in srgb, var(--accent) 22%, var(--bg0)); stroke: var(--accent); }
    .mod-ji .mg-n.fought text { fill: var(--text); }
    .mod-ji .mg-n.start circle { fill: var(--bg1); stroke: var(--ok); stroke-dasharray: 3 2; }
    .mod-ji .mg-n.start text { fill: var(--ok); }
    .mod-ji .mg-n.boss circle { stroke: var(--bad); }
    .mod-ji .mg-n.boss text { fill: var(--bad); font-weight: 600; }
    /* 目标点：预测按它算的那一格。Boss 圈仍是历史事实，这里只多描一道亮圈 */
    .mod-ji .mg-n.mg-target circle { stroke: var(--gold); filter: drop-shadow(0 0 3px rgba(232,198,106,.55)); }
    .mod-ji .mg-n.mg-target text { fill: var(--gold); font-weight: 600; }
    /* 点得动的点位只多一个手势，圈和字一个像素都不改：
       能落到下面敌编成小节的才给（资源点、气旋、只记了掉落的途中点没有落点） */
    .mod-ji .mg-n.mg-jump { cursor: pointer; }
    .mod-ji .mg-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 10px; color: var(--dim); margin-bottom: 6px; }
    .mod-ji .mg-legend span { display: inline-flex; align-items: center; gap: 4px; }
    .mod-ji .mg-legend s { width: 14px; height: 0; border-top: 2px solid var(--line); }
    .mod-ji .mg-legend s.on { border-color: var(--accent); }
    .mod-ji .mg-legend i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
    .mod-ji .mg-legend i.start { border-color: var(--ok); border-style: dashed; }
    .mod-ji .mg-legend i.fought { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: var(--accent); }
    .mod-ji .mg-legend i.boss { border-color: var(--bad); border-width: 2px; }
    .mod-ji .mg-legend i.mg-target { border-color: var(--gold); border-width: 2px; }
    /* 缺包时的本机实测点位段：措辞是事实陈述，视觉上也别装成官方海图——
       不给背景色、边框比正段浅，一眼能看出这是临时视图 */
    .mod-ji .mg-local-note {
      font-size: 11px; color: var(--sub); line-height: 1.8; margin: 6px 0 8px;
      padding: 6px 8px; border: 1px dashed var(--line); border-radius: 6px;
    }
    .mod-ji .mg-local-note b { color: var(--text); }
    .mod-ji .mg-local-nodes { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .mod-ji .map-personal {
      border-color: color-mix(in srgb, var(--accent) 32%, var(--line));
      background: linear-gradient(120deg, rgba(89,188,166,.035), transparent 52%);
    }
    .mod-ji .map-personal-metrics {
      display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 5px; margin-bottom: 7px;
    }
    .mod-ji .map-personal-metrics > span {
      display: flex; flex-direction: column; gap: 1px; padding: 5px 7px;
      border: 1px solid var(--line-soft); border-radius: 5px; background: var(--bg0);
    }
    .mod-ji .map-personal-metrics small { color: var(--dim); font-size: 8.5px; }
    .mod-ji .map-personal-metrics b { color: var(--text); font: 650 12px var(--mono); }
    .mod-ji .map-personal-nodes { display: flex; flex-wrap: wrap; gap: 4px; }
    .mod-ji .map-personal-nodes .own-pill { color: var(--sub); }
    .mod-ji .map-personal-nodes .map-personal-boss { color: #ff9cab; border-color: #6b3540; }
    /* 通关阵容：打赢过 Boss 的本机编成（个人带路参考） */
    .mod-ji .map-clear-fleets .cf-row {
      padding: 6px 7px; margin-bottom: 5px;
      border: 1px solid var(--line-soft); border-radius: 6px; background: var(--bg0);
    }
    .mod-ji .map-clear-fleets .cf-deck { display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: baseline; }
    .mod-ji .map-clear-fleets .cf-deck + .cf-deck { margin-top: 3px; }
    .mod-ji .map-clear-fleets .cf-deck2 {
      color: var(--dim); font: 650 8.5px var(--mono);
      border: 1px solid var(--line-soft); border-radius: 2px; padding: 0 3px;
    }
    .mod-ji .map-clear-fleets .cf-ship { white-space: nowrap; font-size: 10.5px; }
    .mod-ji .map-clear-fleets .cf-ship i {
      font-style: normal; color: var(--dim); font: 9px var(--mono); margin-left: 2px;
    }
    .mod-ji .map-clear-fleets .cf-ship em {
      font-style: normal; color: var(--dim); font-size: 8.5px; margin-right: 2px;
      border: 1px solid var(--line-soft); border-radius: 2px; padding: 0 2px;
    }
    /* 「展开其余 N 套」：显式按钮而不是 <details>——抽屉随报文重渲染会抹掉
       details 的 open 态（点开立刻缩回，像完全藏住了）；展开态存在模块状态里 */
    .mod-ji .map-clear-fleets .cf-more-btn {
      display: block; width: 100%; margin-top: 2px; padding: 3px 7px; text-align: left;
      border: 1px dashed var(--line); border-radius: 5px; background: transparent;
      color: var(--sub); font: inherit; font-size: 9.5px; cursor: pointer;
    }
    .mod-ji .map-clear-fleets .cf-more-btn:hover { color: var(--text); border-color: var(--accent-dim); }
    .mod-ji .map-clear-fleets .cf-stats {
      margin-top: 4px; color: var(--sub); font-size: 9.5px;
    }
    .mod-ji .map-clear-fleets .cf-stats b { color: var(--text); font: 650 10px var(--mono); }
    /* 航迹（判断绕没绕路）与全队装备聚合（桶等引导装备一眼可见） */
    .mod-ji .map-clear-fleets .cf-path {
      margin-top: 3px; color: var(--sub); font: 9.5px var(--mono);
    }
    .mod-ji .map-clear-fleets .cf-path em {
      font-style: normal; color: var(--warn); font-size: 8.5px; margin-left: 5px;
      border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); border-radius: 2px; padding: 0 3px;
    }
    /* 装备聚合：类别图标 ×N（文字名平铺 20 多件糊成一段，2026-08-18 用户实锤后改） */
    .mod-ji .map-clear-fleets .cf-equips {
      margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 5px;
      color: var(--dim); font-size: 9px;
    }
    .mod-ji .map-clear-fleets .cf-equips .k { color: var(--sub); font: 9.5px var(--mono); margin-right: 1px; }
    .mod-ji .map-clear-fleets .cf-eq { display: inline-flex; align-items: center; gap: 1px; }
    .mod-ji .map-clear-fleets .cf-eq i { font-style: normal; font: 8.5px var(--mono); color: var(--sub); }
    .mod-ji .map-clear-fleets .cf-ship[data-cf-snap] { cursor: pointer; }
    .mod-ji .map-clear-fleets .cf-ship[data-cf-snap]:hover { color: var(--text); }
    /* 「通关那时」快照卡：挂 body 的浮层（面板裁 overflow + transform 包含块） */
    .cf-snap-host { position: fixed; inset: 0; z-index: 260; pointer-events: none; }
    .cf-snap-host .cf-snap {
      position: fixed; width: 268px; pointer-events: auto;
      border: 1px solid var(--line); border-radius: 8px; background: var(--bg1);
      box-shadow: 0 10px 32px rgba(0, 0, 0, .5); padding: 8px 10px;
    }
    .cf-snap-host .cs-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 5px; }
    .cf-snap-host .cs-head b { color: var(--text); font-size: 11px; }
    .cf-snap-host .cs-head span { color: var(--dim); font-size: 9px; }
    .cf-snap-host .cs-head .cs-x { margin-left: auto; cursor: pointer; color: var(--dim); font-size: 11px; }
    .cf-snap-host .cs-head .cs-x:hover { color: var(--text); }
    .cf-snap-host .cs-ship { display: flex; align-items: baseline; gap: 5px; font-size: 11.5px; }
    .cf-snap-host .cs-ship em {
      font-style: normal; color: var(--dim); font-size: 8.5px;
      border: 1px solid var(--line-soft); border-radius: 2px; padding: 0 3px;
    }
    .cf-snap-host .cs-ship b { color: var(--text); font: 650 10.5px var(--mono); }
    .cf-snap-host .cs-equips { margin: 5px 0; display: flex; flex-direction: column; gap: 2px; }
    .cf-snap-host .cs-eq { font-size: 10px; }
    .cf-snap-host .cs-eq i { font-style: normal; color: var(--gold); font: 9px var(--mono); margin-left: 3px; }
    .cf-snap-host .cs-note { color: var(--dim); font-size: 9.5px; }
    .cf-snap-host .cs-now { color: var(--sub); font-size: 9px; border-top: 1px dashed var(--line-soft); padding-top: 4px; }
    .cf-snap-host .cs-open {
      margin-top: 5px; width: 100%; padding: 3px 7px; text-align: left; cursor: pointer;
      border: 1px solid var(--line); border-radius: 5px; background: var(--bg0);
      color: var(--sub); font: inherit; font-size: 9.5px;
    }
    .cf-snap-host .cs-open:hover { color: var(--text); border-color: var(--accent-dim); }
    .mod-ji .map-node-filters { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 7px; }
    .mod-ji button.map-node-filter {
      appearance: none; color: var(--sub); font: inherit; cursor: pointer;
    }
    .mod-ji button.map-node-filter:hover { color: var(--text); border-color: var(--accent-dim); }
    .mod-ji button.map-node-filter.on {
      color: var(--accent); border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, var(--bg0));
    }
    .mod-ji .map-personal-drops { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 3px 8px; }
    .mod-ji .map-personal-drop {
      min-width: 0; display: grid; grid-template-columns: 34px 44px minmax(0,1fr) auto;
      align-items: center; gap: 4px; padding: 2px 0; color: var(--dim); font-size: 10px;
    }
    .mod-ji .map-personal-drop > span:first-child { font-family: var(--mono); }
    .mod-ji .map-personal-drop > .el { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .mod-ji .map-personal-drop > b { color: var(--text); font: 600 10px var(--mono); }
    .mod-ji .map-personal-more { margin-top: 4px; color: var(--dim); font-size: 10px; }
    .mod-ji .map-personal-more summary { cursor: pointer; color: var(--accent); }
    @container (max-width: 520px) {
      .mod-ji .map-personal-metrics { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .mod-ji .map-personal-drops { grid-template-columns: 1fr; }
    }
    /* 常规图特效舰：与铎的活动特效卡同一套语汇（对象 → 倍率 → 舰名 chips）。 */
    .mod-ji .map-bonus {
      border-color: color-mix(in srgb, #e08a97 30%, var(--line));
      background: linear-gradient(115deg, rgba(224,138,151,.035), transparent 48%);
    }
    .mod-ji .map-bonus .mb-row {
      padding: 6px 8px; margin-bottom: 5px; border-radius: 5px;
      background: var(--bg0); border: 1px solid var(--line-soft);
    }
    .mod-ji .map-bonus .mb-subject { color: var(--text); font-size: 11px; font-weight: 600; }
    .mod-ji .map-bonus .mb-subject em { margin-left: 5px; color: var(--dim); font: normal 9px var(--mono); }
    .mod-ji .map-bonus .mb-cells { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .mod-ji .map-bonus .mb-cell {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line-soft); background: var(--bg1);
    }
    .mod-ji .map-bonus .mb-nodes { display: inline-flex; gap: 2px; }
    .mod-ji .map-bonus .mb-nodes i { font: 600 10px var(--mono); font-style: normal; color: var(--sub); }
    .mod-ji .map-bonus .mb-nodes i.boss { color: #ff9cab; }
    .mod-ji .map-bonus .mb-cell b { color: var(--gold); font: 500 10.5px var(--mono); }
    .mod-ji .map-bonus .mb-ships {
      display: flex; flex-wrap: wrap; gap: 3px 8px; margin-top: 6px;
      padding-top: 5px; border-top: 1px solid var(--line-soft); font-size: 10.5px;
    }
    /* 海域规划：机制模型为主，个人样本只作并列对照。 */
    .mod-ji .map-forecast {
      border-color: color-mix(in srgb, #8f75ad 38%, var(--line));
      background: linear-gradient(115deg, rgba(143,117,173,.035), transparent 48%);
    }
    .mod-ji .map-forecast-tabs {
      display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 7px;
    }
    .mod-ji .map-forecast-tabs > span {

    /* ══ 链 · EntityLink 与 Peek（全局，移植自设计稿 15）══ */

    .el {
      cursor: pointer;

    }

    .el:hover { border-bottom-color: currentColor; filter: brightness(1.2); }

    .e-ship { --entity-color: var(--entity-ship); }
    .e-abys { --entity-color: var(--entity-abyss); }
    .e-equip { --entity-color: var(--entity-equip); }
    .e-map { --entity-color: var(--entity-map); }
    .e-item { --entity-color: var(--entity-item); }
    .e-quest { --entity-color: var(--entity-quest); }
    .e-exp { --entity-color: var(--entity-expedition); }
    .e-fleet { --entity-color: var(--entity-fleet); }
    .e-material { --entity-color: var(--entity-material); }

    .e-material-1 { --entity-color: var(--r-ammo); }
    .e-material-2 { --entity-color: var(--r-steel); }
    .e-material-3 { --entity-color: var(--r-baux); }
    .e-material-4 { --entity-color: var(--r-build); }
    .e-material-5 { --entity-color: var(--r-repair); }
    .e-material-6 { --entity-color: var(--r-dev); }
    .e-material-7 { --entity-color: var(--r-screw); }

    .e-nationality { --entity-color: var(--entity-nationality); }
    .e-histfleet { --entity-color: var(--entity-histfleet); }
    /* 通知规则行：从倒计时「为它设提醒」跳进来时高亮 */
    .mod-lg .ev-row.hl > td { background: #16242f; }
    .mod-lg .ev-row.hl > td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
    .peek {
      position: fixed; z-index: 1200; width: 252px;
      background: rgba(21, 28, 35, 0.98); border: 1px solid var(--line); border-radius: 8px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6); padding: 10px 12px;
      visibility: hidden; opacity: 0; pointer-events: none;
      transform: translate3d(0, 6px, 0) scale(.975);
      transform-origin: top left;
      transition:
        opacity var(--motion-fast) ease,
        transform var(--motion-view) var(--motion-ease),
        visibility 0s linear var(--motion-view);
    }
    .peek.show {
      visibility: visible; opacity: 1; pointer-events: auto; transform: none;
      transition: opacity var(--motion-fast) ease, transform var(--motion-view) var(--motion-ease);
    }
    /* 出击海图：图号旁的小箭头点开，把右栏那张「当前海域」卡浮出来。
       浮层挂在 <body> 下而不是面板里——面板链路上 .trail 与 .battle-col 都有
       overflow:hidden，而 .ws-pane 自带 transform（会成为 fixed 的包含块），
       两条路都试过、都会让浮层要么被裁要么飞出屏幕。 */
    .mod-di .map-peek {

    }
    .sea-pop .scard { margin: 0; background: rgba(21, 28, 35, 0.985); }
    /* 战果账：通常（换算自提督经验）+ 特别（EO 查表），逐笔可展开 */
    .mod-zi .senka-card .senka-chart { width: 100%; height: 30px; display: block; margin: 2px 0 6px; opacity: .85; }
    .mod-zi .senka-sum { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .mod-zi .senka-sum .big { font: 600 20px var(--mono); color: var(--entity-quest); }

    .mod-zi .senka-row .w.quest { color: var(--entity-quest); }

    .mod-zi .senka-cal-tag { font-size: 9.5px; color: var(--gold); margin: -2px 0 4px; cursor: help; }
    .mod-zi .senka-detail-link { margin-left: auto; font-size: 10px; color: var(--accent); cursor: pointer; }
    .mod-zi .senka-detail-link:hover { text-decoration: underline; }
    /* 战果详情弹窗（挂 body 的浮层） */
    .senka-detail-host { position: fixed; inset: 0; z-index: 1000; }
    .senka-detail-host .sd-back { position: absolute; inset: 0; background: rgba(6, 10, 14, .58); }
    .senka-detail-host .sd-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(520px, 92vw); max-height: 80vh; display: flex; flex-direction: column;
      background: var(--bg1); border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 14px 44px rgba(0, 0, 0, .55);
    }

    }

    .senka-detail-host .sd-x {
      margin-left: auto; width: 24px; height: 24px; display: grid; place-items: center;
      border: 1px solid var(--line); border-radius: 6px; background: var(--bg0);
      color: var(--sub); cursor: pointer; font-size: 12px;
    }
    .senka-detail-host .sd-x:hover { color: var(--text); }
    .senka-detail-host .sd-body { overflow-y: auto; padding: 10px 14px 14px; }
    .senka-detail-host .sd-block { margin-bottom: 12px; }
    .senka-detail-host .sd-total { display: flex; align-items: baseline; gap: 8px; }
    .senka-detail-host .sd-total b { font: 600 24px var(--mono); color: var(--entity-quest); }
    .senka-detail-host .sd-total span { color: var(--dim); font-size: 10.5px; }
    .senka-detail-host .sd-parts {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: hidden;
      margin-top: 7px; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--line-soft);
    }
    .senka-detail-host .sd-parts > span {
      display: flex; flex-direction: column; gap: 1px; padding: 6px 8px;
      background: var(--bg0); min-width: 0;
    }
    .senka-detail-host .sd-parts small { color: var(--dim); font-size: 8.5px; }
    .senka-detail-host .sd-parts b { font: 600 12px var(--mono); color: var(--text); }
    .senka-detail-host .sd-parts i { color: var(--dim); font-size: 8.5px; font-style: normal; line-height: 1.5; }
    .senka-detail-host .sd-h { display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; font-weight: 600; color: var(--text); margin-bottom: 5px; }
    .senka-detail-host .sd-h i { font-style: normal; font-weight: 400; font-size: 10px; color: var(--sub); }
    .senka-detail-host .sd-h i b { color: var(--gold); }
    .senka-detail-host .sd-eo-grid { display: flex; flex-wrap: wrap; gap: 4px; }
    .senka-detail-host .sd-eo {
      font-size: 10.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px;
      color: var(--sub); background: var(--bg0);
    }
    .senka-detail-host .sd-eo b { font-family: var(--mono); font-weight: 400; color: var(--dim); }
    .senka-detail-host .sd-eo.done { border-color: #2c5c50; color: var(--ok); }
    .senka-detail-host .sd-eo.done b { color: var(--ok); }
    .senka-detail-host .sd-quest { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; padding: 2px 0; color: var(--sub); }
    .senka-detail-host .sd-quest b { font-family: var(--mono); color: var(--text); }
    .senka-detail-host .sd-note { margin-top: 5px; font-size: 9.5px; color: var(--warn); line-height: 1.6; }
    .senka-detail-host .sd-note2 { font-size: 10px; color: var(--sub); line-height: 1.65; margin-bottom: 6px; }
    .senka-detail-host .sd-cal-now { font-size: 11px; color: var(--sub); margin-bottom: 6px; }
    .senka-detail-host .sd-cal-now b { font-family: var(--mono); color: var(--text); }
    .senka-detail-host .sd-cal-now b.cur { color: var(--entity-quest); font-size: 13px; }
    .senka-detail-host .sd-cal-row { display: flex; gap: 6px; }
    .senka-detail-host .sd-cal-input {
      flex: 1; max-width: 200px; background: var(--bg0); border: 1px solid var(--line);
      border-radius: 6px; padding: 4px 9px; color: var(--text); font: 12px var(--mono); outline: none;
    }
    .senka-detail-host .sd-cal-input:focus { border-color: var(--accent-dim); }
    .senka-detail-host .sd-cal-btn {
      border: 1px solid var(--line); border-radius: 6px; background: var(--bg2);
      color: var(--text); padding: 4px 12px; font-size: 11px; cursor: pointer;
    }
    .senka-detail-host .sd-cal-btn:hover { border-color: var(--accent); color: var(--accent); }
    .senka-detail-host .sd-cal-btn.ghost { color: var(--dim); background: none; }
    .senka-detail-host .sd-check-group { font-size: 10.5px; color: var(--sub); margin: 5px 0 3px; }
    .senka-detail-host .sd-check-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;

    .senka-detail-host .sd-pend { font-style: normal; font-size: 9px; color: var(--dim); }

    .senka-detail-host .sd-empty { padding: 18px; color: var(--dim); text-align: center; }
    /* 改造链的素材：链上只留一枚摘要，明细在悬停小卡里
       （整排铺开会把链撑散，而且「×10」紧挨库存「672」会被读成 10672） */
    .mod-ji .rm-needs {
      display: inline-block; margin-top: 2px; padding: 0 5px;
      border: 1px solid var(--line); border-radius: 3px;
      font-size: 9.5px; line-height: 1.6; cursor: help; white-space: nowrap;
    }
    .mod-ji .rm-needs.ok { color: var(--ok); border-color: #2b4a37; }
    .mod-ji .rm-needs.short { color: var(--warn); border-color: #5c4a2a; }
    /* 输出列第一层只给合计（昼夜分段在悬停里）：十几行都写「x + y」这一列会挤爆；
       悬停里某段没出手写 `--` 而不是 0 */
    .mod-di .dmg-split { cursor: help; border-bottom: 1px dotted var(--line); }
    /* 战损分段：昼战段与夜战段之间的箭头带色，一眼看出哪段掉得多 */

    /* 通知同类堆叠：一天里「任务待领取」能占一半，堆起来重要的才不被淹 */
    .mod-lg .nrow.stack { cursor: pointer; }

      content: ''; position: absolute; left: 12px; top: 0; bottom: 0; width: 1px; background: var(--line);
    }
    /* 富提示：承载多行数据的长提示。比实体速览卡宽，且文字要能选中复制
       ——这正是它取代原生 title 的理由 */
    .peek.tip { width: 320px; max-height: 60vh; overflow-y: auto; }
    .peek.tip .p-s { user-select: text; cursor: text; line-height: 1.75; }
    .peek.tip.pinned .p-t { cursor: move; }

    .peek .p-media { margin-top: 7px; display: flex; align-items: center; justify-content: center; gap: 6px; }

    .peek .p-media .useitem-icon.hero { width: 58px; height: 58px; }
    .peek .p-s { font-size: 10.5px; color: var(--sub); margin-top: 3px; line-height: 1.55; }
    .peek .p-acts { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }

    .peek .pa.pri { background: var(--accent-dim); color: #fff; border-color: var(--accent-dim); }
    .peek .p-hint { margin-top: 7px; font-size: 9px; color: var(--dim); border-top: 1px dashed var(--line-soft); padding-top: 5px; }
    .peek.pinned { cursor: move; border-color: var(--accent-dim); }

    /* 链 · 右键全部目标菜单（移植自设计稿 15） */
    .cmenu {
      position: fixed; z-index: 1300; min-width: 168px;
      background: rgba(21, 28, 35, 0.98); border: 1px solid var(--line); border-radius: 8px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6); padding: 4px;
      visibility: hidden; opacity: 0; pointer-events: none;
      transform: translate3d(0, 5px, 0) scale(.98);
      transform-origin: top left;
      transition:
        opacity var(--motion-fast) ease,
        transform var(--motion-view) var(--motion-ease),
        visibility 0s linear var(--motion-view);
    }
    .cmenu.show {
      visibility: visible; opacity: 1; pointer-events: auto; transform: none;
      transition: opacity var(--motion-fast) ease, transform var(--motion-view) var(--motion-ease);

    .cmenu .mi:hover { background: var(--bg3); color: var(--text); }
    .cmenu .mi .k { margin-left: auto; font-size: 9px; color: var(--dim); font-family: var(--mono); }
    .cmenu .mi.pri { color: var(--accent-ink); }
    .cmenu .mi.dis { opacity: 0.45; cursor: default; }
    .cmenu .mi.dis:hover { background: none; color: #c3d1dc; }

    /* ══ 鉴 · 图鉴（移植自设计稿 01/02，.mod-ji 作用域）══ */
    .mod-ji { overflow: hidden; }
    .mod-ji .ji-app { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg0); }
    /* 横滚的细滚动条与锐的页签行同一形态：藏起滚动条等于不告诉人「右边还有一卷」
       ——窄档最后那一卷会被推出可视区，没有任何提示 */
    .mod-ji .book-tabs {
      flex: none; display: flex; gap: 2px; padding: 8px 12px 0; overflow-x: auto;
      background: var(--bg1); border-bottom: 1px solid var(--line); scrollbar-width: thin;
    }
    .mod-ji .book-tab {
      flex: none;
      background: none; border: 1px solid transparent; border-bottom: none;
      border-radius: 7px 7px 0 0; padding: 6px 10px; font-size: 12px; color: var(--sub); cursor: pointer;
    }
    .mod-ji .book-tab.on { background: var(--bg0); border-color: var(--line); color: var(--text); }
    /* 返回/前进（图鉴导航历史，各存 5 层）：贴在书页标签左侧。
       sticky：坞窄到标签要横滚时按钮钉住不滚丢——它是导航控件，看不见等于没有 */
    .mod-ji .ji-nav {
      flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px 3px 0;
      position: sticky; left: 0; z-index: 2; background: var(--bg1);
    }
    .mod-ji .ji-nav-btn {
      width: 21px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 6px;
      background: var(--bg0); color: var(--sub); font-size: 11px; line-height: 1; cursor: pointer;
    }
    .mod-ji .ji-nav-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent-dim); }
    .mod-ji .ji-nav-btn:disabled { opacity: .32; cursor: default; }
    /* 点进来的实体本地查无此条时的回执横条（正式包没有 DevTools，
       静默 return 在玩家眼里就是「点了没反应」；与 di 的 battle-replay-note 同族） */
    .mod-ji .ji-miss-note {
      flex: none; display: flex; align-items: center; gap: 8px; padding: 5px 12px;
      font-size: 10.5px; color: #d8ad72; background: rgba(170, 116, 48, .09);
      border-bottom: 1px solid rgba(170, 116, 48, .24);
    }
    .mod-ji .ji-miss-note .x { margin-left: auto; padding: 0 3px; color: #e7c58d; opacity: .7; cursor: pointer; }
    .mod-ji .ji-miss-note .x:hover { opacity: 1; }
    .mod-ji .book-wrap { flex: 1; min-height: 0; display: flex; position: relative; container-type: inline-size; container-name: jibook; }
    .mod-ji .roster-book,
    .mod-ji .roster-embed { min-width: 0; min-height: 0; }
    .mod-ji .roster-embed { flex: 1; display: flex; overflow: hidden; }
    .mod-ji .index { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg1); container-type: inline-size; container-name: jilist; }
    .mod-ji .search-row { padding: 10px 12px 8px; display: flex; gap: 6px; align-items: center; }
    .mod-ji .search {
      flex: 1; max-width: 420px; display: flex; align-items: center; gap: 6px;
      background: var(--bg0); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; color: var(--dim);
    }
    .mod-ji .search input { background: none; border: none; outline: none; color: var(--text); width: 100%; font-size: 12px; font-family: inherit; }
    .mod-ji .equip-mode {
      flex: none; display: flex; overflow: hidden; border: 1px solid var(--line);
      border-radius: 6px; background: var(--bg0);
    }
    .mod-ji .equip-mode button {
      border: 0; border-left: 1px solid var(--line); padding: 5px 9px;
      background: transparent; color: var(--dim); font: 10.5px var(--sans); cursor: pointer;
    }
    .mod-ji .equip-mode button:first-child { border-left: 0; }
    .mod-ji .equip-mode button.on { background: var(--accent-dim); color: #fff; }
    /* 组合实验室（装备卷第三模式）：CI/配装的只读模拟与查询 */
    .mod-ji .lab-book-slot { flex: 1; min-height: 0; overflow-y: auto; }
    .mod-ji .ji-lab { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 16px; }
    .mod-ji .ji-lab .mono { font-family: var(--mono); font-size: 10.5px; color: var(--sub); }
    .mod-ji .lab-head { display: flex; align-items: baseline; gap: 10px; }
    .mod-ji .lab-head b { font-size: 12.5px; color: var(--text); flex: none; }
    .mod-ji .lab-head .aux, .mod-ji .lab-card .aux { color: var(--dim); font-size: 10px; }
    .mod-ji .lab-pick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .mod-ji .lab-pick .k, .mod-ji .lab-slot .k { flex: none; color: var(--dim); font-size: 10.5px; }
    .mod-ji .lab-pick input, .mod-ji .lab-slot input {
      flex: 1; min-width: 160px; background: var(--bg2); color: var(--text);
      border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font-size: 11.5px;
    }
    .mod-ji .lab-ship-meta { display: inline-flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .mod-ji .lab-ship-meta button, .mod-ji .lab-flag {
      background: var(--bg2); color: var(--sub); border: 1px solid var(--line);
      border-radius: 3px; padding: 1px 8px; cursor: pointer; font-size: 10px; margin-left: 6px;
    }
    .mod-ji .lab-ship-meta button:hover, .mod-ji .lab-flag:hover { border-color: var(--accent); color: var(--accent); }
    /* 每格多了一个 ★ 选择器，列宽跟着放宽一档；装备名输入的下限同时收窄，
       否则 230px 那档放不下「名字 + ★ + ✕」，行会折到第二排。 */
    .mod-ji .lab-slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); gap: 5px 10px; }
    .mod-ji .lab-slot { display: flex; align-items: center; gap: 6px; }
    .mod-ji .lab-slot input { min-width: 110px; }
    .mod-ji .lab-slot .lab-star {
      flex: none; background: var(--bg2); color: var(--sub); border: 1px solid var(--line);
      border-radius: 4px; padding: 3px 2px; font: 10px var(--mono); cursor: pointer;
    }
    .mod-ji .lab-slot .lab-star:hover { border-color: var(--accent); }
    /* 填过改修的格用金色标出来：一屏十几格，靠选择器里那个数字自己找太费眼 */
    .mod-ji .lab-slot .lab-star.on { color: var(--gold); border-color: var(--gold); }
    .mod-ji .lab-slot .k i { font-style: normal; color: var(--dim); font-family: var(--mono); font-size: 9px; margin-left: 2px; }
    /* 扩过的格原量那一截也带 title（「搭载上限 2+1（格納庫増設）」），一并给问号光标 */
    .mod-ji .lab-slot .k i[title] { cursor: help; }
    /* 格納庫増設抬高的那部分：紧跟原量的小字，用航空色与原量区分开 */
    .mod-ji .lab-slot .k i.hx { color: var(--air); margin-left: 1px; }
    /* 装备格与舰娘栏共用同一个 ✕：两处清空是同一个动作，长相与手感也该是同一个 */
    .mod-ji .lab-slot .x, .mod-ji .lab-pick .x { color: var(--dim); cursor: pointer; font-size: 11px; }
    .mod-ji .lab-slot .x:hover, .mod-ji .lab-pick .x:hover { color: var(--bad); }
    .mod-ji .lab-results { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px; align-items: start; }
    .mod-ji .lab-card { border: 1px solid var(--line); border-radius: 6px; background: var(--bg1); padding: 8px 10px; }
    .mod-ji .lab-card .h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .mod-ji .lab-card .h b { font-size: 11.5px; color: var(--text); }
    .mod-ji .lab-row { display: flex; align-items: baseline; gap: 8px; padding: 3px 4px; border-radius: 4px; font-size: 11px; flex-wrap: wrap; }
    .mod-ji .lab-row:nth-child(odd) { background: rgba(255, 255, 255, .022); }
    .mod-ji .lab-row b { color: var(--text); font-weight: 600; }
    .mod-ji .lab-row.off { opacity: .55; }
    .mod-ji .lab-row .tag { margin-left: auto; color: var(--dim); font-size: 9.5px; }
    .mod-ji .lab-sub { display: flex; justify-content: space-between; gap: 8px; padding: 1px 4px 1px 16px; font-size: 10.5px; color: var(--sub); }
    .mod-ji .lab-none { padding: 6px 4px; color: var(--dim); font-size: 10.5px; }
    .mod-ji .lab-note { margin-top: 6px; padding-top: 5px; border-top: 1px dashed var(--line-soft); color: var(--dim); font-size: 9.5px; line-height: 1.6; }
    /* 舰娘框与装备格的自绘联想下拉。原生 <datalist> 的弹层滚轮滚不动、又不吃页面
       CSS（深色主题下一片白底），换成自己画的这一份。**挂在 body 上**——模块面板
       既裁 overflow 又有 transform 包含块，所以选择器不带 .mod-ji 前缀。 */
    #ji-lab-suggest {
      display: none; position: fixed; z-index: 1250; overflow: hidden;
      border: 1px solid var(--line); border-radius: 6px; background: var(--bg1);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .45);
    }
    #ji-lab-suggest.open { display: block; }
    /* 滚轮能滚的就是这一层 */
    #ji-lab-suggest .ls-list { max-height: 264px; overflow-y: auto; }
    #ji-lab-suggest .ls-note { padding: 5px 9px 3px; color: var(--dim); font-size: 9.5px; }
    #ji-lab-suggest .ls-empty { padding: 8px 9px; color: var(--dim); font-size: 11px; }
    #ji-lab-suggest .ls-row {
      display: flex; align-items: baseline; gap: 8px; padding: 4px 9px;
      cursor: pointer; font-size: 11.5px;
    }
    /* 名字长的装备（「一式陸攻（野中隊）」那种）截断，别把类别小字挤出行外 */
    #ji-lab-suggest .ls-row b {
      color: var(--text); font-weight: 600; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #ji-lab-suggest .ls-row i {
      margin-left: auto; flex: none; font-style: normal; font-size: 9.5px; color: var(--dim);
    }
    #ji-lab-suggest .ls-row.on { background: rgba(120, 150, 220, .14); }
    #ji-lab-suggest .ls-row:hover { background: rgba(255, 255, 255, .05); }
    #ji-lab-suggest .ls-foot {
      padding: 4px 9px; border-top: 1px solid var(--line); color: var(--dim); font-size: 9.5px;
    }
    .mod-ji .today-summary {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 5px 12px;
      padding: 0 12px 9px; color: var(--dim); font-size: 10.5px;
      border-bottom: 1px solid var(--line-soft);
    }
    .mod-ji .today-summary b { color: var(--sub); font-weight: 600; }
    .mod-ji .today-summary .ok, .mod-ji .today-summary .ok b { color: var(--ok); }
    .mod-ji .type-chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 9px; }
    .mod-ji .chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer; background: var(--bg2); color: var(--sub); border: 1px solid transparent; }
    .mod-ji .chip.on { background: var(--accent-dim); color: #fff; }
    .mod-ji .ship-list { flex: 1; min-height: 0; overflow-y: auto; align-content: start; }
    /* 分类分组的组根（section-fold 要「标题是段根的直接子元素」才接得上折叠）。
       display:contents 是硬要求，不是省事：宽屏下 .ship-list 是栅格、行是栅格项，
       真生成一个盒子会把整组塞进一个格子，多列排布当场没了。盒子不生成，
       .grp 与各行照旧直接参与外层栅格——展开态与加折叠之前逐像素相同。 */
    .mod-ji .grp-box { display: contents; }
    .mod-ji .grp {
      position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 8px;
      padding: 5px 12px; background: var(--bg2);
      border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);
      font-size: 11px; color: var(--sub);
    }
    .mod-ji .grp b { color: var(--text); font-weight: 600; }
    .mod-ji .grp .map-event-period { font: 9px var(--mono); }
    .mod-ji .grp .map-event-period.live, .mod-ji .map-event-date.live { color: var(--gold); }
    .mod-ji .grp .map-event-period.ended, .mod-ji .map-event-date.ended { color: var(--dim); }
    .mod-ji .grp .cnt { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--dim); }
    .mod-ji .sister-head {
      display: flex; align-items: baseline; gap: 7px; padding: 3px 12px 3px 18px;
      border-bottom: 1px dashed var(--line-soft); background: color-mix(in srgb, var(--bg1) 88%, var(--accent) 3%);
      color: var(--dim); font-size: 9.5px;
    }
    .mod-ji .sister-head::before {
      content: ''; width: 11px; height: 1px; flex: none; background: var(--accent-dim); opacity: .7;
    }
    .mod-ji .sister-head b { color: var(--sub); font-size: 10.5px; font-weight: 600; }
    .mod-ji .sister-head span { margin-left: auto; font-family: var(--mono); }
    .mod-ji .sister-head.toggle { cursor: pointer; user-select: none; }
    .mod-ji .sister-head.toggle:hover { background: color-mix(in srgb, var(--bg2) 88%, var(--accent) 7%); }
    .mod-ji .sister-head.toggle:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
    .mod-ji .sister-arrow {
      width: 10px; margin-left: -2px; color: var(--accent); font: 700 11px var(--mono);
      font-style: normal; transform: rotate(0deg); transition: transform var(--motion-fast) ease;
    }
    .mod-ji .sister-arrow.single { color: var(--line); font-size: 8px; }
    .mod-ji .sister-head.collapsed .sister-arrow { transform: rotate(-90deg); }
    .mod-ji .linked-filter { border-color: var(--accent); }
    .mod-ji .row { display: flex; align-items: center; gap: 9px; padding: 6px 12px; cursor: pointer; border-left: 2px solid transparent; }
    .mod-ji .row:hover { background: var(--bg2); }
    .mod-ji .row.on { background: var(--bg3); border-left-color: var(--accent); }
    .mod-ji .face {
      width: 34px; height: 34px; flex: none; border-radius: 5px;
      background: linear-gradient(140deg, #2b3a48, #1b2530);
      display: grid; place-items: center; font-family: var(--serif);
      font-size: 15px; color: #7d92a5; border: 1.5px solid var(--rc, #2a3742);
    }
    .mod-ji .face.eqface { font-family: inherit; }
    .mod-ji .face.shipface { width: 64px; padding: 1px; background: var(--bg0); }
    .mod-ji .face.mapface {
      position: relative; width: 64px; padding: 2px; overflow: hidden;
      background: #18292c; border-color: #31534e;
      box-shadow: inset 0 0 18px rgba(92, 190, 170, .055);
    }
    .mod-ji .face.mapface .mini-map {
      width: 100%; height: 100%; margin: 0; border: 0; background: transparent;
      filter: brightness(1.18) saturate(1.12);
    }
    .mod-ji .map-thumb-code {
      position: absolute; left: 3px; top: 2px; z-index: 1;
      padding: 0 3px; border-radius: 2px; color: #c5f1e7;
      background: rgba(9, 20, 22, .78); font: 700 8px/1.4 var(--mono);
      text-shadow: 0 1px 2px #000;
    }
    .mod-ji .map-thumb-gauge {
      position: absolute; left: 3px; right: 3px; bottom: 2px; z-index: 1;
      height: 3px; overflow: visible; border-radius: 2px;
      background: rgba(7, 14, 17, .86); box-shadow: 0 0 0 1px rgba(255, 255, 255, .08);
    }
    .mod-ji .map-thumb-gauge i {
      display: block; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #8e3848, var(--bad));
    }
    .mod-ji .map-thumb-gauge.count i { background: linear-gradient(90deg, #92702d, var(--gold)); }
    .mod-ji .map-thumb-gauge.done i { background: linear-gradient(90deg, #2f7950, var(--ok)); }
    /* 「扣式」击破格：EO 的个位数击破一颗一扣，打掉一次熄一颗（从右往左熄） */
    .mod-ji .map-thumb-gauge.pips {
      display: flex; gap: 2px; height: 4px; background: transparent; box-shadow: none;
    }
    .mod-ji .map-thumb-gauge.pips i {
      flex: 1; height: 100%; border-radius: 1.5px;
      background: rgba(7, 14, 17, .86); box-shadow: 0 0 0 1px rgba(255, 255, 255, .1);
    }
    .mod-ji .map-thumb-gauge.pips i.on {
      background: linear-gradient(90deg, #92702d, var(--gold));
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .14);
    }
    .mod-ji .map-thumb-gauge b {
      position: absolute; right: 0; bottom: 3px; color: #ffd1d8;
      font: 700 8px/1 var(--mono); text-shadow: 0 1px 2px #000;
    }
    .mod-ji .row.ghost .equip-icon { opacity: .42; filter: grayscale(.7); }
    .mod-ji .row.ghost .face { background: #161d24; color: #3a4a58; border-color: #26313c; }
    .mod-ji .row.ghost .ship-thumb { opacity: .38; filter: grayscale(.8); }
    .mod-ji .row.ghost .useitem-icon { opacity: .42; filter: grayscale(.7); }
    .mod-ji .row.ghost .mini-map { opacity: .34; filter: grayscale(.8) brightness(.72); }
    .mod-ji .row .nm { flex: 1; min-width: 0; }
    .mod-ji .row .nm b { display: block; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mod-ji .row.ghost .nm b { color: var(--dim); }
    /* 深海一行代表一个形态，行尾标它有几个难度档 */
    .mod-ji .row .nm .tier { color: var(--abyss-soft); border-bottom: 1px dotted #7b3545; cursor: help; }
    /* 「这船去哪捞」：确认掉落海域的反查结果 */
    .mod-ji .cd-row {
      display: grid; grid-template-columns: 78px 1fr auto; gap: 8px; align-items: baseline;
      padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 11.5px;
    }
    .mod-ji .cd-row:last-of-type { border-bottom: 0; }
    .mod-ji .cd-map { font-weight: 600; font-family: var(--mono); }
    .mod-ji .cd-node { color: var(--sub); }
    .mod-ji .cd-tag { font-size: 9px; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
    .mod-ji .cd-tag.gold { color: #d9b25e; border-color: #6b551f; }
    /* 已终了的限定掉点：灰到底，一眼看得出它跟上面那些不是一类。不新造颜色，用现成的 --dim */
    .mod-ji .cd-row.ended, .mod-ji .cd-row.ended .cd-node { color: var(--dim); }
    .mod-ji .cd-note { font-size: 11px; color: var(--dim); line-height: 1.7; margin-bottom: 5px; }
    /* 开发：秘书舰 × 资材表 → 出货率 */
    .mod-ji .dv-head { font-size: 10.5px; color: var(--dim); margin-bottom: 4px; }
    .mod-ji .dv-row {
      display: grid; grid-template-columns: 68px 90px 1fr auto; gap: 8px; align-items: baseline;
      padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 11.5px;
    }
    .mod-ji .dv-row:last-of-type { border-bottom: 0; }
    .mod-ji .dv-sec { font-weight: 600; color: var(--sub); }
    .mod-ji .dv-tab { color: var(--dim); }
    .mod-ji .dv-recipe { font-family: var(--mono); color: var(--accent-ink); }
    .mod-ji .dv-rate { font-family: var(--mono); color: var(--text); font-weight: 600; }
    /* 建造参考：报告配方 + 备考（社区口径，非概率表） */
    .mod-ji .br-row {
      display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: baseline;
      padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 11.5px;
    }
    .mod-ji .br-row:last-of-type { border-bottom: 0; }
    .mod-ji .br-recipe { font-family: var(--mono); color: var(--accent-ink); font-weight: 600; }
    .mod-ji .br-note { color: var(--dim); font-size: 10.5px; line-height: 1.6; }
    /* 工厂实测反查：配方 → 你自己出过几件。与上面那张推定表并列，不是同一口径 */
    .mod-ji .fo-head { font-size: 10.5px; color: var(--dim); margin-bottom: 5px; line-height: 1.7; }
    .mod-ji .fo-head b { font-family: var(--mono); color: var(--text); font-size: 12px; }
    .mod-ji .fo-row {
      display: grid; grid-template-columns: minmax(96px,1.2fr) auto auto auto; gap: 8px;
      align-items: baseline; padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 11.5px;
    }
    .mod-ji .fo-row:last-of-type { border-bottom: 0; }
    .mod-ji .fo-recipe { font-family: var(--mono); font-weight: 600; color: var(--sub); }
    .mod-ji .fo-hit { color: var(--dim); font-size: 10.5px; }
    .mod-ji .fo-hit b { font-family: var(--mono); color: var(--text); font-size: 12px; }

       里面，所以高度得自己管住。<details> 的 min-height 默认 auto，展开后一步不肯让：
       同构复现里内容 963px、容器 .index 只有 580px，整块直接顶穿容器 438px，

    .mod-ji .rm-arrow { flex: none; display: grid; grid-template-rows: 1fr auto 1fr; align-items: center; justify-items: center; row-gap: 2px; padding: 0 4px; color: var(--dim); font-size: 11px; text-align: center; min-width: 52px; }

    .mod-ji .sec { padding: 12px 20px; border-bottom: 1px solid var(--line-soft); }
    /* 标题原本是 var(--sub)——比正文还淡，分类一多就扫不到。提到正文色，
       再给一个固定宽度的标记位（三角或色条）当左锚点，不占额外高度。 */
    /* nowrap：标题文字是匿名弹性项，行挤的时候会被压缩到词中折行

    .mod-ji .sec-h { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; font-size: 12px; font-weight: 600; color: var(--text); letter-spacing: 1px; white-space: nowrap; }

    .mod-ji .sec-h .aux.ok { color: var(--ok); }

       （.mod-ji .sec-h 实测过）；标题一律不折，折行让给 .aux 说明。 */
    .mod-bi .sec-h, .mod-zi .scard .h, .mod-ji .ak-h, .mod-ru .dbio-h,

    /* 不折叠的常驻段（属性、基础信息这类）：色条占住标记位，与可折叠段的三角左边缘对齐。
       必须写 :not([data-foldable])，否则它优先级高过下面的通用三角规则，三角画不出来。 */
    .mod-ji .sec:not([data-foldable]) > .sec-h::before {
      content: ''; flex: none; width: 3px; height: 11px; margin-right: 7px;
      background: var(--accent); border-radius: 1px;
    }
    .mod-ji .sec[data-foldable]:not([data-open]) > .sec-h { margin-bottom: 0; }
    /* 折起来也不用另加计数：.aux 本来就写着「共 7 条」「53 舰」这类，它在标题行里 */

    /* ---- 分段折叠（图鉴的 .sec 与镝的 .scard / .log 共用）----
       section-fold.ts 给容器打 data-foldable、给标题打 data-fold-head，
       所以这里不认识具体类名。各模块原有的 ::before 色条必须写成
       :not([data-foldable])，否则那些选择器优先级压过这里，三角画不出来。 */
    [data-foldable] > [data-fold-head] { cursor: pointer; user-select: none; }
    [data-foldable] > [data-fold-head]::before {
      content: ''; flex: none; width: 10px; height: 10px; margin-right: 0; border-radius: 0;
      background: var(--hc, var(--accent));
      /* clip-path 画三角，省一个字体依赖；折叠态朝右，展开态转 90 度朝下 */
      clip-path: polygon(28% 12%, 28% 88%, 82% 50%);
      transition: transform var(--motion-micro) ease, opacity var(--motion-micro) ease;
      opacity: .75;
    }
    [data-foldable] > [data-fold-head]:hover::before { opacity: 1; }
    [data-foldable][data-open] > [data-fold-head]::before { transform: rotate(90deg); }
    [data-foldable]:not([data-open]) > *:not([data-fold-head]) { display: none; }
    /* 分类组头（图鉴各卷目录、仓库的装饰品）是 align-items:baseline 的弹性行，
       而三角是个没有文字的空盒——按基线对会拿它的下边缘去贴文字基线，浮得偏高。

    .mod-es .fst-head[data-fold-head]::before { align-self: center; }

    .mod-ji .q-nm, .mod-ji .u-nm { font-weight: 600; }

    .mod-ji .ro-row {

      width: 100%; min-height: 54px; resize: vertical; background: var(--bg0); color: var(--text);
      border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px;
      font-family: var(--mono); font-size: 10.5px; outline: none;
    }
    .mod-ru .dbio-err { margin-top: 7px; padding: 6px 9px; border-radius: 5px; border: 1px solid var(--bad); color: var(--bad); font-size: 11px; }
    .mod-ru .dbio-warn { margin-top: 7px; padding: 6px 9px; border-radius: 5px; border: 1px solid var(--warn); color: var(--warn); font-size: 10.5px; line-height: 1.6; }
    .mod-ru .dbio-imported { margin-top: 8px; }
    .mod-ru .dbio-meta { font-size: 10px; color: var(--dim); font-family: var(--mono); }
    .mod-ru .dbio-fleet { margin-top: 7px; }
    .mod-ru .dbio-fleet-h { font-size: 10.5px; color: var(--sub); font-weight: 600; margin-bottom: 3px; }
    .mod-ru .dbio-ship {
      display: grid; grid-template-columns: minmax(120px, 1fr) 82px minmax(0, 2fr); gap: 8px;
      align-items: center; padding: 4px 7px; border-bottom: 1px solid var(--line-soft); font-size: 10.5px;
    }
    .mod-ru .dbio-ship.miss { opacity: 0.72; }
    .mod-ru .dbio-name i { font-style: normal; color: var(--dim); font-family: var(--mono); font-size: 9.5px; margin-left: 5px; }
    .mod-ru .dbio-own { font-size: 9.5px; color: var(--ok); }
    .mod-ru .dbio-ship.miss .dbio-own { color: var(--warn); }
    .mod-ru .dbio-eqs { display: flex; flex-wrap: wrap; gap: 4px; }
    .mod-ru .dbio-eq {
      font-size: 9.5px; padding: 1px 5px; border-radius: 3px;
      background: var(--bg0); border: 1px solid var(--line-soft); color: var(--sub);
    }
    .mod-ru .dbio-eq.miss { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); color: var(--warn); }
    .mod-ru .dbio-eq.empty { color: var(--dim); border-style: dashed; }
    .mod-ru .dbio-note { margin-top: 8px; font-size: 10px; color: var(--dim); line-height: 1.7; }
    .mod-ru .dbio-note b { color: var(--sub); }

    /* 矿脉健康度（钥） */
    .mod-yu .yhealth {
      display: grid; gap: 3px; margin: 6px 0; padding: 7px 9px;
      border: 1px solid var(--line); border-left-width: 3px; border-radius: 5px;
      background: var(--bg0); font-size: 10.5px; line-height: 1.7;
    }
    .mod-yu .yhealth b { color: var(--text); font-weight: 600; }
    .mod-yu .yhealth span { color: var(--sub); }
    .mod-yu .yhealth.ok { border-left-color: var(--ok); }
    .mod-yu .yhealth.warn { border-left-color: var(--warn); }
    .mod-yu .yhealth.bad { border-left-color: var(--bad); }
    .mod-yu .ylayers { margin-top: 7px; display: grid; gap: 3px; }
    .mod-yu .yl-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
      padding: 3px 8px; background: var(--bg0); border: 1px solid var(--line-soft);
      border-radius: 4px; font-size: 10.5px;
    }
    /* 逐包影响：一包一行，包名等宽在前、影响在后。
       缺包那一行从前是「缺 N 包 + 一串 id + 一句通用话」，玩家看完仍不知道
       自己少了什么（2026-08-23 抓到的那处过时）。改成逐条摆之后行数会多，
       所以这里用小字号 + 紧行距，别让它挤走同一张卡里的海域情报统计。 */
    .mod-yu .yl-impacts { display: grid; gap: 2px; margin-top: 3px; }
    .mod-yu .yl-impact { color: var(--sub); font-size: 10px; line-height: 1.65; }
    .mod-yu .yl-impact .mono { color: var(--text); }
    .mod-yu .yl-map { font-family: var(--mono); color: var(--text); min-width: 44px; }
    .mod-yu .yl-ok { color: var(--ok); }
    .mod-yu .yl-empty { color: var(--dim); }
    .mod-yu .yl-absent { color: var(--warn); }

    /* 「更多分类」：顶栏放不下全部类别，展开后按主数据逐个列 */
    .mod-ji .chip.more { border: 1px dashed var(--line); background: none; color: var(--accent); }
    .mod-ji .chip.more.on { border-style: solid; border-color: var(--accent); background: var(--accent-wash); color: var(--accent-ink); }
    .mod-ji .cat-more {
      margin: 0 12px 8px; padding: 8px 10px; border: 1px solid var(--line);
      border-radius: 6px; background: var(--bg1);
    }
    .mod-ji .cat-more-h { font-size: 11px; color: var(--text); margin-bottom: 6px; }
    .mod-ji .cat-more-h span { margin-left: 8px; font-size: 9.5px; color: var(--dim); }
    .mod-ji .cat-grid { display: flex; flex-wrap: wrap; gap: 4px; }
    .mod-ji .cat-cell {
      display: inline-flex; align-items: baseline; gap: 5px; cursor: pointer;
      padding: 2px 8px; border-radius: 5px; background: var(--bg0);
      border: 1px solid var(--line-soft); font-size: 10.5px; color: var(--sub);
    }
    .mod-ji .cat-cell:hover { border-color: var(--accent-dim); color: var(--text); }
    .mod-ji .cat-cell.on { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); }
    .mod-ji .cat-cell i { font-style: normal; font-family: var(--mono); font-size: 9.5px; color: var(--dim); }
    .mod-ji .cat-cell.on i { color: var(--accent-ink); }

    /* 分维度的「更多分类」（舰种 / 国籍 / 型 / 编队）。
       每段自带 --dim-c，选中态与抬头都取这一枚——四个维度同屏时靠颜色分家。
       面板长在 .ship-list（唯一的滚动容器）里面，所以自己不再开滚动条，
       也不占 flex 名额——挂在列表外面时它会把列表压成 0 高（实测 2502px vs 726px）。
       深海卷两页从前正是挂在外面的，2026-08-28 已按同一处置挪进去（ji.ts:6494/6868）：
       深海装备 25 枚 cat-cell 在 280px 窄坞里排 10 行、整块 294px，而坞拖到下限时
       .index 只有 261px，列表归零、面板底部 204px 被 .mod-ji 的 overflow:hidden
       裁掉——那截玩家够不着，祖先链上一个 overflow-y:auto 都没有。 */
    .mod-ji .ship-list > .cat-more { margin: 8px 12px 10px; }
    .mod-ji .cat-sec + .cat-sec { margin-top: 6px; border-top: 1px solid var(--line-soft); padding-top: 6px; }
    /* 抬头行 = 手风琴的把手：整行可点，右端常驻显示这一段选中的东西 */
    .mod-ji .cat-sec .cat-more-h {
      display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
      margin: 0; padding: 3px 4px; border-radius: 5px; cursor: pointer; user-select: none;
    }
    .mod-ji .cat-sec .cat-more-h:hover { background: var(--bg2); }
    .mod-ji .cat-sec .cat-more-h:focus-visible { outline: 1px solid var(--dim-c, var(--accent)); }
    .mod-ji .cat-sec .cat-more-h b { color: var(--dim-c, var(--text)); font-weight: 600; }
    .mod-ji .cat-sec .cat-more-h span { margin-left: 0; }
    .mod-ji .cat-arrow {
      font-style: normal; font-size: 9px; color: var(--dim); flex: none;
      transition: transform .12s ease; display: inline-block; transform: rotate(-90deg);
    }
    .mod-ji .cat-sec.open > .cat-more-h .cat-arrow { transform: rotate(0deg); }
    /* 选中项 chip：收起来也看得见、点得着——状态不许跟着内容一起藏 */
    .mod-ji .cat-picked {
      margin-left: auto; font-size: 10px; padding: 1px 8px; border-radius: 9px; cursor: pointer;
      background: color-mix(in srgb, var(--dim-c) 18%, var(--bg0));
      border: 1px solid var(--dim-c); color: var(--dim-c);
    }
    .mod-ji .cat-picked:hover { background: color-mix(in srgb, var(--dim-c) 30%, var(--bg0)); }
    /* 段内就地过滤：只缩小格子，清空恢复全量 */
    .mod-ji .cat-find { display: flex; align-items: center; gap: 5px; margin: 6px 0 2px; }
    .mod-ji .cat-find input {
      flex: 1; min-width: 0; max-width: 300px; background: var(--bg0); color: var(--text);
      border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px;
      font-size: 11px; font-family: inherit; outline: none;
    }
    .mod-ji .cat-find input:focus { border-color: var(--dim-c, var(--accent)); }
    .mod-ji .cat-find .x { cursor: pointer; color: var(--dim); font-size: 12px; padding: 0 2px; }
    .mod-ji .cat-find .x:hover { color: var(--bad); }
    .mod-ji .cat-none { font-size: 10.5px; color: var(--dim); padding: 4px 2px; }
    .mod-ji .cat-sec .cat-cell.on {
      background: color-mix(in srgb, var(--dim-c) 16%, var(--bg0));
      border-color: var(--dim-c); color: var(--dim-c);
    }
    .mod-ji .cat-sec .cat-cell:hover { border-color: color-mix(in srgb, var(--dim-c) 55%, var(--line)); }
    .mod-ji .cat-sec .cat-cell.on i { color: var(--dim-c); }
    .mod-ji .cat-sub { font-size: 9.5px; color: var(--dim); margin: 6px 0 3px; }
    .mod-ji .cat-sub:first-child { margin-top: 0; }
    /* 选中项浮出成彩色 chip（顶栏），颜色 = 该维度色 */
    .mod-ji .chip.dim-on {
      background: color-mix(in srgb, var(--dim-c) 18%, var(--bg2));
      border-color: var(--dim-c); color: var(--dim-c);
    }
    /* 排序切换：与 chip 同一条线上的分段控件 */
    .mod-ji .sort-seg { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .mod-ji .sort-seg span { font-size: 11px; padding: 2px 8px; cursor: pointer; color: var(--sub); background: var(--bg2); }
    .mod-ji .sort-seg span.on { background: var(--accent-dim); color: #fff; }
    /* 详情页「编队」小节 */
    .mod-ji .hf-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; padding: 4px 0; border-top: 1px solid var(--line-soft); }
    .mod-ji .hf-row:first-child { border-top: none; }
    .mod-ji .hf-name { font-size: 11.5px; flex: none; }
    .mod-ji .hf-period { font-size: 9.5px; color: var(--dim); }
    .mod-ji .hf-mates { display: flex; flex-wrap: wrap; gap: 5px; font-size: 10.5px; }
    .mod-ji .hf-mates .miss { color: var(--dim); }
    .mod-ji .hf-flag { font-size: 9.5px; color: var(--gold); }
    .mod-ji .hf-note { font-size: 10.5px; color: var(--sub); line-height: 1.5; margin-top: 2px; flex: 1 1 100%; }
    .mod-ji .hf-tag { font-size: 9.5px; color: var(--entity-histfleet); opacity: .85; }

    /* 仓库与图鉴共用「更多分类」的样式，只是作用域不同 */
    .mod-es .chip.more { border: 1px dashed var(--line); background: none; color: var(--accent); }
    .mod-es .chip.more.on, .mod-es .chip.linked { border-style: solid; border-color: var(--accent); background: var(--accent-wash); color: var(--accent-ink); }
    .mod-es .cat-more { margin: 0 14px 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg1); }
    .mod-es .cat-more-h { font-size: 11px; color: var(--text); margin-bottom: 6px; }
    .mod-es .cat-more-h span { margin-left: 8px; font-size: 9.5px; color: var(--dim); }
    .mod-es .cat-grid { display: flex; flex-wrap: wrap; gap: 4px; }
    .mod-es .cat-cell { display: inline-flex; align-items: baseline; gap: 5px; cursor: pointer; padding: 2px 8px; border-radius: 5px; background: var(--bg0); border: 1px solid var(--line-soft); font-size: 10.5px; color: var(--sub); }
    .mod-es .cat-cell:hover { border-color: var(--accent-dim); color: var(--text); }
    .mod-es .cat-cell.on { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); }
    .mod-es .cat-cell i { font-style: normal; font-family: var(--mono); font-size: 9.5px; color: var(--dim); }


    /* ══ 鉴 · 仓库（装备在籍轴，.mod-es 作用域）══ */
    .mod-es { overflow: hidden; }
    /* min-width: 0 是配 .es-table 的 min-width 用的：没有它，表格的最小内容宽会顺着
       flex 项的 min-width:auto 一路把整个 es-app（连筛选条一起）撑出坞外。 */
    .mod-es .es-app { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg0); }
    .mod-es .es-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 8px 14px; background: var(--bg1); border-bottom: 1px solid var(--line);
    }
    .mod-es .es-bar.sub { background: var(--bg0); padding: 6px 14px; }
    .mod-es .es-sp { flex: 1; }
    .mod-es .es-search {
      background: var(--bg0); border: 1px solid var(--line); border-radius: 6px;
      padding: 4px 9px; color: var(--text); font-size: 12px; font-family: inherit;
      outline: none; width: 150px;
    }
    .mod-es .type-chips { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .mod-es .chip {
      font-size: 10.5px; padding: 2px 9px; border-radius: 10px; cursor: pointer;
      background: var(--bg2); color: var(--sub); border: 1px solid transparent;
    }
    .mod-es .chip.on { background: var(--accent-dim); color: #fff; }
    .mod-es .chip.sm { background: none; border: 1px dashed var(--line); color: var(--accent); }
    .mod-es .chip.sm.on { border-style: solid; border-color: var(--accent); background: var(--accent-wash); }
    .mod-es .es-cap, .mod-es .es-hint { font-size: 10.5px; color: var(--dim); font-family: var(--mono); }
    .mod-es .es-cap b, .mod-es .es-hint b { color: var(--text); }
    /* 仓库两轴切换（装备 | 装饰品）：外观随鉴的 .equip-mode */
    .mod-es .es-mode {
      flex: none; display: flex; overflow: hidden; border: 1px solid var(--line);
      border-radius: 6px; background: var(--bg0);
    }
    .mod-es .es-mode button {
      border: 0; border-left: 1px solid var(--line); padding: 5px 9px;
      background: transparent; color: var(--dim); font: 10.5px var(--sans); cursor: pointer;
    }
    .mod-es .es-mode button:first-child { border-left: 0; }
    .mod-es .es-mode button.on { background: var(--accent-dim); color: #fff; }
    /* 装饰品（家具）清单 */
    .mod-es .fst-coins { display: inline-flex; align-items: center; gap: 4px; }
    .mod-es .es-furniture { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 14px 16px; }
    .mod-es .fst-group { margin-bottom: 12px; }
    .mod-es .fst-head {
      display: flex; align-items: baseline; gap: 8px; padding: 6px 0 4px;
      font-size: 12px; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--line);
    }
    .mod-es .fst-head i { font: 10px var(--mono); color: var(--dim); }
    .mod-es .fst-row {
      display: flex; align-items: baseline; gap: 8px; padding: 3.5px 4px;
      border-bottom: 1px dashed var(--line-soft, var(--line)); font-size: 11.5px;
    }
    .mod-es .fst-row.focus { background: var(--accent-wash, rgba(77,184,255,.08)); border-radius: 4px; }
    .mod-es .fst-row.lack .fst-name { color: var(--dim); }
    .mod-es .fst-name { color: var(--text); min-width: 0; }
    .mod-es .fst-star { font-size: 9.5px; color: var(--gold); letter-spacing: 1px; }
    .mod-es .fst-active {
      font-size: 8.5px; color: var(--accent); border: 1px solid #24475f;
      border-radius: 2px; padding: 0 4px;
    }
    .mod-es .fst-lack { font-size: 8.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; }
    .mod-es .fst-price { margin-left: auto; font: 10px var(--mono); color: var(--dim); flex: none; }
    .mod-es .fst-none { padding: 6px 4px; font-size: 10.5px; color: var(--dim); }
    .mod-es .fst-row { cursor: pointer; }
    .mod-es .type-chips .chip.on { background: var(--accent-dim); color: #fff; }
    .mod-es .fst-row.open { background: var(--bg2); border-radius: 4px 4px 0 0; border-bottom-color: transparent; }
    .mod-es .fst-detail {
      margin: 0 0 6px; padding: 8px 10px; background: var(--bg2);
      border-radius: 0 0 6px 6px; border-bottom: 1px dashed var(--line-soft, var(--line));
    }
    .mod-es .fst-detail img { max-width: 100%; max-height: 220px; object-fit: contain; border-radius: 5px; display: block; }
    .mod-es .fst-desc { margin-top: 7px; font-size: 11px; color: var(--sub); line-height: 1.5; white-space: pre-line; }
    .mod-es .fst-meta { margin-top: 5px; font: 10px var(--mono); color: var(--dim); }
    .mod-es .fst-bgm { margin-top: 6px; font-size: 10.5px; color: var(--sub); }
    .mod-es .fst-img-missing { padding: 14px 0; font-size: 10.5px; color: var(--dim); }
    .peek .p-media .furniture-preview { max-width: 100%; max-height: 110px; object-fit: contain; border-radius: 4px; }
    .mod-es .es-lk { font-size: 11px; color: var(--accent); cursor: pointer; }
    .mod-es .es-lk:hover { text-decoration: underline; }
    .mod-es .es-body { flex: 1; min-height: 0; display: flex; }
    .mod-es .es-table-wrap { flex: 1.7; min-width: 0; overflow: auto; }
    /* 定列宽：auto 布局下「所在」会被长舰名（大和改二重 · 补强增设）撑开，
       把最右的「锁」挤出可视区——那一列恰恰是清理时最要看的。 */
    /* min-width：坞窄下来时让 .es-table-wrap 横向滚，别去压「装备」那一列。
       没有它时 437px 的左坞把名字列压到 151px，「毗式40mm连装机枪」这类被拦腰截断
       （见下一条：截断处还画不出省略号）。 */
    .mod-es .es-table { width: 100%; min-width: 560px; table-layout: fixed; border-collapse: collapse; font-size: 11.5px; }
    .mod-es .es-table th.st, .mod-es .es-table td.st { width: 52px; }
    .mod-es .es-table th.av, .mod-es .es-table td.av { width: 46px; }
    .mod-es .es-table th.wh, .mod-es .es-table td.wh { width: 34%; }
    .mod-es .es-table th.lk, .mod-es .es-table td.lk { width: 34px; }
    .mod-es .es-table td.nm, .mod-es .es-table td.wh { overflow: hidden; text-overflow: ellipsis; }
    .mod-es .es-table thead th {
      position: sticky; top: 0; z-index: 2; background: var(--bg1);
      text-align: left; font-size: 10px; color: var(--dim); font-weight: 400;
      padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer;
    }
    .mod-es .es-table thead th:hover { color: var(--sub); }
    .mod-es .es-table th.cx, .mod-es .es-table td.cx { text-align: center; }
    .mod-es .es-table tbody td { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
    .mod-es .es-table tbody tr { cursor: pointer; }
    .mod-es .es-table tbody tr:hover td { background: var(--bg3); }
    .mod-es .es-table tbody tr.on td { background: var(--bg3); box-shadow: inset 2px 0 0 var(--accent); }
    /* 三级明度阶梯：款最亮、档居中、实例最暗。
       原来款没设底色（透明＝bg0）而实例正好也是 bg0，父子同色分不出层级。 */
    .mod-es .es-group td { background: var(--bg2); border-bottom-color: var(--line); }
    .mod-es .es-group td.nm b { font-weight: 600; }
    /* 一款一行；展开后的实例行缩进、底色压一档，扫的时候不会和款混淆 */
    .mod-es .es-caret { flex: none; width: 10px; color: var(--dim); font-size: 9px; }
    .mod-es .es-group.open .es-caret { color: var(--accent); }
    /* 同状态档：一款之内改修/熟练/锁/去向都相同的实例收成一行 */
    .mod-es .es-variant td { background: var(--bg1); }
    .mod-es .es-variant td.nm { padding-left: 24px; }
    .mod-es .es-variantname { font-size: 10.5px; color: var(--sub); }
    .mod-es .es-variantname b { font-family: var(--mono); color: var(--text); }
    /* 可动用 = 闲置且未锁，清理时唯一需要一眼扫到的那一批。
       绿条按层级给不同粗细：三级都画同一根，左边就成了一整条绿柱。 */
    .mod-es .es-group.spare td.nm { box-shadow: inset 3px 0 0 var(--ok); }
    .mod-es .es-variant.spare td.nm { box-shadow: inset 2px 0 0 color-mix(in srgb, var(--ok) 70%, transparent); }
    .mod-es .es-inst.spare td.nm { box-shadow: inset 1px 0 0 color-mix(in srgb, var(--ok) 55%, transparent); }
    .mod-es .es-caret.dim { color: var(--line); cursor: default; }
    .mod-es .es-lockword { font-size: 9.5px; color: var(--gold); }
    .mod-es .es-inst td.nm { padding-left: 44px; }
    .mod-es .es-inst td { background: var(--bg0); border-bottom-color: var(--line-soft); }

    .mod-es .es-empty { padding: 24px 12px; color: var(--dim); text-align: center; }
    /* max-width: 100% —— 它是 table-cell 里的 inline-flex，没有这一条就不受单元格
       约束，会径直溢出去让 td 的 overflow:hidden 拦腰切掉（省略号也就落不下来）。 */
    .mod-es .es-namecell { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }

    .mod-es .es-count { font-size: 9.5px; color: var(--dim); font-family: var(--mono); }
    /* td.nm 上的 text-overflow 对「溢出的是 inline-flex 原子盒」不生效——名字会被
       拦腰切在字形中间（「毗式40mm连装机枧」），一个省略号都画不出来。

    .mod-es .es-namecopy > b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .mod-es .es-preview { padding: 12px 14px; font-size: 11px; line-height: 1.7; }

    /* ══ 铨 · 舰娘列表（移植自设计稿 11，.mod-qa 作用域）══ */
    .mod-qa { overflow: hidden; }

    .mod-qa .fchip.lvlsub.on { border-color: var(--accent-dim); color: var(--accent); }

    .mod-qa table { width: 100%; border-collapse: collapse; font-size: 11.5px; }

    }

    .mod-qa thead th.sort { color: var(--accent); }
    .mod-qa tbody td { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; vertical-align: middle; }
    .mod-qa tbody tr { cursor: pointer; }
    .mod-qa tbody tr:hover td { background: var(--bg1); }
    .mod-qa tbody tr.on td { background: var(--bg3); box-shadow: inset 2px 0 0 var(--accent); }
    .mod-qa tbody tr.cmp td { box-shadow: inset 2px 0 0 var(--gold); }
    .mod-qa tbody tr.dim td { opacity: 0.55; }
    .mod-qa td.nm b { font-weight: 600; font-size: 12px; }
    .mod-qa .qa-namecell { display: inline-flex; align-items: center; min-width: 0; }
    .mod-qa .qa-namecopy { min-width: 0; }
    .mod-qa td.nm .sub { display: block; font-size: 9.5px; color: var(--dim); font-family: var(--mono); line-height: 1.3; }
    .mod-qa td.nm .sally {

    .mod-qa td.nm .marry { font-size: 8.5px; color: var(--gold); border: 1px solid #4a3f22; border-radius: 2px; padding: 0 4px; margin-left: 5px; vertical-align: 1px; }
    .mod-qa td.nm .dup { font-size: 8.5px; color: var(--bad); border: 1px solid #5c2c38; border-radius: 2px; padding: 0 4px; margin-left: 5px; vertical-align: 1px; }

    .mod-qa .cnd.tired { border-color: var(--warn); color: var(--warn); }
    .mod-qa .cnd.bad { border-color: var(--bad); color: var(--bad); }
    .mod-qa .cnd.dock { border-color: var(--dock); color: var(--dock); font-size: 8px; }
    .mod-qa td.rmd { font-size: 10.5px; }
    .mod-qa td.rmd .fin { color: var(--dim); }
    .mod-qa td.rmd .go { color: var(--ok); font-weight: 600; }
    .mod-qa td.rmd .near b { color: var(--text); font-weight: 600; }
    /* 双向（可逆）形态切换：中性色——它不是待办，别跟单向缺口抢眼睛 */
    .mod-qa td.rmd .flip { color: var(--sub); }
    .mod-qa td.rmd .flip b { color: var(--sub); font-weight: 600; }

    .mod-qa td.rmd .sub { display: block; font-size: 9px; color: var(--dim); line-height: 1.3; max-width: 200px; white-space: normal; }
    .mod-qa td.mod { letter-spacing: 2px; font-size: 9px; }

    .mod-qa td.mod s.t { background: #8fb8e0; }
    .mod-qa td.mod s.a { background: var(--air); }
    .mod-qa td.mod s.r { background: #e8c66a; }

    .mod-qa td.lk { text-align: center; font-size: 10px; }

    .mod-qa td.lk .off2 { color: #3a4a58; }

      display: flex; align-items: center; gap: 14px; padding: 7px 14px; flex: none; flex-wrap: wrap;

    /* 单独界面（2026-08-11 用户拍板）：点行后整面板切到这一艘的详情页。
       原「右侧栏预览 + 窄态行下展开」两套版式被否掉，一律接管式。 */
    .mod-qa .qa-detail { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg0); }
    .mod-qa .qa-detail.enter { animation: kanso-subview-enter var(--motion-view) var(--motion-ease) both; }
    .mod-qa .dv-head {
      display: flex; align-items: center; gap: 9px; padding: 8px 12px; flex-wrap: wrap;
      background: var(--bg1); border-bottom: 1px solid var(--line); font-size: 11.5px;

    .mod-qa .dv-head .crumb { color: var(--sub); min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    .mod-qa .dv-head .r { color: var(--accent); cursor: pointer; font-size: 10.5px; white-space: nowrap; }

    .mod-qa .stat .v .sg-t-over99 { color: var(--stat-over99); }

    .mod-qn .period-timer,
    .mod-qn .schip,
    .mod-qn .quick {

    .mod-qn .period-timer > b { color: var(--dim); font: 8.5px var(--mono); font-weight: 500; }
    .mod-qn .period-timer:hover, .mod-qn .period-timer.on {
      border-color: var(--accent); background: #142b3a;
    }
    .mod-qn .period-timer.on > span, .mod-qn .period-timer.on > b { color: var(--accent-ink); }
    .mod-qn .q-control-strip {
      display: flex; align-items: center; gap: 6px; min-width: 0;
      padding: 4px 7px;
    }
    .mod-qn .qsearch {
      flex: 0 0 240px; min-width: 170px; max-width: 290px; margin: 0;
      padding-block: 3px;
      background: var(--bg0);
    }
    .mod-qn .q-period-strip { flex: 1 1 auto; }
    .mod-qn .stat-chips, .mod-qn .quick-chips {
      display: flex; align-items: center; gap: 4px; min-width: 0; overflow-x: auto;
      scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }
    .mod-qn .stat-chips { flex: none; }
    .mod-qn .schip, .mod-qn .quick {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 3px 7px; border-radius: 10px; font-size: 9.5px;
    }
    .mod-qn .schip.on, .mod-qn .quick.on2 {
      border-color: var(--accent); background: var(--accent-dim); color: #fff; text-decoration: none;

    .mod-qn .schip.gold.on { background: var(--gold); color: #111820; border-color: var(--gold); }

    .mod-qn .quick-toggle, .mod-qn .quest-tree-open {

      background: var(--bg2); color: var(--dim); cursor: pointer; font-size: 9.5px;

    .mod-qn .quick-toggle:hover, .mod-qn .quick-toggle.on,
    .mod-qn .quest-tree-open:hover {
      border-color: var(--accent-dim); color: var(--accent); background: #152632;
    }
    .mod-qn .quest-tree-open {
      border-color: #355266; color: #9fd8ff; background: #13232e;
    }
    .mod-qn .q-quick-panel {
      display: none; align-items: center; gap: 4px; min-width: 0;
      padding: 4px 7px; border-top: 1px solid var(--line-soft);

    }

    .mod-qn .q-work { flex: 1; min-height: 0; min-width: 0; display: flex; position: relative; overflow: hidden; }

    .mod-qn .q-empty { padding: 30px 16px; color: var(--dim); text-align: center; }
    .mod-qn .q.selected { background: #122633; box-shadow: inset 3px 0 0 var(--accent); }
    .mod-qn .q-cat-label {
      padding: 0 5px; border-radius: 3px; background: var(--bg3);
      /* dim 落在 bg3 上只有 3.8:1，8.5px 的小字扛不住，用 sub（≈5.3:1） */

    }
    .mod-qn .st-tag.paused { color: #f0c890; border-color: #70512f; background: #2a2118; }

    .mod-qn .q-drawer {
      position: relative; z-index: 7;
      flex: 0 0 0; width: 0; min-width: 0; overflow: hidden;
      display: flex; flex-direction: column;
      background: var(--bg1); border-left: 1px solid var(--line);
      box-shadow: -12px 0 28px rgba(0, 0, 0, .35);
      visibility: hidden; opacity: 0;
      transition: flex-basis var(--motion-view) var(--motion-ease), width var(--motion-view) var(--motion-ease), opacity var(--motion-fast) ease, visibility 0s linear var(--motion-view);
    }
    .mod-qn .q-drawer.open {
      flex-basis: clamp(340px, 44%, 520px);
      width: clamp(340px, 44%, 520px);
      visibility: visible; opacity: 1;
      transition: flex-basis var(--motion-view) var(--motion-ease), width var(--motion-view) var(--motion-ease), opacity var(--motion-fast) ease;

    .mod-qn .q-drawer-head b { color: var(--accent); font-size: 11.5px; }
    .mod-qn .q-drawer-head button {
      width: 27px; height: 27px; border: 1px solid var(--line); border-radius: 5px;
      background: var(--bg2); color: var(--sub); cursor: pointer; font-size: 16px;
    }
    .mod-qn .q-drawer-head button:hover { border-color: var(--bad); color: #ff9bab; }
    .mod-qn .q-drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; }
    .mod-qn .q-section {
      margin-bottom: 9px; padding: 9px 10px;
      border: 1px solid var(--line-soft); border-radius: 7px; background: var(--bg0);
    }
    .mod-qn .q-section > h4 {
      margin: 0 0 7px; color: var(--dim); font-size: 9.5px;
      font-weight: 600; letter-spacing: .7px;
    }
    .mod-qn .q-zh > b { color: var(--text); font-size: 14px; font-family: var(--serif); }
    .mod-qn .q-zh p, .mod-qn .q-memo p, .mod-qn .q-original p {
      margin: 5px 0 0; color: var(--sub); font-size: 11px; line-height: 1.75;
      white-space: pre-wrap;
    }
    .mod-qn .q-zh .dim { color: var(--dim); }
    /* 文中提醒：句子里点一下「几艘、几次、什么判定、哪张图、不许带什么」。
       这是马克笔不是链接——没有指针、没有 hover 反馈、不跳转，
       跟下面「相关内容」那份可点的实体清单是两回事，别越界长成一样。 */
    .mod-qn .qh {
      border-radius: 2px; padding: 0 2px;
      /* 中文哪里都能断行，记号被撕成两半就不像一个整体了；
         点出来的都是三五个字的短词，整块换行不会撑破抽屉 */
      white-space: nowrap;
      color: var(--qh-color, var(--text));
      background: color-mix(in srgb, var(--qh-color, var(--text)) 14%, transparent);
    }
    .mod-qn .qh-num { --qh-color: var(--gold); font-weight: 600; }
    .mod-qn .qh-rank { --qh-color: var(--warn); font-weight: 600; }
    .mod-qn .qh-limit { --qh-color: var(--bad); font-weight: 600; }
    .mod-qn .qh-map { --qh-color: var(--entity-map); }
    .mod-qn .qh-ship { --qh-color: var(--entity-ship); }
    .mod-qn .qh-equip { --qh-color: var(--entity-equip); }
    .mod-qn .qh-nationality { --qh-color: var(--entity-nationality); }
    /* 舰种、舰级说的是「哪一类船」，比专名弱一档：只描个底线，
       否则「以驱逐舰四艘编成驱逐队」整句都在发光，等于没有重点。 */
    .mod-qn .qh-type {
      padding: 0; background: none; color: var(--sub);
      border-bottom: 1px dotted color-mix(in srgb, var(--entity-ship) 50%, transparent);
    }
    /* 列表行是 10.5px 的单行摘要，底纹在那个密度下会糊成一条彩带，只留字色 */
    .mod-qn .q-nm .plain .qh { padding: 0; background: none; }
    .mod-qn .q-original { margin-top: 8px; border-top: 1px solid var(--line-soft); padding-top: 6px; }
    .mod-qn .q-original summary { color: var(--accent); cursor: pointer; font-size: 10px; }
    .mod-qn .q-original > b { display: block; margin-top: 6px; color: var(--dim); font-size: 11px; }
    .mod-qn .counter-paused {
      margin: 6px 0; padding: 5px 7px; border: 1px solid #70512f; border-radius: 5px;
      background: #2a2118; color: #f0c890; font-size: 10px;
    }
    /* 「为什么没在计数」：结论一行 + 怎么办一行。why 是需要用户动手的，plain 只是说明 */
    .mod-qn .counter-why {
      display: grid; gap: 3px; margin: 6px 0; padding: 7px 9px;
      border: 1px solid var(--line); border-left-width: 3px; border-radius: 5px;
      background: var(--bg0); font-size: 10.5px; line-height: 1.6;
    }

    .mod-qn .fleet-goal-row {

      color: var(--sub); font-size: 11px; line-height: 1.6;
    }

    .mod-qn .fleet-goal-row.ok { border-color: color-mix(in srgb, var(--ok) 38%, var(--line)); }
    .mod-qn .fleet-goal-row.ok b { color: var(--ok); }
    .mod-qn .fleet-goal-row.no { border-color: color-mix(in srgb, var(--warn) 32%, var(--line)); }
    .mod-qn .q-related .d-ent { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
    .mod-qn .q-entity-state { display: inline-flex; align-items: center; min-width: 0; }
    .mod-qn .q-entity-state.unavailable {
      opacity: .38; filter: grayscale(.82) brightness(.72);
    }
    .mod-qn .q-entity-state.unavailable:hover { opacity: .66; filter: grayscale(.45) brightness(.88); }
    .mod-qn .q-system {

    .mod-qn .reward-items { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .mod-qn .reward-none, .mod-qn .reward-copy { color: var(--dim); font-size: 10px; line-height: 1.6; }
    .mod-qn .reward-ship {

      border: 1px solid #2b4a37; border-radius: 5px; background: #11231b; font-size: 10px;
    }
    .mod-qn .reward-ship .ship-thumb { width: 28px; height: 24px; }
    .mod-qn .reward-ship b { color: var(--gold); font: 10px var(--mono); }
    .mod-qn .reward-advice { margin-bottom: 9px; padding: 9px 10px; }
    .mod-qn .q-chain > h4 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .mod-qn .quest-chain-tree {
      display: flex; flex-direction: column; gap: 0; min-width: 0;

    .mod-qn .chain-tree-current {
