    .mod-du .camp-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; overflow-y: auto; background: var(--bg0); }
    .mod-du .cq-stock { font-size: 12px; color: var(--sub); margin-bottom: 7px; }
    .mod-du .cq-stock b { font-family: var(--mono); font-size: 14px; color: var(--gold); }
    .mod-du .cq-stock .ts { font-size: 10px; color: var(--dim); }
    .mod-du .cq-group { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; border-top: 1px dashed var(--line-soft); }
    .mod-du .cq-k { flex: none; min-width: 52px; margin-top: 2px; font-size: 10px; color: var(--dim); }
    .mod-du .cq-list { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .mod-du .cq-row { display: flex; align-items: center; gap: 7px; font-size: 11.5px; min-width: 0; }
    .mod-du .cq-row .el { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mod-du .cq-chip { flex: none; font-size: 9.5px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; color: var(--dim); }
    .mod-du .cq-chip.on { color: var(--accent); border-color: var(--accent-dim); }
    .mod-du .cq-chip.done { color: var(--gold); border-color: #4a3f22; }

    /* ══ 钥 · 设置（.mod-yu 作用域）══ */
    .mod-yu { overflow: hidden; }
    /* 760 是设置正文的可读行宽上限；居中而不是左贴边——同一个浮层里「通知」页是满宽的，
       设置页左对齐时右侧会空出半屏纯黑（1280 浮层里 519px），读起来像少画了一块 */
    .mod-yu .yu-app { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 760px; margin-inline: auto; }
    /* 分类子顶栏：十八张卡按类分页，页签行常驻在滚动区顶部（形态照抄 .mod-ji .tabs：
       下划线选中、sticky）。上沿的 10px 由页签行自己出（.yu-app 的 padding-top 交给它），
       负的左右外边距让它铺满整条内容列，负的下外边距吃掉 flex gap——
       那 10px 改由它自己的 padding-bottom 出，于是滚动时卡片从**不透明**的条下面过，
       不会在缝里露出半行。
       窄了**换行**，不横向滚：一个面板只留一个滚动条，窄态也不藏内容。 */
    .mod-yu .ytabs {
      position: sticky; top: 0; z-index: 3;
      margin: 0 -10px -10px; padding: 10px 10px 10px;
      display: flex; flex-wrap: wrap; gap: 2px;
      background: var(--bg0); border-bottom: 1px solid var(--line-soft);
    }
    .mod-yu .ytab {
      padding: 4px 13px; font-size: 12px; color: var(--sub); cursor: pointer;
      border-bottom: 2px solid transparent; white-space: nowrap;
    }
    .mod-yu .ytab:hover { color: var(--text); }
    .mod-yu .ytab.on { color: var(--text); border-bottom-color: var(--accent); }
    .mod-yu .ycard { background: var(--bg1); border: 1px solid var(--line-soft); border-radius: 8px; padding: 11px 14px; }
    .mod-yu .ycard .h { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: 12px; color: var(--sub); margin-bottom: 8px; }
    .mod-yu .ycard .h::before { content: ''; width: 3px; height: 12px; border-radius: 2px; flex: none; background: var(--accent-dim); }
    .mod-yu .ycard .h b { color: var(--text); font-weight: 600; }
    .mod-yu .ycard .h .aux { margin-left: auto; font-size: 10px; color: var(--dim); }
    .mod-yu .yline { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 7px; font-size: 11.5px; color: var(--sub); }
    .mod-yu .ychip { font-size: 11px; padding: 2.5px 12px; border-radius: 11px; cursor: pointer; background: var(--bg2); color: var(--sub); border: 1px solid transparent; }
    .mod-yu .ychip.on { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); }
    .mod-yu .yin { min-width: 0; max-width: 100%; box-sizing: border-box; background: var(--bg0); border: 1px solid var(--line); border-radius: 5px; color: var(--text); padding: 3px 8px; font-size: 11.5px; font-family: var(--mono); width: 150px; outline: none; }
    .mod-yu .yin:focus { border-color: var(--accent-dim); }
    .mod-yu .yin.w60 { width: 64px; }
    .mod-yu .yin.wide { width: min(320px, 100%); }
    .mod-yu .yaudio-line { flex-wrap: nowrap; }
    .mod-yu .yaudio-line > span:first-child { width: 48px; flex: none; }
    .mod-yu .yaudio-range {
      flex: 1; min-width: 120px; max-width: 360px; height: 16px; margin: 0;
      appearance: none; background: transparent; cursor: pointer;
    }
    .mod-yu .yaudio-range::-webkit-slider-runnable-track {
      height: 4px; border-radius: 2px; background: var(--bg3); border: 1px solid var(--line-soft);
    }
    .mod-yu .yaudio-range::-webkit-slider-thumb {
      appearance: none; width: 13px; height: 13px; margin-top: -5px;
      border-radius: 50%; border: 1px solid var(--accent);
      background: var(--accent-ink); box-shadow: 0 0 0 3px rgba(65, 158, 203, .12);
    }
    .mod-yu .yaudio-value { width: 40px; flex: none; text-align: right; color: var(--text); font: 11px var(--mono); }
    .mod-yu .yrow { display: flex; align-items: center; gap: 10px; padding: 6px 2px; border-bottom: 1px dashed var(--line-soft); }
    .mod-yu .yrow:last-of-type { border-bottom: none; }
    .mod-yu .yrow.dis { opacity: 0.55; }
    .mod-yu .ytx { flex: 1; min-width: 0; }
    .mod-yu .ytx b { display: block; font-size: 12px; font-weight: 600; }
    .mod-yu .ytx span { display: block; font-size: 10.5px; color: var(--dim); }
    .mod-yu .ysw { width: 34px; height: 18px; border-radius: 9px; background: var(--bg3); position: relative; cursor: pointer; flex: none; transition: var(--motion-fast); }
    .mod-yu .ysw i { position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--dim); transition: var(--motion-fast); }
    .mod-yu .ysw.on { background: var(--accent-dim); }
    .mod-yu .ysw.on i { left: 19px; background: #dff0ff; }
    .mod-yu .yrow.dis .ysw { cursor: not-allowed; }
    .mod-yu .ynote { font-size: 10.5px; color: var(--dim); line-height: 1.8; margin-top: 4px; }
    .mod-yu .ynote b { color: var(--sub); font-weight: 600; }
    /* pre-line：运行诊断把三条崩溃记录用 \n 串起来，默认折行会把它们挤成一行 */
    .mod-yu .ystatus { margin: 6px 0 2px; padding: 5px 8px; border-radius: 5px; border: 1px solid var(--line); color: var(--sub); background: var(--bg0); font-size: 10.5px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-line; }
    .mod-yu .ystatus.ok { border-color: rgba(77, 181, 145, .38); color: #9bd8c4; }
    .mod-yu .ystatus.working { border-color: rgba(201, 161, 89, .4); color: #d8bd82; }
    .mod-yu .ystatus.bad { border-color: rgba(210, 87, 107, .48); color: #f0a3b0; }
    .mod-yu .ylk { color: var(--accent); cursor: pointer; }
    .mod-yu .ybtn { display: inline-block; font-size: 11.5px; padding: 4px 14px; border-radius: 6px; cursor: pointer; background: var(--bg2); color: var(--sub); border: 1px solid var(--line); }
    .mod-yu .ybtn.warn { color: #ffb3bd; border-color: #5c2c38; }
    .mod-yu .ybtn.warn:hover { background: #33121b; }
    .mod-yu .ytable { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 11px; }
    .mod-yu .ytable td { padding: 3.5px 8px 3.5px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; overflow-wrap: anywhere; }
    .mod-yu .ytable td:nth-child(1), .mod-yu .ytable td:nth-child(2) { width: 24%; }
    .mod-yu .mono { font-family: var(--mono); font-size: 10.5px; }
    .mod-yu .dim { color: var(--dim); font-size: 10px; }
    /* 资料来源与许可：每组一行（来源名 · 许可 · 提供了什么）。
       窄了让「提供了什么」整段掉到下一行，绝不裁字段（纪律：窄容器不藏内容）——
       它的 flex-basis 就是那道换行阈值，别给它 nowrap 或 ellipsis。 */
    .mod-yu .ycredit { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 8px; padding: 6px 2px; border-bottom: 1px dashed var(--line-soft); }
    .mod-yu .ycredit:last-child { border-bottom: none; }
    .mod-yu .ycredit-name { font-size: 11.5px; font-weight: 600; color: var(--text); text-decoration: none; }
    .mod-yu .ycredit-name:hover { color: var(--accent); }
    .mod-yu .ycredit-lic { font-size: 10px; color: var(--dim); }
    .mod-yu .ycredit-what { flex: 1 1 260px; min-width: 0; font-size: 10.5px; line-height: 1.7; color: var(--sub); }
    .mod-yu .yfold { margin-top: 6px; }
    .mod-yu .yfold > summary { display: inline-flex; align-items: center; gap: 5px; list-style: none; cursor: pointer; font-size: 11px; color: var(--sub); }
    .mod-yu .yfold > summary::-webkit-details-marker { display: none; }
    .mod-yu .yfold > summary::before { content: '▸'; font-size: 11px; color: var(--dim); }
    .mod-yu .yfold[open] > summary::before { content: '▾'; }
    .mod-yu .yfold > summary:hover { color: var(--text); }

    /* ══ 史 · 回顾：跨模块的本地时间账 ══ */
    .mod-shi { overflow: hidden; min-height: 0; display: flex; flex-direction: column; container-type: inline-size; }
    .mod-shi .shi-app {
      flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;
      color: var(--text); background: var(--bg0);
    }
    .mod-shi .shi-head {
      flex: none; min-width: 0; display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--bg1);
    }
    .mod-shi .shi-head > div:first-child { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
    .mod-shi .shi-head > div:first-child b { flex: none; color: var(--sub); font-size: 11.5px; }
    .mod-shi .shi-head > div:first-child span {
      min-width: 0; color: var(--dim); font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mod-shi .shi-tabs {
      min-width: 0; margin-left: auto; display: flex; align-items: center; gap: 2px;
      overflow-x: auto; scrollbar-width: thin;
    }
    .mod-shi .shi-tabs button,
    .mod-shi .shi-range button,
    .mod-shi .shi-resource-chips button,
    .mod-shi .shi-node-maps button,
    .mod-shi .shi-item-filter button,
    .mod-shi .shi-session-chips button {
      flex: none; border: 1px solid transparent; border-radius: 5px; background: transparent;
      color: var(--dim); cursor: pointer; transition: color var(--motion-fast) ease, background var(--motion-fast) ease, border-color var(--motion-fast) ease;
    }
    .mod-shi .shi-tabs button { padding: 3px 7px; font-size: 10px; }
    .mod-shi .shi-tabs button:hover,
    .mod-shi .shi-range button:hover,
    .mod-shi .shi-resource-chips button:hover,
    .mod-shi .shi-node-maps button:hover,
    .mod-shi .shi-item-filter button:hover,
    .mod-shi .shi-session-chips button:hover { color: var(--sub); background: var(--bg2); }
    .mod-shi .shi-tabs button.on {
      color: var(--accent); border-color: var(--accent-dim); background: color-mix(in srgb, var(--accent-dim) 18%, transparent);
    }
    .mod-shi .shi-stage {
      position: relative; flex: 1; min-width: 0; min-height: 0; display: flex; overflow: hidden;
    }
    .mod-shi .shi-body {
      flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 10px;
    }
    .mod-shi .shi-battle-drawer {
      flex: 0 0 min(58%, 720px); min-width: 360px; min-height: 0; display: flex; flex-direction: column;
      border-left: 1px solid var(--line); background: var(--bg0);
      box-shadow: -12px 0 28px rgba(0, 0, 0, .2); animation: kanso-detail-enter var(--motion-fast) ease both;
    }
    @keyframes kanso-detail-enter {
      from { opacity: .7; transform: translate3d(12px, 0, 0); }
      to { opacity: 1; transform: none; }
    }
    .mod-shi .shi-battle-drawer > header {
      flex: none; min-width: 0; display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--bg1);
    }
    .mod-shi .shi-battle-drawer > header > div {
      min-width: 0; display: flex; flex: 1; flex-direction: column; gap: 2px;
    }
    .mod-shi .shi-battle-drawer > header b {
      overflow: hidden; color: var(--sub); font-size: 10.5px; white-space: nowrap; text-overflow: ellipsis;
    }
    .mod-shi .shi-battle-drawer > header span { color: var(--dim); font-size: 8.5px; }
    .mod-shi .shi-battle-drawer > header button {
      flex: none; width: 24px; height: 24px; padding: 0; border: 1px solid var(--line);
      border-radius: 6px; color: var(--dim); background: var(--bg0); cursor: pointer;
    }
    .mod-shi .shi-battle-drawer > header button:hover {
      color: var(--text); border-color: var(--accent-dim); background: var(--bg2);
    }
    .mod-shi .shi-battle-detail {
      flex: 1; min-width: 0; min-height: 0; display: flex; overflow: hidden;
    }
    .mod-shi .shi-battle-placeholder {
      flex: 1; display: grid; place-items: center; padding: 18px; color: var(--dim);
      font-size: 10px; text-align: center;
    }
    .mod-shi .shi-view { min-width: 0; }
    .mod-shi .shi-view.enter { animation: kanso-subview-enter var(--motion-fast) ease both; }
    .mod-shi .shi-view-head {
      min-width: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 6px 12px; margin-bottom: 8px;
    }
    .mod-shi .shi-view-head > div:first-child { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
    .mod-shi .shi-view-head b { color: var(--sub); font-size: 12px; }
    .mod-shi .shi-view-head span { color: var(--dim); font-size: 9.5px; }
    .mod-shi .shi-foot {
      flex: none; padding: 4px 10px; border-top: 1px solid var(--line-soft);
      color: var(--dim); background: var(--bg1); font-size: 8.5px; text-align: right;
    }
    .mod-shi .shi-loading,
    .mod-shi .shi-empty {
      padding: 18px 10px; color: var(--dim); font-size: 10px; line-height: 1.65; text-align: center;
    }
    .mod-shi .shi-loading { padding-top: 40px; }
    .mod-shi .shi-empty.large {
      min-height: 120px; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 7px;
    }
    .mod-shi .shi-note {
      margin-top: 8px; padding: 6px 8px; border-left: 2px solid var(--line);
      color: var(--dim); background: color-mix(in srgb, var(--bg2) 52%, transparent);
      font-size: 9px; line-height: 1.65;
    }
    .mod-shi .up { color: var(--ok) !important; }
    .mod-shi .down { color: var(--bad) !important; }
    .mod-shi .flat { color: var(--dim) !important; }

    .mod-shi .shi-kpis,
    .mod-shi .shi-event-kpis {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 8px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--line-soft);
    }
    .mod-shi .shi-kpis > span,
    .mod-shi .shi-event-kpis > span {
      min-width: 0; display: flex; align-items: baseline; gap: 6px; padding: 7px 9px;
      background: var(--bg1); border-right: 1px solid var(--line-soft);
    }
    .mod-shi .shi-kpis > span:last-child,
    .mod-shi .shi-event-kpis > span:last-child { border-right: 0; }
    .mod-shi .shi-kpis small,
    .mod-shi .shi-event-kpis small { color: var(--dim); font-size: 9px; }
    .mod-shi .shi-kpis b,
    .mod-shi .shi-event-kpis b { color: var(--text); font: 600 13px var(--mono); }

    .mod-shi .shi-overview-grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px;
    }
    .mod-shi .shi-overview-card {
      min-width: 0; min-height: 104px; display: flex; flex-direction: column; padding: 9px;
      border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: var(--bg1);
      text-align: left; cursor: pointer; transition: border-color var(--motion-fast) ease, background var(--motion-fast) ease, transform var(--motion-fast) ease;
    }
    .mod-shi .shi-overview-card:hover { border-color: var(--accent-dim); background: var(--bg2); } /* hover 只换底色不做位移，与其余卡片一致 */
    .mod-shi .shi-overview-card header { display: flex; align-items: baseline; justify-content: space-between; gap: 7px; }
    .mod-shi .shi-overview-card header b { color: var(--sub); font-size: 11px; }
    .mod-shi .shi-overview-card header span { color: var(--dim); font-size: 8.5px; }
    .mod-shi .shi-overview-card > div {
      flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-content: center; gap: 5px 9px; padding: 8px 0;
      color: var(--dim); font-size: 9px;
    }
    .mod-shi .shi-overview-card > div > span { display: inline-flex; align-items: center; gap: 3px; }
    .mod-shi .shi-overview-card > div strong { color: var(--text); font: 600 20px var(--mono); }
    .mod-shi .shi-overview-card footer { color: var(--accent); font-size: 9px; }
    .mod-shi .shi-official-record {
      margin-bottom: 8px; padding: 8px 9px; border: 1px solid var(--line);
      border-radius: 8px; background:
        linear-gradient(105deg, color-mix(in srgb, var(--accent) 5%, transparent), transparent 44%),
        var(--bg1);
    }
    .mod-shi .shi-official-record > header {
      display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 5px 10px;
      margin-bottom: 7px;
    }
    .mod-shi .shi-official-record > header > div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; }
    .mod-shi .shi-official-record > header b { color: var(--sub); font-size: 10.5px; }
    .mod-shi .shi-official-record > header span,
    .mod-shi .shi-official-record > header i { color: var(--dim); font-size: 8.5px; font-style: normal; }
    .mod-shi .shi-record-grid {
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); overflow: hidden;
      border: 1px solid var(--line-soft); border-radius: 6px; background: var(--line-soft);
    }
    .mod-shi .shi-record-grid > span {
      min-width: 0; display: flex; flex-direction: column; gap: 1px; padding: 5px 6px;
      border-right: 1px solid var(--line-soft); background: var(--bg0);
    }
    .mod-shi .shi-record-grid > span:last-child { border-right: 0; }
    .mod-shi .shi-record-grid small { color: var(--dim); font-size: 8px; }
    .mod-shi .shi-record-grid b {
      min-width: 0; overflow: hidden; color: var(--text); font: 600 10px var(--mono);
      white-space: nowrap; text-overflow: ellipsis;
    }
    .mod-shi .shi-record-grid i { color: var(--dim); font: normal 8px var(--mono); white-space: nowrap; }
    .mod-shi .shi-official-record .shi-medals { color: var(--gold) !important; }
    .mod-shi .shi-port-logs {
      margin-top: 7px; display: flex; flex-direction: column; gap: 2px;
      font-size: 10px; color: var(--sub); line-height: 1.5;
    }
    .mod-shi .shi-port-logs small { color: var(--dim); font-size: 8.5px; }
    .mod-shi .shi-record-airbase {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; margin-top: 6px;
      color: var(--dim); font-size: 8.5px;
    }
    .mod-shi .shi-record-airbase > span {
      display: inline-flex; gap: 3px; padding: 1px 5px; border: 1px solid var(--line-soft);
      border-radius: 7px; background: var(--bg0);
    }
    .mod-shi .shi-record-airbase b { color: var(--sub); font: 600 8.5px var(--mono); }
    .mod-shi .shi-official-record.empty { color: var(--dim); border-style: dashed; background: var(--bg1); }
    .mod-shi .shi-official-record.empty > header { margin-bottom: 3px; }
    .mod-shi .shi-official-record.empty p { margin: 0; font-size: 8.5px; line-height: 1.55; }

    /* 六档（7/30/90/180/365/全部）比原先三档宽一倍，窄面板里让它换行而不是顶出去 */
    .mod-shi .shi-range { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px; }
    .mod-shi .shi-range button { padding: 3px 8px; font-size: 9px; }
    .mod-shi .shi-range button.on { color: var(--text); border-color: var(--line); background: var(--bg2); }
    .mod-shi .shi-resource-chips {
      display: flex; gap: 4px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin;
    }
    .mod-shi .shi-resource-chips button {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px 7px; font-size: 9px;
    }
    .mod-shi .shi-resource-chips button.on {
      color: var(--text); border-color: color-mix(in srgb, var(--series) 55%, var(--line));
      background: color-mix(in srgb, var(--series) 11%, var(--bg1));
    }
    .mod-shi .shi-chart-card { padding: 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg1); }
    .mod-shi .shi-chart-title { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
    .mod-shi .shi-chart-title b { color: var(--sub); font-size: 10.5px; }
    .mod-shi .shi-chart-title span { color: var(--dim); font-size: 8.5px; }

    @container (max-width: 760px) {
      .mod-shi .shi-head { align-items: flex-start; flex-direction: column; gap: 5px; }
      .mod-shi .shi-tabs { width: 100%; margin-left: 0; }
      .mod-shi .shi-battle-drawer { flex-basis: 68%; min-width: 320px; }
      .mod-shi .shi-overview-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mod-shi .shi-record-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .mod-shi .shi-record-grid > span:nth-child(3) { border-right: 0; }
      .mod-shi .shi-event-list { grid-template-columns: 1fr; }
      .mod-shi .shi-item-row { grid-template-columns: 18px minmax(80px, 1fr) repeat(2, auto); }
      .mod-shi .shi-item-row > span:nth-of-type(4),
      .mod-shi .shi-item-row time { display: none; }
    }
    @container (max-width: 520px) {
      .mod-shi .shi-body { padding: 7px; }
      .mod-shi .shi-battle-drawer {
        position: absolute; z-index: 2; inset: 0; width: 100%; min-width: 0;
      }
      .mod-shi .shi-head > div:first-child span { display: none; }
      .mod-shi .shi-view-head > div:first-child { align-items: flex-start; flex-direction: column; gap: 2px; }
      .mod-shi .shi-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mod-shi .shi-kpis > span:nth-child(2) { border-right: 0; }
      .mod-shi .shi-kpis > span:nth-child(-n+2) { border-bottom: 1px solid var(--line-soft); }
      .mod-shi .shi-overview-grid,
      .mod-shi .shi-two-col { grid-template-columns: 1fr; }
      .mod-shi .shi-overview-card { min-height: 90px; }
      .mod-shi .shi-practice-days,
      .mod-shi .shi-history-list,
      .mod-shi .shi-node-list,
      .mod-shi .shi-node-timeline,
      .mod-shi .shi-item-list,
      .mod-shi .shi-item-timeline { max-height: 320px; }
      .mod-shi .shi-node-list,
      .mod-shi .shi-node-timeline { height: 320px; }
      .mod-shi .shi-mapgraph { height: 220px; }
      .mod-shi .shi-node-row { grid-template-columns: auto auto minmax(0, 1fr) auto; }
      .mod-shi .shi-node-battle { grid-template-columns: 1fr; }
      .mod-shi .shi-node-battle time { grid-row: auto; }
      .mod-shi .shi-item-change { grid-template-columns: 18px minmax(72px, 1fr) auto auto; }
      .mod-shi .shi-item-change time,
      .mod-shi .shi-item-change > span,
      .mod-shi .shi-item-change i { display: none; }
    }

    /* render() 新插入的内部面板也必须从关闭态起步，否则浏览器只看到最终帧。 */
    @starting-style {
      .peek.show { opacity: 0; transform: translate3d(0, 6px, 0) scale(.975); }
      .cmenu.show { opacity: 0; transform: translate3d(0, 5px, 0) scale(.98); }
      .mod-ji .book-wrap.open .drawer:not(.stable) { width: 0; border-left-color: transparent; }
      .mod-qn .q-drawer.open:not(.stable) { flex-basis: 0; width: 0; opacity: 0; }
      .mod-bi .bi-app.open .detail:not(.stable) { width: 0; border-left-color: transparent; }
    }
    @starting-style {
      .mod-qn.narrow .q-drawer.open:not(.stable) { width: 100%; transform: translateX(102%); }
    }

    /* ══ 小热区补齐：不足 24px 的关闭钮/小控件用透明 ::after 把可点范围扩到 ~24px，
       分隔条拖柄四周各扩 3px（视觉不变，只扩命中区） ══ */
    /* .sand-out 不在这一组里：它本来就 position:absolute（浮在行角，不占 grid 列），
       跟着这条改成 relative 会掉回 grid 流里占掉第 1 列——头像被挤进 1fr 列、
       装备格掉到第二行、行高从 53px 涨到 89px（2026-08-20 在副本实例上实测）。
       absolute 一样是「已定位」，
       下面那条 ::after 照样以它为参照，扩热区不需要再声明一次 position。 */
    .mod-ji .vo-play, .lg-toast .x, .peek .pin-x, .ov-x, .mod-bi .jt-x,
    .l10n-toggle { position: relative; }
    .fleet-skin .sand-out::after, .mod-ji .vo-play::after, .lg-toast .x::after,
    .peek .pin-x::after, .ov-x::after, .mod-bi .jt-x::after, .l10n-toggle::after {
      content: ''; position: absolute; inset: -5px;
    }
    .splitter { position: relative; }
    .splitter::after { content: ''; position: absolute; inset: -3px; }
    /* 各模块「等待游戏同步」的统一空态（曾是五个模块各写一遍内联 style） */
    .pane-waiting { padding: 40px 20px; color: var(--dim); line-height: 1.8; }
    /* 键盘焦点全局兜底（此前全文只有两处 :focus-visible；纯键盘动线下不至于失明） */
    :focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

    /* ══ 悬停反馈补漏（口径同 .ws-tab:hover / .mod-qn .qcat:hover：
       可点的 chip/tab 至少要有文字提亮一档的回应；选中态不动） ══ */
    .mod-du .trow:hover { background: var(--bg2); }
    .mod-du .mpill:hover:not(.cur):not(.lock) { color: var(--text); }
    .mod-zi .rs:hover:not(.on) { color: var(--text); }
    .mod-bi .chip:hover:not(.on),
    .mod-bi .schip:hover:not(.on),
    .mod-bi .fs:hover:not(.on),
    .mod-ji .chip:hover:not(.on),
    .mod-ji .book-tab:hover:not(.on),
    .mod-es .chip:hover:not(.on),
    .fleet-skin .ftab:hover:not(.on),
    .mod-qn .schip:hover:not(.on),
    .mod-qa .fchip:hover:not(.on),
    .mod-yu .ychip:hover:not(.on) { color: var(--text); }
    .mod-bi .jt-set:hover:not(.on) { color: var(--text); border-color: var(--dim); }
    .mod-ji .rm-node:hover:not(.on) .n { border-color: var(--dim); }
    .mod-qn .quick:hover { text-decoration: underline; }
    .mod-yu .ybtn:hover { color: var(--text); border-color: var(--dim); }
    .peek .pa:hover:not(.pri) { background: var(--bg3); }
    .peek .pa.pri:hover { filter: brightness(1.12); }

    @media (prefers-reduced-motion: reduce) {
      .ws-pane.active,
      .mod-ji .ship-subview.enter,
      .mod-qa .qa-detail.enter,
      .mod-shi .shi-view.enter,
      /* 退避的离场动画：直接落到静态的退场态。终值本来就写在 .left 上，
         所以撤掉动画不会丢样子，只是没有那一下滑出。 */
      .fleet-skin .ship.left.leaving,
      .mod-shi .shi-battle-drawer { animation: none; }
      .dock,
      /* 浮层打开时的内容入场：JS 那边 reduceMotion 就直接不放了，这条是双保险 */
      [data-kanso-open] { animation: none !important; }
      /* 启动点亮的其余几处，同样是双保险。JS 那边 armLaunchGlow 直接返回 null，
         所以正常路径上这几条一辈子用不上；真会咬人的是**仪式放到一半系统才被切成
         减少动态效果**——matchMedia 在罩暗那一刻已经问过了，JS 不会回头，
         全靠 CSS 让这几处当场就位。
         坞位与导航条从罩暗那一刻起就压着 opacity: 0，所以「就位」＝ 1；
         各幕的元素同理（`!important` 是为了压过 body.kanso-ceremony 那族预隐）。 */
      body.kanso-glow #element-rail,
      body.kanso-glow .dock-group,
      [data-kanso-in] { animation: none !important; opacity: 1 !important; }
      /* 游戏区那层黑罩反着来：它的终态是**透明**，照抄 opacity: 1 就是把游戏画面
         永久蒙黑——比没有动画糟得多。 */
      body.kanso-glow-run #game-glow { animation: none !important; opacity: 0 !important; }
      #overlay-host,
      #overlay-host .ov-panel,
      .mod-ji .drawer,
      .mod-qn .q-drawer,
      .mod-bi .detail,
      .fleet-skin .ship-detail,
      #voice-subtitle,
      #preview-bar,
      #lg-banners .lg-banner,
      .peek,
      .cmenu,
      #cg-lightbox,
      #cg-lightbox img,
      .mod-di .hpx .bar > span { transition: none !important; }
      #lg-banners .lg-banner,
      .mod-zi .tile .h .live-delta,
      body.lg-frame-gold::before,
      body.lg-frame-red::before,
      body.lg-frame-jade::before,
      body.lg-frame-jade-bright::before,
      body.lg-frame-pink::before,
      body.lg-frame-gold::after,
      body.lg-frame-red::after,
      body.lg-frame-jade::after,
      body.lg-frame-jade-bright::after,
      body.lg-frame-pink::after,
      /* 漏网补齐：三处无限循环（di-blink ×2 / lg-danger-mark）恰是 reduce 最该杀的，
         其余是弹幕横移、BGM 音柱、状态脉冲、入场动画与高亮闪 */
      .mod-di .verdict.v-red .ic,
      .lg-toast.crit .ic,
      .lg-banner.danger .mark,
      #voice-danmaku .voice-danmaku-item,
      #header-status .hs-bgm > i b,
      #header-status .pulse,
      .mod-di .brow.focus,
      .mod-ji .rt-row.focus,
      .lg-toast.powerup-result,
      .mod-zi .tile.hl,
      .mod-di .bship-detail { animation: none !important; }
      #overlay-host .ov-back { backdrop-filter: none; }
      /* 花瓣停落，改成两侧边带上的静态点缀：庆祝还在，只是不动了。
         --petal-y 由 lg.ts 逐片写在行内，就是为了这一档有地方可落。 */
      #lg-wedding { transition: none !important; }
      #lg-wedding .petal {
        animation: none !important;
        top: var(--petal-y); transform: none; opacity: .62;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="wordmark">kuma</span>
      <span id="server-badge">未识别服务器</span>
      <span id="header-status" aria-label="提督、资源、远征与入渠状态"></span>
      <span id="overlay-bar"></span>
      <button id="btn-focus" title="专注模式：收起三坞只留游戏 (F9)">专注</button>
      <button id="btn-capture" title="保存游戏画面截图">截图</button>
      <button id="btn-reload" title="刷新游戏页面">刷新</button>
      <button id="btn-browse" title="开一扇浏览窗逛 DMM，可以开好几扇，登录和代理跟游戏共用">新窗</button>
    </header>
    <main>
      <nav id="element-rail"></nav>
      <div id="workbench">
        <div id="wb-mid">
          <aside class="dock" data-dock="left">
            <div class="dock-tabs" data-tabs="left"></div>
            <div class="dock-panes" data-panes="left"></div>
          </aside>
          <div class="splitter v" data-split="left" title="拖动调整左坞 · 双击折叠"></div>
          <div id="game-area">
            <div id="game-wrapper">
              <div id="voice-danmaku" aria-live="polite" aria-atomic="false"></div>
              <div id="voice-subtitle" aria-live="polite" aria-atomic="true">
                <span class="voice-subtitle-speaker"></span><span aria-hidden="true">：</span><span class="voice-subtitle-line"></span>
              </div>
            </div>
            <div id="game-overlay">
              <div class="overlay-title" id="overlay-title"></div>
              <div class="overlay-detail" id="overlay-detail"></div>
              <button id="btn-retry">重试</button>
            </div>
          </div>
          <div class="splitter v" data-split="right" title="拖动调整右坞 · 双击折叠"></div>
          <aside class="dock" data-dock="right">
            <div class="dock-tabs" data-tabs="right"></div>
            <div class="dock-panes" data-panes="right"></div>
          </aside>
        </div>
        <div class="splitter h" data-split="bottom" title="拖动调整底坞 · 双击折叠"></div>
        <aside class="dock" data-dock="bottom">
          <div class="dock-tabs" data-tabs="bottom"></div>
          <div class="dock-panes" data-panes="bottom"></div>
        </aside>
      </div>
    </main>
  </div>
  <script src="./index.js"></script>
</body>
</html>
