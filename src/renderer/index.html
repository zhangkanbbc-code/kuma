      color: var(--accent); font: 9px var(--mono); text-align: right;
    }
    .mod-qn .chain-tree-lane { min-width: 0; padding: 7px 9px 8px; }
    .mod-qn .chain-tree-lane.before { background: color-mix(in srgb, var(--gold) 4%, transparent); }
    .mod-qn .chain-tree-lane.after { background: color-mix(in srgb, var(--accent) 5%, transparent); }
    .mod-qn .chain-tree-lane-head {
      display: flex; align-items: baseline; gap: 5px; margin-bottom: 5px;
      color: var(--dim); font-size: 9px;
    }
    .mod-qn .chain-tree-lane-head i { width: 12px; color: var(--gold); font-style: normal; text-align: center; }
    .mod-qn .chain-tree-lane.after .chain-tree-lane-head i { color: var(--accent); }
    .mod-qn .chain-tree-lane-head b { color: var(--sub); font-size: 9.5px; }
    .mod-qn .chain-tree-lane-head span { margin-left: auto; font: 8px var(--mono); }
    .mod-qn .chain-tree-list {
      min-width: 0; margin: 0 0 0 6px; padding: 0 0 0 12px;

      border-top: 1px solid var(--line);
    }
    .mod-qn .chain-tree-list .chain-tree-list {
      margin-top: 2px; margin-left: 9px;
      border-left-color: color-mix(in srgb, var(--line) 76%, transparent);
    }
    .mod-qn .chain-deeper { margin: 3px 0 2px 2px; }
    .mod-qn .chain-deeper > summary {
      color: var(--dim); cursor: pointer; font: 8.5px var(--mono);
      list-style: none;
    }
    .mod-qn .chain-deeper > summary::-webkit-details-marker { display: none; }
    .mod-qn .chain-deeper > summary::before { content: '▸ '; color: var(--gold); }
    .mod-qn .chain-deeper[open] > summary::before { content: '▾ '; }
    .mod-qn .chain-deeper > summary:hover { color: var(--text); }
    .mod-qn .chain-tree-meta > span,
    .mod-qn .chain-tree-warning {

    /* 前置口径的双源说明：只有分歧/补缺/悬空时出现。常驻只留这一枚短标，
       两份口径各是什么、按哪份判，全文进 title 悬停（族 14 收拢） */
    .mod-qn .chain-src-note {

      background: #13232e; color: #9fd8ff; cursor: pointer; font-size: 9px;

    .mod-qn.narrow .period-timer { min-width: 62px; }
    .mod-qn.narrow .q-row { gap: 6px; padding: 7px 8px; }
    .mod-qn.narrow .q-nm .plain, .mod-qn.narrow .q-rew, .mod-qn.narrow .q-cat-label { display: none; }
    .mod-qn.narrow .q-prog { width: 74px; }

      transition: transform var(--motion-view) var(--motion-ease), visibility 0s linear var(--motion-view);
    }

    /* ══ 镝 · 战斗详情（移植自设计稿 10，.mod-di 作用域）══ */
    /* --enemy 与全局 --entity-abyss 肉眼同色（互相对比度 1.19）、语义也同是「深海」，
       值挂钩消掉漂移点；--enemy-dim 保持原深色 */
    .mod-di { overflow: hidden; --enemy: var(--entity-abyss); --enemy-dim: #93394d; --sea: #3fd0b0; }
    .mod-di .di-app { flex: 1; min-height: 0; display: flex; background: var(--bg0); }
    .mod-di .di-empty { margin: auto; text-align: center; padding: 30px; }
    .mod-di .di-empty .t { font-family: var(--serif); font-size: 18px; color: var(--sub); margin-bottom: 10px; }
    /* 演习名簿 */
    .mod-di .prac-card {
      max-width: 460px; margin: 14px auto 4px; padding: 8px 10px; text-align: left;

    /* 整队被打光：横线划在队名上。非联合时队名就是那一队；联合时主力队对应
       标题栏的队名、护卫队对应「敌护卫舰队」那一行，各画各的。
       不用 text-decoration: line-through——它按字体的 strikeout 度量画线，那个度量是
       给拉丁小写字母定的（约 x-height 的一半高），落到占满字身框的汉字上会偏到上三分之一，
       看着像一条飘在名字上方的红条而不是划掉。改成拿背景渐变画在盒子正中。
       线画在内层的 `.wl` 上，不画在 `b`/`span` 上——当年那句「代价：名字若真换行只会得到
       一条线」在 2026-08 的活动上兑现了：「深海アシカ作戦部隊 ドーバー海峡前縁警戒群」折成
       两行，横线悬在两行之间的缝上。`b`/`span` 是 flex 项目、已被块化，折行只是块内换行，
       整块背景当然只有一条；inline 盒子折行才断成多段，每段各自画一条。
       单行队名逐像素不变：半行距（half-leading）把字身框在行盒里居中，inline 段的背景盒
       中线与原先块盒的中线严格重合——Electron 43 真 Chromium 截图逐字节比对，单行三例
       零像素差；折行的两行/三行例各自逐行得线。顺带治好了另一处：块盒宽是 flex 收缩后的
       宽度，横线会拖过字尾的空白（实测 161px 盒 / 152.69px 字），inline 段则严格贴字。
       box-decoration-break: clone 是「每段各自成盒」的声明。纯色线在默认的 slice 下画出来
       一模一样（实测逐像素一致），留着是因为 `background-size` 的 100% 只有 clone 才等于
       本段自己的宽度——线哪天不再是纯色，slice 会当场露馅。 */
    .mod-di .fs-h b.wiped, .mod-di .fs-sub span.wiped { opacity: .8; }
    .mod-di .fs-h b.wiped .wl, .mod-di .fs-sub span.wiped .wl {
      background-image: linear-gradient(var(--bad), var(--bad));
      background-size: 100% 2px;

    /* 三列的下限之和（58+34+86 + gap + padding = 198px）曾经超过窄容器给的宽度，
       网格于是整体溢出、最右的血条被 .battle-col 的 overflow:hidden 直接切掉
       （2026-08-20 实测：容器 181px、需要 198px）。后两列改成可收缩：血条先让宽，
       名字列守住自己的下限并靠 .nm 的 overflow + .el 的 ellipsis 优雅省略。 */
    /* 名字被挤死的两个原因，各修一条：
       ① 伤害列曾写死 `minmax(24px, 34px)`——那一格是「—」还是「52」都常驻 34px，
          箭头到数字之间白空 27.7px（392px battle-col 实测）。改成按这一侧实际位数收
          （`min-content` 跟着 .dmg 的 ch 宽，见下；上限五位由 di.ts 的 dmgDigits 保证）。
       ② 血条列的上限曾是死的 86px。grid 的「分配余量」排在 1fr 之前，于是行一窄，
          省下来的余量还是先被血条吃掉、名字仍停在 58px 下限上。改成 `min(86px, 42%)`：
          窄档血条按比例收（实测不但不缩、还比原来宽 6.8px），够宽了照旧封顶 86px，
          余量这才轮得到 1fr 的名字列。百分比与内容无关，各行轨道宽仍严格一致。
       连同下面那条舰绘让位，名字实际可用宽（battle-col 实测）：
       392px 档 5.6 → 36.4px、428px 档 5.6 → 46.4px、485px 档 29.4 → 50.8px，
       520px 起完全不再截断；窄态 360px 档 0 → 27px、420px 档 17.2 → 50.6px。 */
    .mod-di .brow {
      display: grid; grid-template-columns: minmax(58px, 1fr) min-content minmax(40px, min(86px, 42%));
      align-items: center; gap: 6px; padding: 3.5px 4px; border-radius: 5px; font-size: 11.5px;
      cursor: pointer; user-select: none;
    }
    .mod-di .brow.focus {
      animation: header-status-pulse .55s ease-in-out 4 alternate;
      outline: 1px solid color-mix(in srgb, var(--bad) 72%, transparent);
      outline-offset: -1px;
    }

    .mod-di .brow .nm { display: flex; align-items: center; white-space: nowrap; overflow: hidden; min-width: 0; }
    /* 窄框裁切的处理（2026-08-12 用户实锤）：旗/初/★MVP/展开箭头是定宽徽记，
       永不参与收缩；空间不够时让**名字自己**缩略——名字截一半仍认得出，徽记裁掉就丢信息 */
    .mod-di .brow .nm > * { flex: 0 0 auto; }
    .mod-di .brow .nm > .el { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    /* 舰绘不在上面那句「徽记」里（那条列的是旗/初/★MVP/展开箭头）：它和名字说的是同一件事，
       而横幅本来就是右侧取景（object-position: right），收窄只少露一点左边背景。
       所以格子实在放不下时先收它，把那 16px 让给名字。
       为什么用容器查询而不是 flex-shrink：按 shrink 收是**逐行**的（名字长的那行收得多），
       六行舰绘宽窄不一、名字起点参差；容器查询按 .battle-col 的实际宽一刀切，各行一致。
       阈值 470px 卡在「放开舰绘后名字仍够宽」的那一点上，免得出现「面板加宽反而少一个字」
       的台阶；他常驻的 501px 右坞在阈值之上，不受影响。
       这里只动舰绘尺寸；敌我两队并排不变（上下堆叠 2026-08-20 已被否决）。 */
    .mod-di .battle-col { container-type: inline-size; }

    .mod-di .hpx .bar .dd { height: 100%; }

    .mod-di .hpx .bar .dl { height: 100%; background: repeating-linear-gradient(135deg, var(--bad) 0 3px, #8a3644 3px 6px); opacity: 0.8; }

    /* 流水 */

    /* 行宽不够时先把行尾整块（.ltail）折到下一行去，而不是横向溢出——
       实测 380px 面板：不折行的话行尾只剩 50px，五枚标记摞成一列还外溢 5px */
    .mod-di .lrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 3px 0; border-bottom: 1px dashed var(--line-soft); font-size: 11.5px; }
    /* 阶段折叠头：默认全展开，折起来只是玩家当场的收纳动作（状态不落盘，换一场就清空） */
    .mod-di .lstage-h { display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 3px 4px; margin: 2px 0 0 -6px; border-left: 2px solid transparent; font-size: 10.5px; color: var(--dim); }

    .mod-di .lstage-h .lstage-nm.sup { color: #b9c8e8; }
    .mod-di .lstage-h .lstage-nm.friend { color: #9fd8ff; }

    .mod-di .lstage-h.folded { border-bottom: 1px dashed var(--line-soft); }
    /* 流水的每一行都是时间轴锚点：点它，上面的编队血条退回那一阶段结算完的样子 */
    .mod-di .lrow[data-log-stage] { cursor: pointer; border-left: 2px solid transparent; padding-left: 4px; margin-left: -6px; }
    .mod-di .lrow[data-log-stage]:hover { background: #16212b; }
    .mod-di .lrow[data-log-stage].on { background: #16242f; border-left-color: var(--accent); }
    /* pin 住某一阶段时，其余行淡下去——提醒上面看到的不是最终结果 */
    .mod-di .log.pinned .lrow[data-log-stage]:not(.on) { opacity: .62; }
    /* 特殊攻击的「打包」：一次特攻在报文里本是一个单元携带多段伤害，解析层把它摊成
       逐段记录好各记各的舰；流水这层再收回一个组——组头亮一次名字，成员行不再逐行
       重复那枚标，靠缩进与一条竖线归拢（2026-08-27 用户按截图定的口径：
       「特殊攻击的步骤分开显示，不太明显」）。
       不新增任何颜色：竖线用的就是流水既有的那枚 --line-soft。
       组头与成员行都是同一阶段的锚点，点谁都一样退回那一阶段，行级可点没变。 */
    .mod-di .lgrp { margin: 1px 0; }
    .mod-di .lrow.lgrp-h { border-bottom: 0; padding-bottom: 1px; }
    .mod-di .lgrp-b { margin-left: 4px; padding-left: 10px; border-left: 1px solid var(--line-soft); }
    .mod-di .lrow .ph { flex: none; min-width: 48px; max-width: 108px; text-align: center; font-size: 9.5px; border-radius: 3px; padding: 0 5px; border: 1px solid var(--line-soft); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mod-di .lrow .ph.air { color: var(--air); border-color: #2b4a37; }
    .mod-di .lrow .ph.tor { color: #8fb8e0; border-color: #2c4258; }
    .mod-di .lrow .ph.gun { color: #e0c27a; border-color: #4a3f22; }
    .mod-di .lrow .ph.night { color: var(--night); border-color: #343a6e; }
    .mod-di .lrow .ph.sup { color: #b9c8e8; border-color: #3a4658; }
    .mod-di .lrow .ph.lbas { color: var(--air); border-color: #2b4a37; }
    .mod-di .lrow .ph.friend { color: #9fd8ff; border-color: #2a5a70; }
    .mod-di .lrow .ph.radar { color: #f0c890; border-color: #6b4f2a; }
    /* 一行流水的一眼位置是「谁打谁、打掉多少」：舰名与伤害数字一律不收缩，
       让路的是行尾那些注记（2026-08-26 用户按截图定的口径——对空CI 的装备列
       把整行挤到截断，被挤掉的却是舰名和击坠数）。
       .list 是多名/装备列那种本来就成串的位置，仍可收，全文在 title 里 */
    .mod-di .lrow .who { color: #c3d1dc; white-space: nowrap; flex: none; }
    .mod-di .lrow .who.list { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .mod-di .lrow .who.foe { color: #e0a5ae; }

    .mod-di .lrow .dv { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text); flex: none; }
    /* 行尾整块（伤害数字 + 全部标记）：整行唯一肯让路的一段，让的方式是**折行**不是截字
       （2026-08-27 用户按截图定的口径——「弹着连击」被挤成一个字宽，语义标记就此不可读）。
       不写 min-width:0：底是自身的 min-content，缩到底也还是每一枚标记各自完整。
       续行 justify-content:flex-end 靠右接着排，行仍是一个整块（点它回放那一阶段）。 */
    .mod-di .lrow .ltail {
      display: flex; flex-wrap: wrap; align-items: baseline; justify-content: flex-end;
      gap: 2px 8px; margin-left: auto; flex: 0 1 auto;

    .mod-di .lrow .ltail .dv { margin-left: 0; }
    .mod-di .lrow .tag9 { flex: none; font-size: 9.5px; border-radius: 3px; padding: 0 5px; }
    .mod-di .lrow .tag9.sink { color: var(--enemy); border: 1px solid var(--enemy-dim); }
    .mod-di .lrow .tag9.crit { color: var(--gold); }
    /* 对空CI 标签带装备条件，个别类型（大和的 10cm 集中配备一类）能写到四五十字。
       渲染那层已经把过长的收成短头（全文进悬停）；这里是整行唯一肯收缩的一段，
       挤起来先挤它，舰名与伤害不动。
       收缩的方式是**折行不是截字**：ellipsis 会把「弹着连击」这种收无可收的短标记
       吃到一个字宽（2026-08-27 截图），语义标记读不出来就等于没有。 */
    .mod-di .lrow .tag9.ci {
      color: var(--night); border: 1px solid #343a6e;
      flex: 0 1 auto; min-width: 0;
      max-width: 260px; white-space: normal; overflow-wrap: anywhere;

    /* 注记里的装备名壳子自带一层 ellipsis（给的是行内成串的场合）——在这枚标记里

    .mod-di .lrow .tag9.ci .used-equip-link {

    /* ══ 镖 · 远征规划（移植自设计稿 12，.mod-bi 作用域）══ */
    /* --exp 与全局 --dock 逐字节相同，挂钩成别名（远征=坞的同一种青） */
    .mod-bi { overflow: hidden; --exp: var(--dock); --exp-dim: #2a5a70; --exp-glow: rgba(90, 184, 216, 0.1); }
    .mod-bi .bi-app { flex: 1; min-height: 0; display: flex; background: var(--bg0); position: relative; }
    .mod-bi .index { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg1); }
    .mod-bi .search-row { padding: 10px 10px 8px; display: flex; gap: 6px; }
    .mod-bi .search { flex: 1; display: flex; align-items: center; gap: 6px; background: var(--bg0); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; color: var(--dim); }
    .mod-bi .search input { background: none; border: none; outline: none; color: var(--text); width: 100%; font-size: 12px; font-family: inherit; }
    .mod-bi .resource-focus { display: flex; align-items: center; gap: 4px; margin: -2px 10px 7px; padding: 4px 8px; border: 1px solid #2b4a37; border-radius: 5px; background: #132a1c; color: var(--sub); font-size: 10px; }
    .mod-bi .resource-focus b { color: var(--ok); }
    .mod-bi .resource-focus span { margin-left: auto; color: var(--accent); cursor: pointer; }
    .mod-bi .filter-strip { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 6px 10px; padding: 0 10px 7px; }
    .mod-bi .type-chips { min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; }
    .mod-bi .chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer; background: var(--bg2); color: var(--sub); }
    .mod-bi .chip.on { background: var(--exp-dim); color: #d5f0fa; }
    .mod-bi .sort-row { display: flex; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; font-size: 10.5px; color: var(--dim); flex-wrap: wrap; }
    .mod-bi .sort-label { flex: none; }
    .mod-bi .schip { font-size: 10px; padding: 1px 7px; border-radius: 9px; cursor: pointer; background: var(--bg2); color: var(--sub); }
    .mod-bi .schip.on { background: var(--bg3); color: var(--text); outline: 1px solid var(--line); }
    .mod-bi .gantt { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; padding: 2px 10px 6px; border-bottom: 1px solid var(--line-soft); }
    .mod-bi .g-item { display: inline-flex; align-items: center; gap: 5px; min-height: 20px; padding: 1px 5px 1px 7px; border: 1px solid var(--line-soft); border-radius: 5px; background: var(--bg0); color: var(--sub); font: 10px var(--mono); }
    .mod-bi .g-item .k { color: var(--dim); }
    .mod-bi .g-exp-no { color: #9ad0e0; font-weight: 600; }
    .mod-bi .g-countdown { min-width: 34px; color: var(--text); }
    .mod-bi .g-idle, .mod-bi .g-empty { color: var(--dim); }
    .mod-bi .g-supply {
      width: 15px; height: 15px; flex: none; display: inline-grid; place-items: center;
      border: 1px solid var(--line); border-radius: 50%; font: 700 9px var(--mono);

    .mod-bi .elist { flex: 1; min-height: 0; overflow-y: auto; }

    .mod-bi .sec-h .sp { flex: 1; }
    .mod-bi .sec-h .aux { font-weight: 400; font-size: 10.5px; color: var(--dim); }
    .mod-bi .exp-quests { display: flex; flex-direction: column; gap: 4px; }
    .mod-bi .exp-quest { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid var(--line-soft); border-radius: 5px; background: var(--bg1); color: var(--sub); font-size: 10.5px; }

      border-radius: 6px; font-size: 11px;
    }

      flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--bg3);

    .mod-bi .jt-note b { color: var(--sub); font-weight: 600; }
    .mod-bi .jt-note.ok { color: color-mix(in srgb, var(--ok) 70%, var(--dim)); }

    .mod-bi .gcard .v { font-family: var(--mono); font-size: 16px; font-weight: 600; line-height: 1.3; }

    .mod-bi .gcard.f .v { color: var(--r-fuel); }
    .mod-bi .gcard.a .v { color: var(--r-ammo); }

    .mod-bi .gcard.b .v { color: var(--r-baux); }
    .mod-bi .net-gain { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; margin-top: 7px; padding: 6px 8px; border: 1px solid #2b4a37; border-radius: 5px; background: #13251b; color: var(--sub); font-size: 9.5px; }
    .mod-bi .net-gain b { color: var(--ok); font-size: 10px; }
    .mod-bi .net-gain .cost { color: var(--warn); }

    .mod-bi .net-gain.muted { border-color: var(--line-soft); background: var(--bg1); color: var(--dim); }
    .mod-bi .exp-h-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; margin-bottom: 7px; }
    .mod-bi .exp-h-metrics > span { display: flex; flex-direction: column; padding: 5px 7px; border: 1px solid var(--line-soft); border-radius: 5px; background: var(--bg1); }
    .mod-bi .exp-h-metrics small { color: var(--dim); font-size: 8.5px; }
    .mod-bi .exp-h-metrics b { color: var(--text); font: 600 13px var(--mono); }
    .mod-bi .exp-h-net { margin-bottom: 7px; padding: 7px; border: 1px solid rgba(88,189,168,.24); border-radius: 6px; background: rgba(55,143,124,.06); }

    .mod-bi .exp-h-net-main > span { display: flex; align-items: center; flex-wrap: wrap; gap: 3px; padding: 4px 5px; border-radius: 4px; background: var(--bg1); color: var(--sub); font: 600 10px var(--mono); }

    .mod-bi .exp-h-net-main small { flex-basis: 100%; color: var(--dim); font: 8px var(--sans); }
    .mod-bi .exp-h-net-kinds { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 5px; color: var(--dim); font-size: 8.5px; }

    .mod-bi .exp-h-list { display: flex; flex-direction: column; max-height: 260px; overflow-y: auto; }
    .mod-bi .exp-h-row { display: grid; grid-template-columns: 108px 48px 44px minmax(0, 1fr); align-items: center; gap: 5px; padding: 4px 5px; border-bottom: 1px solid var(--line-soft); color: var(--dim); font-size: 9.5px; }
    .mod-bi .exp-h-row time { font-family: var(--mono); }

    .mod-bi .exp-h-row > b.great { color: var(--gold); }
    .mod-bi .exp-h-row > b.bad { color: var(--bad); }
    .mod-bi .exp-h-reward { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; color: var(--sub); }
    .mod-bi .exp-h-reward .material-icon, .mod-bi .exp-h-reward .useitem-icon { margin-left: 3px; }
    .mod-bi .gnote { margin-top: 7px; font-size: 10.5px; color: var(--dim); }

    .mod-bi .gnote .up { color: var(--ok); }

    /* 窄模式：详情全覆盖 */
    .mod-bi .bi-app.narrow .detail { position: absolute; top: 0; right: 0; bottom: 0; z-index: 20; }
    .mod-bi .bi-app.narrow.open .detail { width: 100%; }
    .mod-bi .bi-app.narrow .detail > * { width: 100%; min-width: 0; box-sizing: border-box; }
    .mod-bi .bi-app.narrow .filter-strip, .mod-bi .bi-app.open .filter-strip { grid-template-columns: minmax(0, 1fr); }
    .mod-bi .bi-app.narrow .sort-row, .mod-bi .bi-app.open .sort-row { justify-content: flex-start; }
    .mod-bi .bi-app.narrow .sec, .mod-bi .bi-app.narrow .hero { padding-left: 14px; padding-right: 14px; }
    .mod-bi .bi-app.narrow .exp-h-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .mod-bi .bi-app.narrow .exp-h-net-main { grid-template-columns: 1fr; }
    .mod-bi .bi-app.narrow .exp-h-row { grid-template-columns: minmax(0, 1fr) auto auto; }
    .mod-bi .bi-app.narrow .exp-h-reward { grid-column: 1 / -1; }

    /* ══ 铃 · 通知（移植自设计稿 13，.mod-lg 作用域 + 全局 Toast 层）══ */
    .mod-lg { overflow: hidden; }
    .mod-lg .lg-app { flex: 1; min-height: 0; display: flex; background: var(--bg0); }
    .mod-lg .center { width: 360px; flex: none; display: flex; flex-direction: column; background: var(--bg1); border-right: 1px solid var(--line); }
    /* 窄容器：规则矩阵改到通知列表下方堆叠（原先整片隐藏 → 规则不可配） */
    .mod-lg .lg-app.narrow { flex-direction: column; overflow-y: auto; }
    .mod-lg .lg-app.narrow .center { width: 100%; border-right: none; flex: none; }
    .mod-lg .lg-app.narrow .c-list { overflow: visible; flex: none; }
    .mod-lg .lg-app.narrow .right { flex: none; border-top: 1px solid var(--line); overflow: visible; }
    .mod-lg .rcard { overflow-x: auto; } /* 规则表窄了横向滚，不裁列 */
    .mod-lg table.rules { min-width: 460px; }
    .mod-lg .c-head { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .mod-lg .c-head .bell { position: relative; font-size: 14px; }
    .mod-lg .c-head .bell .n { position: absolute; top: -5px; right: -8px; font-family: var(--mono); font-size: 8.5px; background: var(--bad); color: #fff; border-radius: 7px; padding: 0 4px; font-weight: 700; }
    .mod-lg .c-head b { font-size: 13px; }
    .mod-lg .c-head .sp { flex: 1; }
    .mod-lg .lk { font-size: 10.5px; color: var(--accent); cursor: pointer; }
    .mod-lg .dnd { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--sub); border: 1px solid var(--line); border-radius: 11px; padding: 2px 9px; }
    .mod-lg .dnd .sw { width: 22px; height: 12px; border-radius: 6px; background: var(--bg3); position: relative; }
    .mod-lg .dnd .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); transition: var(--motion-fast); }
    .mod-lg .dnd.on { color: var(--warn); border-color: #4a3a22; }
    .mod-lg .dnd.on .sw { background: #4a3a22; }
    .mod-lg .dnd.on .sw::after { left: 12px; background: var(--warn); }
    .mod-lg .c-list { flex: 1; min-height: 0; overflow-y: auto; }
    .mod-lg .c-grp { position: sticky; top: 0; z-index: 2; padding: 4px 14px; font-size: 10px; color: var(--dim); background: var(--bg2); border-bottom: 1px solid var(--line-soft); letter-spacing: 1px; }
    .mod-lg .nrow { display: flex; gap: 9px; padding: 8px 14px; border-bottom: 1px solid var(--line-soft); cursor: pointer; position: relative; }
    .mod-lg .nrow:hover { background: var(--bg2); }
    .mod-lg .nrow .sev { width: 3px; border-radius: 2px; flex: none; align-self: stretch; }
    .mod-lg .nrow .ic { width: 26px; height: 26px; flex: none; border-radius: 6px; display: grid; place-items: center; font-size: 11px; background: var(--bg0); border: 1px solid var(--line-soft); }
    .mod-lg .nrow .tx { flex: 1; min-width: 0; }
    .mod-lg .nrow .tx b { display: block; font-size: 12px; font-weight: 600; line-height: 1.4; }
    .mod-lg .nrow .tx span { display: block; font-size: 10.5px; color: var(--sub); line-height: 1.45; }
    .mod-lg .nrow .tx .jump { font-size: 10px; color: var(--accent); margin-top: 1px; display: inline-block; }
    /* 这一条的手机推送没发出去；悬停看原因。失败只在记录上说一句，不再发一条通知 */
    .mod-lg .nrow .tx .pusherr { display: inline-block; margin-left: 8px; font-size: 10px; color: var(--bad); }
    .mod-lg .nrow .tm { flex: none; font-family: var(--mono); font-size: 9.5px; color: var(--dim); text-align: right; }
    .mod-lg .nrow .unread { position: absolute; left: 5px; top: 14px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    /* 上次开机留下的：能翻能跳，但视觉上退一档，免得和刚发生的事混在一起 */
    .mod-lg .nrow.prev .tx b { font-weight: 500; color: var(--sub); }
    .mod-lg .nrow.prev .ic { opacity: 0.65; }
    .mod-lg .nrow.read { opacity: 0.6; }
    .mod-lg .c-foot { padding: 7px 14px; border-top: 1px solid var(--line-soft); font-size: 10px; color: var(--dim); display: flex; gap: 10px; }
    .mod-lg .c-foot .lk { margin-left: auto; }
    .mod-lg .right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; background: var(--bg0); overflow-y: auto; }
    /* 规则表那张卡吃满剩余高度：flex:none 时它按内容收，卡下方剩一大片纯黑
       （1280 浮层里 300px）。grow 1 / shrink 0 = 吃满可用高、内容超出时仍按内容撑高
       交给右栏滚。弹窗位置卡（.compact）按内容收，不分这份高度。 */
    .mod-lg .rcard { flex: 1 0 auto; background: var(--bg1); border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px 13px; }
    .mod-lg .rcard.compact { flex: none; }
    .mod-lg .rcard .h { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: 11.5px; color: var(--sub); margin-bottom: 8px; }
    .mod-lg .rcard .h::before { content: ''; width: 3px; height: 12px; border-radius: 2px; flex: none; background: var(--hc, var(--accent-dim)); }
    .mod-lg .rcard .h b { color: var(--text); font-weight: 600; }
    .mod-lg .rcard .h .aux { margin-left: auto; font-size: 10px; color: var(--dim); }
    .mod-lg table.rules { width: 100%; border-collapse: collapse; font-size: 11px; }
    .mod-lg table.rules th { text-align: center; font-size: 9.5px; color: var(--dim); font-weight: 400; padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .mod-lg table.rules th:first-child { text-align: left; }
    .mod-lg table.rules td { padding: 4.5px 6px; border-bottom: 1px solid var(--line-soft); text-align: center; white-space: nowrap; }
    .mod-lg table.rules td.ev { text-align: left; font-size: 11.5px; }
    .mod-lg table.rules td.ev .sv { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 7px; }
    .mod-lg table.rules td.ev i { font-style: normal; font-size: 9.5px; color: var(--dim); margin-left: 6px; }
    .mod-lg table.rules td.cond { font-size: 9.5px; color: var(--dim); text-align: left; white-space: normal; }
    /* 阈值就地输入：三四位数的东西没有理由横跨整列（裸 input 默认 size=20 ≈ 171px），
       收到内容宽，形态对齐钥的 .yin */
    .mod-lg .thres {
      width: 6ch; min-width: 0; padding: 1px 5px; text-align: center;
      background: var(--bg0); border: 1px solid var(--line); border-radius: 3px;
      color: var(--text); font-family: var(--mono); font-size: 10.5px; outline: none;
    }
    .mod-lg .thres:focus { border-color: var(--accent-dim); }
    /* 13px 圆点是规则矩阵的主交互，用透明 ::after 把热区扩到 ~25px */
    .mod-lg .dot {
      display: inline-block; position: relative; width: 13px; height: 13px; border-radius: 50%;
      cursor: pointer; border: 1.5px solid var(--line); vertical-align: middle;
    }
    .mod-lg .dot::after { content: ''; position: absolute; inset: -6px; }
    .mod-lg .dot.on { background: var(--accent-dim); border-color: var(--accent-dim); }
    .mod-lg .dot.lock { background: #4a2830; border-color: #5c2c38; cursor: not-allowed; }
    /* 不适用的通道：没有样式时它长得和「关」一模一样、还带着可点的观感 */
    .mod-lg .dot.na { border-style: dashed; background: none; opacity: .45; cursor: default; }
    .mod-lg .dot.na::after { content: none; }
    .mod-lg .rules-note { margin-top: 7px; font-size: 10px; color: var(--dim); }
    .mod-lg .rules-note b { color: var(--sub); font-weight: 400; }
    .mod-lg .g-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--sub); margin-bottom: 8px; }
    .mod-lg .g-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--bg0); border: 1px solid var(--line); border-radius: 11px; padding: 2px 10px; font-size: 10.5px; }
    .mod-lg .g-pill b { color: var(--text); font-weight: 600; }
    .mod-lg .note9 { flex: none; padding: 2px 6px; font-size: 10px; color: var(--dim); }
    /* 弹窗位置：参照系按钮形态对齐钥的 .ychip（同一族选择器，不该长两个样） */
    .mod-lg .tp-chip { font-size: 11px; padding: 2.5px 12px; border-radius: 11px; cursor: pointer; background: var(--bg2); color: var(--sub); border: 1px solid transparent; }
    .mod-lg .tp-chip:hover:not(.on):not(.off) { color: var(--text); }
    .mod-lg .tp-chip.on { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); }
    .mod-lg .tp-chip.off { color: var(--dim); border-style: dashed; border-color: var(--line); cursor: default; }
    /* 取景框：5:3 是游戏画面的比例，四角各一格；中间那行字是当前参照系 */
    .mod-lg .tp-frame {
      position: relative; width: 156px; aspect-ratio: 5 / 3; margin-top: 2px;
      display: grid; grid-template: 1fr 1fr / 1fr 1fr; gap: 3px; padding: 3px;
      background: var(--bg0); border: 1px solid var(--line); border-radius: 5px;
    }
    .mod-lg .tp-frame em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 10px; color: var(--dim); pointer-events: none; }
    .mod-lg .tp-cell { position: relative; border-radius: 3px; cursor: pointer; }
    .mod-lg .tp-cell:hover { background: var(--bg2); }
    .mod-lg .tp-cell.on { background: var(--accent-wash); }
    .mod-lg .tp-cell i { position: absolute; width: 8px; height: 8px; border-radius: 2px; background: var(--line); }
    .mod-lg .tp-cell.on i { background: var(--accent); }
    .mod-lg .tp-cell[data-toast-value="tl"] i { top: 5px; left: 5px; }
    .mod-lg .tp-cell[data-toast-value="tr"] i { top: 5px; right: 5px; }
    .mod-lg .tp-cell[data-toast-value="bl"] i { bottom: 5px; left: 5px; }
    .mod-lg .tp-cell[data-toast-value="br"] i { bottom: 5px; right: 5px; }
    /* 新舰 / 大破：顶层持久横幅。仅关闭按钮移除；跳转按钮不会代替确认。 */
    #lg-banners {
      position: fixed; z-index: 1300; top: 42px; left: 50%; transform: translateX(-50%);
      width: min(720px, calc(100vw - 32px)); max-height: min(52vh, 520px);
      display: flex; flex-direction: column; gap: 8px; overflow-y: auto;
      pointer-events: none; scrollbar-width: thin;
    }
    .lg-banner {
      pointer-events: auto; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center; gap: 11px; min-height: 58px; padding: 9px 10px;
      position: relative; overflow: hidden; border: 1px solid; border-radius: 9px;
      background: rgba(18, 24, 30, .97);
      box-shadow: 0 14px 38px rgba(0, 0, 0, .48);
      animation: lg-banner-in var(--motion-view) var(--motion-ease) both;
    }
    .lg-banner::after {
      content: ''; position: absolute; top: 0; left: 12px; right: 12px; height: 2px;
      border-radius: 0 0 2px 2px; pointer-events: none;
    }
    .lg-banner.celebrate {
      border-color: rgba(232, 198, 106, .56);
      background:
        radial-gradient(520px 130px at 16% 0%, rgba(232, 198, 106, .22), transparent 72%),
        rgba(18, 24, 30, .97);
      animation:
        lg-banner-in var(--motion-view) var(--motion-ease) both,
        lg-banner-gold-pulse 2.3s ease-in-out .25s infinite;
    }
    .lg-banner.danger {
      border-color: rgba(224, 108, 117, .62);
      background:
        radial-gradient(520px 130px at 16% 0%, rgba(224, 108, 117, .25), transparent 72%),
        rgba(20, 22, 28, .98);
      animation:
        lg-banner-in var(--motion-view) var(--motion-ease) both,
        lg-banner-red-pulse 1.75s ease-in-out .25s infinite;
    }
    /* 应急修理发动：绿色两档。要員回两成耐久（人通常还是大破）＝沉稳的叶绿、底色克制；
       女神回满＝近白的水绿、整条泛光。色相 + 明度 + 徽记（修/神）三处一起分家——
       只靠色号分档在实机截图上并排看还是会读成同一种绿。 */
    .lg-banner.repair {
      border-color: rgba(61, 158, 99, .55);
      background:
        radial-gradient(460px 120px at 16% 0%, rgba(61, 158, 99, .17), transparent 70%),
        rgba(16, 24, 20, .97);
      animation:
        lg-banner-in var(--motion-view) var(--motion-ease) both,
        lg-banner-jade-pulse 2.1s ease-in-out .25s infinite;
    }
    .lg-banner.goddess {
      border-color: rgba(168, 245, 220, .72);
      background:
        radial-gradient(640px 150px at 16% 0%, rgba(168, 245, 220, .3), transparent 76%),
        rgba(22, 34, 31, .97);
      animation:
        lg-banner-in var(--motion-view) var(--motion-ease) both,
        lg-banner-jade-bright-pulse 2.1s ease-in-out .25s infinite;
    }
    /* ケッコンカッコカリ：全屏唯一的粉。庆祝性质与新舰金同族，但比它稀有一档
       （戒指不可再生），所以底色更铺开一点、上沿高光更亮。 */
    .lg-banner.wedding {
      border-color: rgba(var(--wedding-rgb), .6);
      background:
        radial-gradient(600px 145px at 16% 0%, rgba(var(--wedding-rgb), .24), transparent 74%),
        rgba(26, 20, 28, .97);
      animation:
        lg-banner-in var(--motion-view) var(--motion-ease) both,
        lg-banner-pink-pulse 2.6s ease-in-out .25s infinite;
    }
    .lg-banner.celebrate::after {
      background: linear-gradient(90deg, transparent, #f1d989 18%, #fff1b3 50%, #f1d989 82%, transparent);
      box-shadow: 0 0 12px rgba(245, 213, 119, .8);
    }
    .lg-banner.wedding::after {
      background: linear-gradient(90deg, transparent, var(--wedding) 18%, var(--wedding-lit) 50%, var(--wedding) 82%, transparent);
      box-shadow: 0 0 14px rgba(var(--wedding-rgb), .8);
    }
    .lg-banner.repair::after {
      background: linear-gradient(90deg, transparent, var(--damecon-crew) 18%, #7fd499 50%, var(--damecon-crew) 82%, transparent);
      box-shadow: 0 0 12px rgba(61, 158, 99, .8);
    }
    .lg-banner.goddess::after {
      background: linear-gradient(90deg, transparent, var(--damecon-goddess) 18%, #e8fff8 50%, var(--damecon-goddess) 82%, transparent);
      box-shadow: 0 0 14px rgba(168, 245, 220, .85);
    }
    .lg-banner.danger::after {
      background: linear-gradient(90deg, transparent, #ff7c8c 18%, #ffc0c7 50%, #ff7c8c 82%, transparent);
      box-shadow: 0 0 14px rgba(255, 103, 122, .85);
    }
    .lg-banner .mark {
      width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
      font: 700 15px var(--mono); border: 1px solid;
    }
    .lg-banner.celebrate .mark {
      color: #ffe7a0; border-color: #8f7633; background: #342d18;
      box-shadow: 0 0 12px rgba(232, 198, 106, .38), inset 0 0 8px rgba(232, 198, 106, .14);
    }
    .lg-banner.danger .mark {
      color: #ffd1d6; border-color: #9b3e4a; background: #401820;
      box-shadow: 0 0 14px rgba(224, 108, 117, .48), inset 0 0 8px rgba(224, 108, 117, .18);
      /* 时长必须是合法长度值，写错整条 animation 会被浏览器丢弃，脉动静默失效 */
      animation: lg-danger-mark 1.2s ease-in-out infinite;
    }
    .lg-banner.repair .mark {
      color: #9fd8ae; border-color: #2f6b45; background: #12271b;
      box-shadow: 0 0 10px rgba(61, 158, 99, .32), inset 0 0 8px rgba(61, 158, 99, .12);
    }
    .lg-banner.goddess .mark {
      color: #0f231d; border-color: var(--damecon-goddess); background: var(--damecon-goddess);
      box-shadow: 0 0 18px rgba(168, 245, 220, .62), inset 0 0 8px rgba(255, 255, 255, .4);
    }
    .lg-banner.wedding .mark {
      color: var(--wedding-lit); border-color: rgba(var(--wedding-rgb), .58); background: #3a1c31;
      box-shadow: 0 0 14px rgba(var(--wedding-rgb), .4), inset 0 0 8px rgba(var(--wedding-rgb), .16);
    }
    .lg-banner .copy { min-width: 0; }
    .lg-banner .copy b { display: block; font-size: 13px; font-weight: 700; line-height: 1.4; }
    .lg-banner.celebrate .copy b { color: #f0d685; }
    .lg-banner.danger .copy b { color: #ffabb4; }
    .lg-banner.repair .copy b { color: var(--damecon-crew); }
    .lg-banner.goddess .copy b { color: var(--damecon-goddess); }
    .lg-banner.wedding .copy b { color: var(--wedding); }
    .lg-banner .copy span {
      display: block; margin-top: 2px; color: var(--sub); font-size: 10.5px; line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .lg-banner .actions { display: flex; align-items: center; gap: 6px; }
    .lg-banner button {
      border: 1px solid var(--line); border-radius: 5px; background: var(--bg2);
      color: var(--sub); font: inherit; font-size: 11px; padding: 3px 8px; cursor: pointer;
    }
    .lg-banner button:hover { color: var(--text); border-color: var(--accent-dim); }
    .lg-banner button.close { width: 25px; height: 25px; padding: 0; color: var(--dim); }
    .lg-banner.danger button.close:hover { color: #ffabb4; border-color: #71323b; }
    @keyframes lg-banner-in {
      from { opacity: 0; transform: translateY(-8px) scale(.992); }
      to { opacity: 1; transform: none; }
    }
    @keyframes lg-banner-gold-pulse {
      0%, 100% { box-shadow: 0 14px 38px rgba(0, 0, 0, .48), 0 0 16px rgba(232, 198, 106, .28), inset 0 0 12px rgba(232, 198, 106, .08); }
      50% { box-shadow: 0 14px 38px rgba(0, 0, 0, .48), 0 0 32px rgba(245, 213, 119, .52), inset 0 0 22px rgba(232, 198, 106, .16); }
    }
    @keyframes lg-banner-red-pulse {
      0%, 100% { box-shadow: 0 14px 38px rgba(0, 0, 0, .5), 0 0 18px rgba(224, 108, 117, .34), inset 0 0 13px rgba(224, 108, 117, .1); }
      50% { box-shadow: 0 14px 38px rgba(0, 0, 0, .5), 0 0 38px rgba(255, 99, 119, .62), inset 0 0 25px rgba(224, 108, 117, .2); }
    }
    @keyframes lg-banner-jade-pulse {
      0%, 100% { box-shadow: 0 14px 38px rgba(0, 0, 0, .48), 0 0 16px rgba(61, 158, 99, .3), inset 0 0 12px rgba(61, 158, 99, .09); }
      50% { box-shadow: 0 14px 38px rgba(0, 0, 0, .48), 0 0 32px rgba(61, 158, 99, .55), inset 0 0 22px rgba(61, 158, 99, .18); }
    }
    @keyframes lg-banner-jade-bright-pulse {
      0%, 100% { box-shadow: 0 14px 38px rgba(0, 0, 0, .48), 0 0 18px rgba(168, 245, 220, .34), inset 0 0 13px rgba(168, 245, 220, .1); }
      50% { box-shadow: 0 14px 38px rgba(0, 0, 0, .48), 0 0 38px rgba(168, 245, 220, .62), inset 0 0 25px rgba(168, 245, 220, .2); }
    }
    @keyframes lg-banner-pink-pulse {
      0%, 100% { box-shadow: 0 14px 38px rgba(0, 0, 0, .48), 0 0 18px rgba(var(--wedding-rgb), .3), inset 0 0 13px rgba(var(--wedding-rgb), .1); }
      50% { box-shadow: 0 14px 38px rgba(0, 0, 0, .48), 0 0 36px rgba(var(--wedding-rgb), .58), inset 0 0 24px rgba(var(--wedding-rgb), .2); }
    }
    @keyframes lg-danger-mark {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.07); filter: brightness(1.28); }
    }
    /* 只在横幅仍待手动确认时发光。同时只有一种颜色，优先级见 lg.ts FRAME_PRIORITY：
       红 > 女神绿 > 要員绿 > 金。红压在绿之上是有意与横幅堆叠次序相反——
       横幅是内容（最要紧的排最上面），外框是环境警报，它回答的是「现在该做什么」，
       而应急修理发动后该做的事仍然是撤退。 */
    body.lg-frame-gold::before,
    body.lg-frame-red::before,
    body.lg-frame-jade::before,
    body.lg-frame-jade-bright::before,
    body.lg-frame-pink::before,
    body.lg-frame-gold::after,
    body.lg-frame-red::after,
    body.lg-frame-jade::after,
    body.lg-frame-jade-bright::after,
    body.lg-frame-pink::after {
      content: ''; position: fixed; inset: 0; pointer-events: none;
    }
    body.lg-frame-gold::before,
    body.lg-frame-red::before,
    body.lg-frame-jade::before,
    body.lg-frame-jade-bright::before,
    body.lg-frame-pink::before {
      z-index: 1249; animation: lg-frame-wash 2.6s ease-in-out infinite;
    }
    body.lg-frame-gold::after,
    body.lg-frame-red::after,
    body.lg-frame-jade::after,
    body.lg-frame-jade-bright::after,
    body.lg-frame-pink::after {
      z-index: 1250; border: 2px solid transparent;
      animation: lg-frame-breathe 2.35s ease-in-out infinite;
    }
    body.lg-frame-gold::before {
      background:
        linear-gradient(90deg, rgba(232, 198, 106, .2), transparent 6%, transparent 94%, rgba(232, 198, 106, .2)),
        linear-gradient(180deg, rgba(245, 213, 119, .18), transparent 9%, transparent 91%, rgba(232, 198, 106, .16));
    }
    body.lg-frame-red::before {
      background:
        linear-gradient(90deg, rgba(224, 108, 117, .25), transparent 7%, transparent 93%, rgba(224, 108, 117, .25)),
        linear-gradient(180deg, rgba(255, 92, 113, .23), transparent 10%, transparent 90%, rgba(224, 108, 117, .2));
    }
    body.lg-frame-gold::after {
      border-color: rgba(245, 213, 119, .68);
      box-shadow: inset 0 0 44px rgba(232, 198, 106, .25), inset 0 0 10px rgba(245, 213, 119, .42);
    }
    body.lg-frame-red::after {
      border-color: rgba(255, 111, 128, .76);
      box-shadow: inset 0 0 52px rgba(224, 108, 117, .31), inset 0 0 12px rgba(255, 99, 119, .5);
    }
    body.lg-frame-jade::before {
      background:
        linear-gradient(90deg, rgba(61, 158, 99, .22), transparent 7%, transparent 93%, rgba(61, 158, 99, .22)),
        linear-gradient(180deg, rgba(61, 158, 99, .2), transparent 10%, transparent 90%, rgba(61, 158, 99, .18));
    }
    body.lg-frame-jade::after {
      border-color: rgba(61, 158, 99, .7);
      box-shadow: inset 0 0 46px rgba(61, 158, 99, .26), inset 0 0 11px rgba(96, 199, 132, .44);
    }
    body.lg-frame-jade-bright::before {
      background:
        linear-gradient(90deg, rgba(168, 245, 220, .24), transparent 7%, transparent 93%, rgba(168, 245, 220, .24)),
        linear-gradient(180deg, rgba(168, 245, 220, .22), transparent 10%, transparent 90%, rgba(168, 245, 220, .2));
    }
    body.lg-frame-jade-bright::after {
      border-color: rgba(168, 245, 220, .78);
      box-shadow: inset 0 0 52px rgba(168, 245, 220, .3), inset 0 0 12px rgba(212, 255, 240, .5);
    }
    /* 婚礼的粉光。两侧比上下更浓（8%/11% 对 7%/10%）——用户要的是「侧面 + 顶部」，
       中间那块游戏画面要留干净。 */
    body.lg-frame-pink::before {
      background:
        linear-gradient(90deg, rgba(var(--wedding-rgb), .26), transparent 8%, transparent 92%, rgba(var(--wedding-rgb), .26)),
        linear-gradient(180deg, rgba(var(--wedding-rgb), .22), transparent 11%, transparent 89%, rgba(var(--wedding-rgb), .16));
    }
    body.lg-frame-pink::after {
      border-color: rgba(var(--wedding-rgb), .72);
      box-shadow: inset 0 0 50px rgba(var(--wedding-rgb), .28), inset 0 0 12px rgba(255, 224, 243, .46);
    }

    /* ── 花瓣（婚礼庆祝，15~20 秒后淡出）──
       只做 transform / opacity 两样，全部交给合成器；数量克制在个位十几片，
       且**只落在两侧边带**——中间是游戏画面，庆祝不该糊在它脸上。
       层级压在外框光晕（1249）之下、界面之上：花瓣是氛围，不是提示。
       花瓣元素在 reduced-motion 下不落，只作为静态点缀留在原处（见文末的 reduce 段）。 */
    #lg-wedding {
      position: fixed; inset: 0; z-index: 1248; pointer-events: none; overflow: hidden;
      opacity: 1; transition: opacity var(--motion-solemn) ease;
    }
    #lg-wedding.fading { opacity: 0; }
    #lg-wedding .petal {
      position: absolute; top: -8%; left: var(--petal-x);
      width: 9px; height: 7px; border-radius: 9px 2px 9px 2px;
      background: linear-gradient(140deg, var(--wedding-lit), var(--wedding));
      box-shadow: 0 0 6px rgba(var(--wedding-rgb), .45);
      opacity: 0;
      animation: lg-wedding-fall var(--petal-dur) linear var(--petal-delay) infinite;
    }
    @keyframes lg-wedding-fall {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
      10% { opacity: .9; }
      85% { opacity: .82; }
      100% { transform: translate3d(var(--petal-drift), 118vh, 0) rotate(560deg); opacity: 0; }
    }
    /* ── 哀悼态：出击中沉了舰，到返港为止 ──
       只失色**艦素自己的外壳**：顶栏 / 侧栏导航 / 三坞。
       #game-area 蓄意不在名单里——这次出击还得靠游戏画面收尾，
       把它一起涂灰就是拿仪式感换掉可用性。
       置顶横幅（#lg-banners）与 Toast 也不在名单里：哀悼期间照样会有大破、
       应急修理这类要人当场处理的提醒，它们必须仍然是彩色的。
       状态类挂在 body 上，判据见 kernel.ts syncMourning（从 sortie 状态推导）。 */
    body.kanso-mourning header,
    body.kanso-mourning #element-rail,
    body.kanso-mourning .dock,
    /* 挂在 body 上的那一层也算艦素界面：大浮层（回顾/通知/设置/诊断）、
       富提示、钉住卡、命令面板、灯箱……逐个列会漏，所以反着写——
       #app 那棵树上面已经逐块处理过（要把游戏区摘出来），
       两层通知（横幅 / Toast）留彩色。 */
    /* 这一条的过渡写在规则内部（不像上面三个写在基础规则上）：body 直属层多是
       开合式浮层，不会一直挂在屏幕上跨越解除那一刻，为它们给每个 body 直属子元素
       都加一条 transition 反而会覆盖掉浮层自己的进出场过渡。进场仍是渐变的。 */
    body.kanso-mourning > *:not(#app):not(#lg-banners):not(#lg-toasts) {
      filter: grayscale(1) brightness(.94);
      transition: filter var(--motion-solemn) ease;
    }
    @keyframes lg-frame-breathe {
      0%, 100% { opacity: .68; }
      50% { opacity: 1; }
    }
    @keyframes lg-frame-wash {
      0%, 100% { opacity: .62; }
      50% { opacity: .92; }
    }
    @media (max-width: 680px) {
      #lg-banners { top: 38px; width: calc(100vw - 16px); }
      .lg-banner { grid-template-columns: 32px minmax(0, 1fr); }
      .lg-banner .mark { width: 29px; height: 29px; }
      .lg-banner .actions { grid-column: 2; justify-content: flex-end; }
    }
    /* 全局 Toast 层：堆在玩家选的那个角，容器不拦点击 */
    /* fixed 是 kuma 窗口档，也是游戏容器未就绪/被收起时的兜底；挂进游戏画面时改为
       容器内绝对定位。角落由 data-corner 给（tl/tr/bl/br，见 shared/toast-position.ts）。
       宽度压在 250（他看预览嫌 300 太宽） */
    #lg-toasts { position: fixed; z-index: 1100; display: flex; flex-direction: column; gap: 7px; width: min(250px, calc(100vw - 24px)); pointer-events: none; }
    #lg-toasts[data-corner$="l"] { left: 12px; }
    #lg-toasts[data-corner$="r"] { right: 12px; }
    #lg-toasts[data-corner^="b"] { bottom: 12px; }
    /* kuma 窗口的上两角要让开 34px 高的顶栏，数与置顶横幅同一档 */
    #lg-toasts[data-corner^="t"] { top: 42px; }
    #game-wrapper > #lg-toasts { position: absolute; }
    #game-wrapper > #lg-toasts[data-corner^="t"] { top: 12px; }
    /* 试听条也占右下角：它在的时候整摞 Toast 抬高一档，两者不叠 */
    body.kanso-preview-on #lg-toasts[data-corner="br"] { bottom: 54px; }
    .lg-toast { pointer-events: auto; display: flex; gap: 9px; align-items: flex-start; position: relative; overflow: hidden; background: rgba(21, 28, 35, 0.96); border: 1px solid var(--line); border-left-width: 3px; border-radius: 7px; padding: 8px 10px 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); cursor: pointer; }
    .lg-toast .ic { width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
    .lg-toast .tx { flex: 1; min-width: 0; }
    .lg-toast .tx b { display: block; font-size: 12px; line-height: 1.35; }
    .lg-toast .tx span { display: block; font-size: 10.5px; color: var(--sub); line-height: 1.4; }
    /* 「→ ××」是整张卡上**唯一**的跳转热区（卡面其余部分点了只是关闭，见 modules/lg.ts），
       而它只有 10px 高——热区得比字大一圈才点得中。padding 撑开的那几像素由等量负 margin
       抵回去，所以排版逐像素照旧：文字还在原来的位置，卡片也没有变高。 */
    .lg-toast .tx .act { font-size: 10px; color: var(--accent); margin: -1px -4px -3px; padding: 3px 4px; display: inline-block; cursor: pointer; }
    .lg-toast .x { flex: none; color: var(--dim); cursor: pointer; font-size: 10px; padding: 0 2px; }
    .lg-toast .ttl { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--tc, var(--dock)); opacity: 0.5; }
    .lg-toast.crit { border-left-color: var(--bad); }
    .lg-toast.crit .ic { background: #33121b; color: #ffb3bd; animation: di-blink 1s step-end infinite; }
    .lg-toast.crit .tx b { color: var(--abyss-ink); }
    .lg-toast.gold { border-left-color: var(--gold); --tc: var(--gold); }
    .lg-toast.gold .ic { background: #2e2818; color: var(--gold); }
    .lg-toast.blue { border-left-color: var(--dock); --tc: var(--dock); }
    .lg-toast.blue .ic { background: #12303c; color: #8fd8f0; }
    .lg-toast.ok { border-left-color: var(--ok); --tc: var(--ok); }
    .lg-toast.ok .ic { background: #132a1c; color: var(--ok); }
    .lg-toast.warn { border-left-color: var(--warn); --tc: var(--warn); }
    .lg-toast.warn .ic { background: #2e2313; color: var(--warn); }
    /* 近代化改修结果：沿用侧边 Toast，但属性按列读取，不挤成一行文字。 */
    #lg-toasts:has(.powerup-result) { width: min(290px, calc(100vw - 24px)); }
    .lg-toast.powerup-result {
      width: 100%; box-sizing: border-box; border-left-color: var(--ok); cursor: pointer;
      background:
        radial-gradient(300px 90px at 15% 0%, rgba(100, 205, 139, .09), transparent 72%),
        rgba(21, 28, 35, .97);
      animation: lg-powerup-in var(--motion-view) var(--motion-ease) both;
    }
    .lg-toast.powerup-result .ic {
      background: #132a1c; color: var(--ok); border: 1px solid #28583a;
    }
    .lg-toast.powerup-result .tx > b { color: #93ddb0; }
    .lg-toast.powerup-result .powerup-caption {
      margin-top: 1px; color: var(--dim); font-size: 9.5px;
    }
    .lg-toast.powerup-result .powerup-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr));
      gap: 5px; margin-top: 7px;
    }
    .lg-toast.powerup-result .powerup-stat {
      display: grid; grid-template-columns: 1fr auto; align-items: baseline;
      gap: 1px 4px; min-width: 0; padding: 5px 6px;
      border: 1px solid var(--line-soft); border-radius: 5px; background: rgba(8, 14, 18, .54);
    }
    .lg-toast.powerup-result .powerup-stat i {
      color: var(--sub); font-size: 9.5px; font-style: normal;
    }
    .lg-toast.powerup-result .powerup-stat strong {
      color: var(--gain, var(--ok)); font: 700 13px var(--mono);
    }
    .lg-toast.powerup-result .powerup-stat small {
      grid-column: 1 / -1; color: var(--dim); font: 9px var(--mono); white-space: nowrap;
    }
    /* 改修余量：还有空间的写「还可 +N」，真到顶了才写「满」——
       两者必须一眼分得开，否则「满」写多了就没人信了 */
    .lg-toast.powerup-result .powerup-stat em {
      grid-column: 1 / -1; color: var(--sub); font: 9px var(--mono); font-style: normal;
      white-space: nowrap;
    }
    .lg-toast.powerup-result .powerup-stat em.full { color: var(--gain, var(--ok)); font-weight: 600; }
    .lg-toast.powerup-result .powerup-stat.fire { --gain: #ef8b91; }
    .lg-toast.powerup-result .powerup-stat.torp { --gain: #72b9df; }
    .lg-toast.powerup-result .powerup-stat.aa { --gain: #7fd4a4; }
    .lg-toast.powerup-result .powerup-stat.armor { --gain: #d8bd7a; }
    .lg-toast.powerup-result .powerup-stat.luck { --gain: #c39be8; }
    .lg-toast.powerup-result .powerup-stat.hp { --gain: #72d9c3; }
    .lg-toast.powerup-result .powerup-stat.asw { --gain: #75cbd1; }
    .lg-toast.powerup-result .powerup-empty {
      margin-top: 7px; padding: 6px; border: 1px dashed var(--line);
      border-radius: 5px; color: var(--dim); font-size: 9.5px;
    }
    @keyframes lg-powerup-in {
      from { opacity: 0; transform: translateX(18px) scale(.985); }
      to { opacity: 1; transform: none; }
    }

    /* ══ 试听 · 悬浮迷你播放条 ══
       一行小胶囊：曲名/语音标签、播放暂停、拖拽滑条、mm:ss / mm:ss。
       **挂 body**（模块面板既裁 overflow 又是 transform 包含块，浮层长在模块行里会被裁掉，
       而模块 HTML 被动重渲会整块重画），层级压在提示卡(1190)/菜单(1300)/大图(1400)之下、
       Toast(1100) 之上——两者同占右下角，真挤到一起时该赢的是能点的那个。 */
    #preview-bar {
      position: fixed; right: 12px; bottom: 12px; z-index: 1120;
      display: flex; align-items: center; gap: 8px;
      max-width: min(340px, calc(100vw - 24px));
      padding: 5px 10px 5px 11px; border-radius: 999px;
      background: rgba(21, 28, 35, 0.96); border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      font-size: 11px; color: var(--sub);
      opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(6px);
      transition: opacity var(--motion-fast) ease, transform var(--motion-fast) ease,
        visibility 0s linear var(--motion-fast);
    }
    #preview-bar.show {
      opacity: 1; visibility: visible; pointer-events: auto; transform: none;
      transition: opacity var(--motion-fast) ease, transform var(--motion-fast) ease;
    }
    #preview-bar .pb-name {
      flex: 0 1 auto; min-width: 0; max-width: 132px; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #preview-bar .pb-toggle {
      flex: none; width: 20px; height: 20px; padding: 0; display: grid; place-items: center;
      border: 1px solid var(--line); border-radius: 50%;
      background: var(--bg2); color: var(--accent-ink);
      /* font-family 不写就整枚落回 Arial（顶栏动作组栽过一次，见上面那条注释） */
      font-family: inherit; font-size: 9px; line-height: 1; cursor: pointer;
    }
    #preview-bar .pb-toggle:hover { background: var(--bg3); border-color: var(--dim); }
    #preview-bar .pb-seek {
      flex: 1 1 96px; min-width: 62px; height: 3px; margin: 0;
      accent-color: var(--accent); cursor: pointer;
    }
    /* 时长还不知道（远端 mp3 元数据没到）或根本没有终点时禁用：
       拖了没反应的滑条比没有滑条更糟，所以要一眼看得出它此刻拖不动 */
    #preview-bar .pb-seek:disabled { cursor: default; opacity: .4; }
    #preview-bar .pb-time { flex: none; font: 10px/1 var(--mono); color: var(--dim); white-space: nowrap; }

    /* ══ 铎 · 活动仪表盘（移植自设计稿 14，.mod-du 作用域）══ */
    .mod-du { overflow: hidden; --evt: #b489ff; --evt-dim: #5c4a7a; --evt-glow: rgba(180, 137, 255, 0.1); }
    .mod-du .du-app { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg0); }
    .mod-du .du-empty { margin: auto; text-align: center; padding: 30px; }
    .mod-du .du-empty .t { font-family: var(--serif); font-size: 18px; color: var(--sub); margin-bottom: 10px; }
    .mod-du .du-empty .d { font-size: 12px; color: var(--sub); line-height: 1.9; }
    .mod-du .ehero { flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 11px 16px; border-bottom: 1px solid var(--line); background: radial-gradient(500px 160px at 20% 0%, var(--evt-glow), transparent 65%), var(--bg1); }
    .mod-du .ehero .badge { padding: 1px 8px; border-radius: 3px; font-size: 10.5px; font-weight: 700; color: #1a1024; background: linear-gradient(90deg, var(--evt), #d8b8ff); }
    .mod-du .ehero h1 { font-family: var(--serif); font-size: 17px; font-weight: 600; letter-spacing: 1px; }
    .mod-du .ehero .cd { font-family: var(--mono); font-size: 11px; color: var(--warn); }
    .mod-du .ehero .sp { flex: 1; }
    .mod-du .ehero .maps { display: flex; gap: 5px; flex-wrap: wrap; }
    .mod-du .mpill { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; border: 1px solid var(--line); border-radius: 11px; padding: 2px 9px; color: var(--sub); cursor: pointer; }
    .mod-du .mpill.done { color: var(--ok); border-color: #2b4a37; }
    .mod-du .mpill.cur { color: #d8b8ff; border-color: var(--evt); background: #241733; }
    .mod-du .mpill.lock { color: var(--dim); border-style: dashed; }
    .mod-du .mpill .gg { width: 26px; height: 4px; border-radius: 2px; background: var(--bg3); overflow: hidden; }
    .mod-du .mpill .gg i { display: block; height: 100%; background: var(--bad); }
    .mod-du .body2 { flex: 1; min-height: 0; display: flex; }
    /* 索引列跟着面板长：钉死 352px 时海域名从 700 一路省略到 1600（实测 5 条里 4 条被切，
       最长的还差 103px），而右栏那边一直有富余。下限 352 = 原宽，窄档一步不退；
       上限 480 是「够摊开最长的活动海域名」，再宽也不该让索引吃过右栏的详情。 */
    .mod-du .colL { width: clamp(352px, 32%, 480px); flex: none; display: flex; flex-direction: column; gap: 8px; padding: 8px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg0); }
    .mod-du .colR { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; overflow-y: auto; background: var(--bg0); }
    .mod-du .card { flex: none; background: var(--bg1); border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px 13px; }
    /* 突破奖励:当前难度行点亮,其余压暗;正文是 wiki 原文照录 */
    .mod-du .reward-row { display: flex; gap: 8px; padding: 3px 0; font-size: 11.5px; line-height: 1.55; color: var(--sub); border-bottom: 1px dashed rgba(255, 255, 255, .05); }
    .mod-du .reward-row:last-of-type { border-bottom: 0; }
    .mod-du .reward-row b { flex: none; min-width: 66px; font-size: 10.5px; font-weight: 600; color: var(--dim); }
    .mod-du .reward-row.mine { color: #efe3c2; }
    .mod-du .reward-row.mine b { color: var(--gold); }
    .mod-du .card .h { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: 11.5px; color: var(--sub); margin-bottom: 7px; }
    .mod-du .card .h::before { content: ''; width: 3px; height: 12px; border-radius: 2px; flex: none; background: var(--hc, var(--evt-dim)); }
    .mod-du .card .h b { color: var(--text); font-weight: 600; }
    .mod-du .card .h .aux { margin-left: auto; font-size: 10px; color: var(--dim); }
    .mod-du .mrow { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
    .mod-du .mrow:hover { background: var(--bg2); }
    .mod-du .mrow.on { background: #241733; border-color: var(--evt-dim); }
    .mod-du .mid { width: 34px; height: 24px; flex: none; border-radius: 4px; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700; background: #3a2c44; color: #d8b8ff; }
    .mod-du .mrow.lockx .mid { background: #1c2430; color: #3a4a58; }
    .mod-du .mrow .nm { flex: 1; min-width: 0; }
    .mod-du .mrow .nm b { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mod-du .mrow .nm > span { display: block; font-size: 9.5px; color: var(--dim); }
    .mod-du .diff { flex: none; font-size: 9.5px; border-radius: 3px; padding: 0 6px; border: 1px solid #4a3f22; color: var(--gold); font-weight: 700; }
    .mod-du .mst { flex: none; font-size: 10px; font-family: var(--mono); }
    .mod-du .mst.ok { color: var(--ok); }
    .mod-du .mst.cur { color: var(--bad); }
    .mod-du .mst.lk { color: var(--dim); }
    .mod-du .trow { display: flex; align-items: center; gap: 8px; padding: 5px 9px; border-radius: 6px; background: var(--bg0); border: 1px solid var(--line-soft); margin-bottom: 4px; font-size: 11px; cursor: pointer; }
    .mod-du .tchip { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; border-radius: 4px; padding: 1px 8px; color: #0d1318; }
    /* 札的编号：名字上位后编号退成小字——攻略表按编号排，不能丢 */
    .mod-du .tchip .tno { font-style: normal; font-family: var(--mono); font-size: 9px; opacity: .72; }
    .mod-du .trow .who { color: var(--sub); flex: 1; }
    .mod-du .trow .n { font-family: var(--mono); font-size: 10.5px; color: var(--sub); flex: none; }
    .mod-du .trow .lk { flex: none; font-size: 10px; color: var(--accent); }
    .mod-du .tfree { border-style: dashed; cursor: default; }
    .mod-du .tag-ships { padding: 3px 9px 7px; font-size: 11px; line-height: 2; }
    .mod-du .tag-ship { display: inline-flex; align-items: center; margin-right: 10px; }
    .mod-du .tag-ships i { font-style: normal; font-family: var(--mono); font-size: 9px; color: var(--dim); margin: 0 8px 0 2px; }
    /* 本活动已消耗（14 稿 Hero 行）：窄了换行堆叠 */
    .mod-du .ev-spent {
      flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
      margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line-soft); font-size: 11px;
    }
    .mod-du .ev-spent .k { color: var(--sub); }
    .mod-du .ev-res {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
      border-radius: 5px; background: var(--bg0); border: 1px solid var(--line-soft); color: var(--dim);
    }
    .mod-du .ev-res b { font-family: var(--mono); font-size: 12px; color: var(--text); }
    .mod-du .ev-res.out b { color: var(--bad); }
    .mod-du .ev-res.in b { color: var(--ok); }
    /* 基地航空（14 稿）：窄了换行堆叠，机体名不裁 */
    .mod-du .ab-row { padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
    .mod-du .ab-row:last-of-type { border-bottom: none; }
    .mod-du .ab-target { display: flex; align-items: center; gap: 7px; margin: 0 0 5px; padding: 5px 7px; border-radius: 5px; background: var(--bg0); color: var(--sub); font-size: 10.5px; }
    .mod-du .ab-target select { min-width: 120px; padding: 2px 22px 2px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg2); color: var(--text); font: 10.5px var(--sans); }
    .mod-du .ab-target span { color: var(--dim); font-size: 9.5px; }
    .mod-du .ab-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; font-size: 11.5px; }
    .mod-du .ab-h b { color: var(--text); }
    .mod-du .ab-nm { color: var(--sub); font-size: 10.5px; }
    .mod-du .ab-act {
      font-size: 10px; padding: 1px 7px; border-radius: 9px;
      background: var(--bg3); color: var(--sub);
    }
    .mod-du .ab-act.ok { background: var(--accent-wash); color: var(--accent-ink); }
    .mod-du .ab-act.dim { color: var(--dim); }
    .mod-du .ab-r { margin-left: auto; font-size: 10.5px; color: var(--dim); font-family: var(--mono); }
    .mod-du .ab-r b { color: var(--text); }
    .mod-du .ab-planes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .mod-du .ab-plane {
      font-size: 10px; padding: 2px 6px; border-radius: 4px;
      background: var(--bg0); border: 1px solid var(--line-soft); color: var(--sub);
    }
    .mod-du .ab-plane b { font-family: var(--mono); color: var(--text); }
    .mod-du .ab-plane b.low { color: var(--warn); }
    .mod-du .ab-plane.tired { border-color: #6b4f2a; }
    .mod-du .ab-plane .equip-icon.xs { width: 13px; height: 13px; }
    .mod-du .ab-reach { margin-top: 4px; font-size: 9.5px; }
    .mod-du .ab-reach.ok { color: var(--ok); }
    .mod-du .ab-reach.bad { color: var(--bad); }
    .mod-du .ab-warn { margin-top: 3px; font-size: 10px; color: var(--warn); }
    /* 推荐搭配：默认收起的一段；窄了逐项换行，不裁字段 */
    .mod-du .ab-adv-h {
      display: flex; align-items: baseline; gap: 6px; cursor: pointer;
      margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line-soft); font-size: 11px;
    }
    .mod-du .ab-adv-h b { color: var(--text); }
    .mod-du .ab-adv-x { margin-left: auto; color: var(--dim); font-size: 9.5px; }
    .mod-du .ab-adv { margin-top: 5px; }
    /* 二期由「对舰/对陆」两档细到五档（多出三类具名陆上型），挤不下就换行 */
    .mod-du .ab-adv-mode { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
    .mod-du .ab-adv-mode button {
      padding: 2px 7px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--bg2); color: var(--sub); font: 10px var(--sans); cursor: pointer;
      white-space: nowrap;
    }
    .mod-du .ab-adv-mode button.on { background: var(--accent-wash); color: var(--accent-ink); border-color: transparent; }
    .mod-du .ab-adv-sum { margin-bottom: 4px; font-size: 10.5px; color: var(--dim); font-family: var(--mono); }
    .mod-du .ab-adv-sum b { color: var(--text); }
    .mod-du .ab-adv-row {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
      padding: 3px 4px; border-radius: 4px; font-size: 10.5px; color: var(--dim);
    }
    .mod-du .ab-adv-row:nth-child(odd) { background: rgba(255, 255, 255, .022); }
    .mod-du .ab-adv-n { flex: 1 1 130px; min-width: 0; color: var(--sub); }
    .mod-du .ab-adv-n b { margin-left: 3px; color: var(--text); font-family: var(--mono); }
    .mod-du .ab-adv-role {
      margin-left: 5px; padding: 0 5px; border-radius: 8px;
      background: var(--bg3); color: var(--sub); font-size: 9px; font-style: normal;
    }
    .mod-du .ab-adv-role.buff { background: var(--accent-wash); color: var(--accent-ink); }
    /* 整队特効那一枚：与「延程」同形，颜色区分开——它标的是这一格换来的整队倍率 */
    .mod-du .ab-adv-bonus {
      margin-left: 5px; padding: 0 5px; border-radius: 8px;
      background: var(--accent-wash); color: var(--accent-ink);
      font-size: 9px; font-style: normal; font-family: var(--mono);
    }
    .mod-du .ab-adv-vs { margin-left: 6px; color: var(--dim); font-style: normal; }
    .mod-du .ab-adv-t { flex: none; width: 16px; text-align: center; color: var(--ok); }
    .mod-du .ab-adv-t.none { color: var(--dim); }
    .mod-du .ab-adv-p, .mod-du .ab-adv-d, .mod-du .ab-adv-b { flex: none; font-family: var(--mono); }
    .mod-du .ab-adv-p { color: var(--text); }
    .mod-du .tnote { margin-top: 6px; font-size: 10px; color: var(--dim); }
    .mod-du .gaug { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 11px; }
    .mod-du .gaug .k { flex: none; width: 96px; color: var(--sub); }
    .mod-du .gaug .bar { flex: 1; height: 7px; border-radius: 4px; background: #1b2733; overflow: hidden; }
    .mod-du .gaug .bar i { display: block; height: 100%; border-radius: 4px; }
    .mod-du .gaug .v { flex: none; font-family: var(--mono); font-size: 10.5px; color: var(--sub); text-align: right; }
    .mod-du .gaug.done .bar i { background: linear-gradient(90deg, #2b4a37, var(--ok)) !important; }
    .mod-du .gaug.done .v { color: var(--ok); }
    .mod-du .op-head { margin: 8px 0 4px; padding-top: 6px; border-top: 1px solid var(--line-soft); font-size: 10px; color: var(--sub); font-weight: 600; }
    .mod-du .op-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .mod-du .op-chip { padding: 2px 6px; border-radius: 4px; background: var(--bg0); border: 1px solid var(--line-soft); font-size: 9.5px; color: var(--sub); }
    .mod-du .op-chip b { color: var(--gold); font-family: var(--mono); font-weight: 500; }
    /* 舰队名不再独占 64px 定宽列（2026-08-24 用户点名回收）：与舰娘同行流式，
       换行后条目占满整宽。> div 用 display:contents 让条目直接进外层 flex 流。 */
    .mod-du .op-owned-row { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 4px 6px; margin-bottom: 3px; border-radius: 4px; background: var(--bg0); }
    .mod-du .op-owned-row > b { color: var(--sub); font-size: 10px; font-weight: 600; }
    .mod-du .op-owned-row > div { display: contents; }
    .mod-du .op-owned-ship { display: inline-flex; align-items: center; gap: 3px; min-width: 0; color: var(--text); font-size: 10px; }
    /* avatar 档默认圆形（50%）；这里要方头像，只借它的取景偏移（2026-08-24 用户点名） */
    .mod-du .op-owned-ship .ship-thumb { width: 22px; height: 22px; border-radius: 4px; }
    .mod-du .op-owned-ship i { color: var(--gold); font: normal 9px var(--mono); }
    .mod-du .op-honesty { margin-top: 5px; color: var(--dim); font-size: 9.5px; line-height: 1.45; }
    .mod-du .op-friend { padding: 4px 7px; margin-top: 3px; border-left: 2px solid var(--accent-dim); background: var(--bg0); font-size: 10px; color: var(--sub); }
    /* 备注/明细行独占一行——**只认 .op-fnote**。原来写的是后代 `span`，而舰名链接
       （elink）、实体术语、头像壳子生成的全是 span，被一并压成块级：一支友军的每个
       舰名各占一行、连「·」都单独一行（2026-08-28 用户截图报「太粗糙了」）。 */
    .mod-du .op-friend .op-fnote { display: block; color: var(--dim); margin-top: 2px; }

    .mod-du .op-friend-ship .ship-thumb { width: 22px; height: 22px; border-radius: 4px; }

    .mod-du .gnote2 { margin-top: 5px; font-size: 10px; color: var(--dim); }
    .mod-du .note9 { flex: none; padding: 2px 6px; font-size: 10px; color: var(--dim); }
    .mod-du .du-app.narrow .body2 { flex-direction: column; overflow-y: auto; }
