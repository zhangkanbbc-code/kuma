<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' data: file: https: kanso-cache:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https: kanso-cache:; media-src 'self' data: file: https: kanso-cache:; connect-src 'self' https:; object-src 'none'; base-uri 'none'"
  />
  <title>kuma</title>
  <style>
    /* ══ 设计 token（对齐图鉴设计稿口径）══ */
    :root {
      color-scheme: dark;
      --bg0: #0d1318;
      --bg1: #151c23;
      --bg2: #1c252e;
      --bg3: #232f3a;
      --line: #2a3742;
      --line-soft: #22303c;
      --text: #e8eef4;
      --sub: #93a4b3;
      --dim: #75899a;
      --accent: #4db8ff;
      --accent-dim: #2a6f9e;
      --gold: #e8c66a;
      --ok: #67c98a;
      --warn: #e8a04c;
      --bad: #e06c75;
      /* 2026-08-16 跨族挪档：族内实体色有 ΔE≥15 护栏，但状态/资源/功能三套体系
         互相之间曾撞车（夜战↔开发资材同值、警告↔铝土 8.6、任务↔开发 7.9、
         舰娘↔建造 10.9、装备↔坞 12.0、道具↔弹药 13.5）。实体色一个不动，
         只挪资源/功能侧；同屏共存对全部拉到 ΔE≥15，护栏实算在 core-regressions。 */
      --dock: #48a6c9;
      --r-fuel: #8fb87a;
      --r-ammo: #b99a4e;
      --r-steel: #8fa8c0;
      --r-baux: #efab30;
      --r-build: #5f96d3;
      --r-repair: #7ac9b8;
      --r-dev: #9d78e5;
      --r-screw: #e08a97;
      /* 全局实体词条：颜色表达“它是什么”，不表达好坏或紧急程度。
         item/expedition 曾与 --gold（待领取）/--warn（警告）肉眼同色（互相对比度
         1.03/1.07）——任务奖励区里「这是个道具」和「这个能领了」靠颜色分不开，
         各自挪开半档。 */
      --entity-ship: #83c9ff;
      --entity-abyss: #ff8796;
      --entity-equip: #79d4e8;
      --entity-map: #86d29b;
      --entity-item: #e6b98f;
      --entity-quest: #c9a7ff;
      --entity-expedition: #e89a82;
      --entity-fleet: #aab8ff;
      --entity-material: #b6a47e;
      --entity-practice: #e2a2d1;
      --entity-timer: #9fd3c7;
      --entity-nationality: #b8d27e;
      /* 图鉴筛选的四个维度各一色（2026-08-22 图鉴升级批）：舰种=舰娘蓝、国籍=既有黄绿，
         舰级与史实编队新立两枚。选色只看一件事——**这四枚在同一条筛选条上同屏**，
         所以四者两两最小 ΔE 43.9（远高于实体色 15 的护栏）。
         舰级取玫瑰：与它同页出现的装备青(#79d4e8)离得开；若取青绿一档，
         详情页「装备槽/装备加成」就在同屏，会读成同一族。
         编队取水绿：最近的邻居是时限青(#9fd3c7, ΔE 20.9)，两者分别只在「掉落」页
         与「编队」小节出现，不同屏。两枚都进 core-regressions 的实体色两两护栏。 */
      --entity-shipclass: #f7bfc6;
      --entity-histfleet: #5fe0cd;
      /* 高频硬编码色收编（改主题从这里一次改，不再全文 26 处 sed）：
         accent 亮字/选中底、深海亮字/次亮、航空绿、夜战紫 */
      --accent-ink: #bfe6ff;
      --accent-wash: #173040;
      --abyss-ink: #ff9fae;
      --abyss-soft: #e8b8c0;
      --air: #8fd694;
      --night: #7e86f2; /* 靛而非紫：与任务紫/开发紫分家（挪档见上） */
      /* 图鉴属性条的强化分层色：等级成长(青)/99级以上婚后段(紫)/结婚耐久(粉)/改修余量(橙)。
         列表详情预览的实例条复用同一色语，另加「装备给予」(绿)；轨道底色一并收编 */
      --stat-grow: #3f9bd8;
      --stat-over99: #9b7fd4;
      --stat-marriage: #d98cae;
      --stat-mod: #c98d4f;
      --stat-equip: #5cb17e;
      --stat-track: #1b2733;
      /* 受损语音弹幕的分档色：小破=浅黄、中破=琥珀、大破=红、击沉=沉紫
         （要压住游戏画面，比 --warn 亮一档） */
      --voice-dmg-light: #ffe9a0;
      --voice-dmg-mid: #ffc46b;
      --voice-dmg-heavy: #ff8585;
      --voice-dmg-sunk: #c5a3f0;
      /* 应急修理发动横幅的两档绿（要員 42 / 女神 43，id 已对 api_start2 主数据核实）。
         两档必须在同屏（同一战两艘各发动一种）也一眼分得开，所以**色相与明度一起拉开**：
         要員＝沉的叶绿（L* 58），女神＝近白的水绿（L* 91）。
         ΔE(crew, goddess) = 39.7；对 --ok(#67c98a) 分别 15.5 / 28.8，
         不会被读成「又一条强化成功」。bg1 上对比度 5.2 / 14.1。
         第一版取的是 #3fae86 / #9ff2c4（ΔE 26.1）——数字过关，但实机截图上两条横幅
         并排时仍读成同一档薄荷绿，于是加大到现在这两个值，并让徽记也分家（修 / 神）。
         实算护栏在 core-regressions「色板」一节。 */
      --damecon-crew: #3d9e63;
      --damecon-goddess: #a8f5dc;
      /* ケッコンカッコカリ（婚舰）的粉：横幅标题、外框光效、花瓣与婚礼台词字幕同一个色。
         调色板里粉的邻居很多，而这一枚必须**一眼不是警报**——它离每一个既有粉都拉开
         ΔE≥20：演习粉 20.4 / 结婚耐久条 22.0 / 深海亮字 28.7 / 螺丝 30.7 / 大破弹幕红 39.6
         （实算护栏在 core-regressions「色板」一节）。bg1 上对比度 8.3，是字不是装饰。
         为什么不复用 --stat-marriage：那一枚是图鉴属性条里「结婚带来的耐久增量」这一段的
         身份色，与它同屏；两者同名不同职，共用一个值就再也分不出「这是那一段」还是
         「现在正在办婚礼」。
         -rgb 是同一个颜色的三元组，专给需要 alpha 的氛围光用（rgba 吃不下 hex 变量）。
         两者必须同值，护栏同样在色板一节。 */
      --wedding: #ff8fd6;
      --wedding-rgb: 255, 143, 214;
      /* 近白的粉：花瓣受光面与横幅上沿高光的中段（对应金档的 #fff1b3 那一手） */
      --wedding-lit: #ffe0f3;
      --scrollbar-track: #10171d;
      --scrollbar-thumb: #334957;
      --scrollbar-thumb-hover: #486476;
      --scrollbar-thumb-active: #5c7b90;
      /* 新增样式的档位约定（存量不追溯）：
         字号限 8.5 / 9.5 / 10.5 / 11.5 / 13；过渡限 micro/fast/view 三档；
         圆角限 3 / 5 / 8 / 10；行高限 1.3 / 1.5 / 1.8。 */
      --motion-fast: 150ms;
      --motion-micro: 120ms;
      --motion-view: 200ms;
      /* 三档之外的**唯一**例外，只给「整个工作台换一种状态」用（现仅击沉哀悼态的失色）。
         三档是控件反馈的尺度：那种时长套在全屏失色上，看起来像闪了一下故障，
         而这一下要读成「停顿」。别把它当第四档通用时长用。 */
      --motion-solemn: 900ms;
      --motion-ease: cubic-bezier(.2, .72, .22, 1);
      --serif: 'Yu Mincho', 'MS Mincho', 'SimSun', serif;
      /* CJK 等宽在最前：纯西文等宽栈会让中文回退系统 UI 字体（中英粗细断裂、
         个别加粗中文落进哥特体假衬线）。Maple CN 版中英 2:1 对齐、笔画同粗。 */
      --mono: 'Maple Mono NF CN', 'Cascadia Code', 'Consolas', monospace;
      /* 19 处 `font: … var(--sans)` 引用它，这个变量必须存在——font 简写里带一个
         未定义变量，整条声明按规范作废，8.5px 的小徽章会改按父级字号渲染。 */
      --sans: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb {
      background-color: var(--scrollbar-thumb);
      border-radius: 8px;
      border: 2px solid var(--scrollbar-track);
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-thumb-hover); }
    ::-webkit-scrollbar-thumb:active { background-color: var(--scrollbar-thumb-active); }
    ::-webkit-scrollbar-corner { background: var(--scrollbar-track); }

    html, body {
      height: 100%;
      background: var(--bg0);
      color: var(--text);
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100%; }

    /* 出处小记号（kernel.lodeCreditMark）：常驻只留这一枚，全文进 title 悬停。
       尺寸压到比正文小一档、颜色贴底——它的职责是「在」，不是「被读」。 */
    .credit-mark {
      display: inline-block; vertical-align: 1px;
      font-size: 8.5px; line-height: 1; padding: 2px 3px;
      color: var(--dim); border: 1px solid var(--line-soft); border-radius: 3px;
      cursor: help; user-select: none;
    }

    /* BGM 试听词条（bgm-preview）：家具详情/海域详情共用，全局皮 */
    .bgm-pv { cursor: pointer; color: var(--sub); user-select: none; }
    .bgm-pv:hover { color: var(--accent); }
    .bgm-pv.playing { color: var(--accent); }
    /* 停在半路：还留着进度，再点接着放。比「在响」淡一档，看得出它没走远 */
    .bgm-pv.paused { color: var(--accent); opacity: .6; }
    /* 档案里有实物：播它零联网。只是一枚极轻的记号，不喧宾夺主 */
    .bgm-pv.kept { color: var(--text); }
    /* 放不出声（档案没有、缓存没有、现取又被钥里关掉）：不做成点不响的按钮 */
    .bgm-pv.muted { cursor: default; color: var(--dim); }
    .bgm-pv.muted:hover { color: var(--dim); }

    /* ══ 顶栏 ══ */
    header {
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: var(--bg1);
      border-bottom: 1px solid var(--line);
      position: relative;
      transition: filter var(--motion-solemn) ease; /* 哀悼态失色（见 body.kanso-mourning） */
    }
    .wordmark { font-weight: 700; letter-spacing: 2px; color: var(--accent); }
    .wordmark small { color: var(--dim); font-weight: 400; letter-spacing: 0; margin-left: 6px; }
    /* 泊地槽位定宽保底（2026-08-16 用户定的）：识别前后宽度不跳；IP 在悬停里 */
    #server-badge { color: var(--dim); font-size: 12px; display: inline-block; min-width: 72px; cursor: help; }
    #server-badge.known { color: var(--ok); }
    /* 顶栏按钮是一族：弹窗组（回顾/通知/设置，.ov-btn）与动作组（专注/截图/刷新）
       并排站在同一条栏里，形态就该一样。两组本来分两次写（.ov-btn 出自 05c7150 的
       顶栏弹窗宿主，动作组出自初版），谁也没参照谁，漂出四项差异：高 22/25.1、
       圆角 4/3、内边距 0-9/3-10、字色 --sub/--text，外加动作组漏了 font-family:inherit
       整组落回 Arial。两组的 hover 反而完全一致（accent 描边+字），可见本意就是同一枚
       按钮——所以是漂移不是分组，一律收进这条规则；.ov-btn 只留它真正独有的东西。
       圆角取 3 是回到档位（:root 注释：圆角限 3/5/8/10）。 */
    header button {
      background: var(--bg2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 3px;
      height: 22px;
      padding: 0 10px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      font-family: inherit;
      white-space: nowrap;
    }
    header button:hover { border-color: var(--accent); color: var(--accent); }

    /* 崩溃角标：平时不存在，出事才现身。做隔离而不给可见信号，
       只会把「模块崩了」伪装成「这块数据怎么不动了」。 */
    #crash-badge {
      background: color-mix(in srgb, var(--bad) 18%, var(--bg2));
      border: 1px solid var(--bad); color: var(--bad);
      border-radius: 3px; padding: 3px 8px; cursor: pointer;
      font-size: 11.5px; font-weight: 600; margin-right: 6px;
    }
    #crash-badge:hover { background: color-mix(in srgb, var(--bad) 32%, var(--bg2)); color: var(--text); }
    #crash-panel {
      /* 诊断入口要压在常规浮层（overlay 900 / toast 1100）之上：
         正读着堆栈被一条远征返港 Toast 盖住，是本末倒置 */
      position: fixed; top: 34px; right: 10px; z-index: 1200;
      width: min(760px, 76vw); max-height: 72vh;
      display: flex; flex-direction: column;
      background: var(--bg1); border: 1px solid var(--bad); border-radius: 5px;
      box-shadow: 0 10px 34px rgba(0,0,0,.55);
    }
    #crash-panel[hidden] { display: none; }
    #crash-panel .cp-head {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-bottom: 1px solid var(--line); flex: none;
    }
    #crash-panel .cp-head b { color: var(--bad); font-size: 12.5px; }
    #crash-panel .cp-head span { flex: 1; color: var(--dim); font-size: 11px; }
    #crash-panel .cp-head button {
      background: var(--bg2); color: var(--sub); border: 1px solid var(--line);
      border-radius: 3px; padding: 2px 9px; cursor: pointer; font-size: 11px;
    }
    #crash-panel .cp-head button:hover { border-color: var(--accent); color: var(--accent); }
    #crash-panel .cp-body { overflow: auto; padding: 4px 0; }
    #crash-panel .cp-item { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); }
    #crash-panel .cp-item:last-child { border-bottom: none; }
    #crash-panel .cp-scope {
      display: flex; align-items: center; gap: 6px;
      color: var(--warn); font-size: 11.5px; font-weight: 600;
    }
    #crash-panel .cp-scope em { font-style: normal; color: var(--bad); }
    #crash-panel .cp-scope i { margin-left: auto; font-style: normal; color: var(--dim); font-weight: 400; }
    #crash-panel .cp-msg { color: var(--text); font-size: 12px; margin: 3px 0; line-height: 1.5; }
    #crash-panel pre {
      margin: 0; max-height: 150px; overflow: auto;
      color: var(--dim); font-size: 10.5px; line-height: 1.5; white-space: pre-wrap;
    }
    #crash-panel .cp-empty { padding: 16px; color: var(--dim); font-size: 12px; text-align: center; }
    /* 已知噪音：留着可查，但一眼看得出「这不是错误」，不跟真记录抢注意力 */
    #crash-panel .cp-noise-h {
      padding: 6px 10px; margin-top: 4px;
      border-top: 1px solid var(--line); background: var(--bg0);
      color: var(--dim); font-size: 10.5px;
    }
    #crash-panel .cp-item.benign { opacity: .62; }
    #crash-panel .cp-item.benign .cp-scope { color: var(--dim); }
    #crash-panel .cp-why { color: var(--dim); font-size: 10.5px; font-style: italic; }

    /* 装配失败的模块：只黑自己这一格，并把错误原文摆出来 */
    .mod-crashed {
      margin: 12px; padding: 14px 16px;
      border: 1px solid var(--bad); border-left-width: 3px; border-radius: 4px;
      background: color-mix(in srgb, var(--bad) 7%, var(--bg1));
    }
    .mod-crashed b { display: block; color: var(--bad); font-size: 13px; margin-bottom: 6px; }
    .mod-crashed p {
      margin: 0 0 8px; color: var(--text); font-size: 12px; line-height: 1.6;
      word-break: break-word;
    }
    .mod-crashed small { display: block; color: var(--dim); font-size: 11px; margin-bottom: 10px; }
    .mod-crashed button {
      background: var(--bg2); color: var(--sub); border: 1px solid var(--line);
      border-radius: 3px; padding: 4px 12px; cursor: pointer; font-size: 12px;
    }
    .mod-crashed button:hover { border-color: var(--accent); color: var(--accent); }
    /* 状态条吃掉抬头中段的全部剩余宽度（2026-08-12 用户实锤：远征四个「领」+
       演习 + 舰装计数一起出现时，原来的 min(1080px,56vw) 定宽装不下，最右被裁）。
       抬头除信息外只剩两侧几个按钮，不再绝对定位居中，改成普通 flex 成员：
       两侧内容多宽都不会重叠，中段有多少空间就用多少。 */
    #header-status {
      flex: 1 1 0; min-width: 0; height: 27px;
      display: flex; align-items: center; gap: 5px;
      overflow: hidden; scrollbar-width: none;
      border-left: 1px solid var(--line); border-right: 1px solid var(--line);
      padding: 0 6px; white-space: nowrap;
    }
    #header-status::-webkit-scrollbar { display: none; }
    #header-status.compact { gap: 3px; padding-inline: 4px; }
    #header-status.compact .hs-player { max-width: 120px; gap: 3px; }
    #header-status.compact .hs-bgm { max-width: 108px; padding-right: 3px; gap: 3px; }
    #header-status.compact .hs-bgm > span { display: none; }
    #header-status.compact .hs-group { gap: 1px; padding-left: 3px; }
    #header-status.compact .hs-label { display: none; }
    #header-status.compact .hs-res { padding-inline: 2px; }
    #header-status.compact .hs-chip,
    #header-status.compact .hs-cap { gap: 2px; padding-inline: 4px; }
    #header-status .hs-player {
      flex: none; display: inline-flex; align-items: baseline; gap: 5px;
      /* min-width 保底：登录前「等待登录」也占住提督名的位置，同步后不右推整条 */
      min-width: 100px; max-width: 150px; padding-right: 3px; color: var(--text);
    }
    #header-status .hs-bgm {
      flex: 0 1 190px; min-width: 54px; max-width: 190px;
      display: inline-flex; align-items: center; gap: 4px;
      padding-right: 6px; border-right: 1px solid var(--line-soft);
      color: var(--dim);
    }
    #header-status .hs-bgm > i {
      width: 12px; height: 11px; flex: none;
      display: inline-flex; align-items: end; justify-content: center; gap: 1px;
      font-style: normal;
    }
    #header-status .hs-bgm > i b {
      width: 2px; height: 45%; border-radius: 1px; background: var(--accent);
      animation: header-bgm-level .8s ease-in-out infinite alternate;
    }
    /* 空闲态：槽位在、波形不动、整块压暗——位置是留的，注意力不占 */
    #header-status .hs-bgm.idle { opacity: .45; }
    #header-status .hs-bgm.idle > i b { animation: none; height: 30%; background: var(--dim); }
    #header-status .hs-bgm > i b:nth-child(2) { height: 90%; animation-delay: -.45s; }
    #header-status .hs-bgm > i b:nth-child(3) { height: 65%; animation-delay: -.2s; }
    #header-status .hs-bgm > span { flex: none; color: var(--dim); font-size: 8.5px; }
    #header-status .hs-bgm > strong {
      min-width: 0; overflow: hidden; color: var(--sub); font-size: 9.5px;
      font-weight: 600; white-space: nowrap; text-overflow: ellipsis;
    }
    @keyframes header-bgm-level {
      from { transform: scaleY(.55); opacity: .6; }
      to { transform: scaleY(1); opacity: 1; }
    }
    #header-status .hs-player b {
      overflow: hidden; text-overflow: ellipsis; font-size: 11px; font-weight: 600;
    }
    #header-status .hs-player em { color: var(--gold); font: 9.5px var(--mono); }
    #header-status .hs-player.muted, #header-status .hs-muted { color: var(--dim); font-size: 10px; }
    #header-status .hs-group {
      flex: none; display: inline-flex; align-items: center; gap: 3px;
      border-left: 1px solid var(--line-soft); padding-left: 5px;
    }
    #header-status .hs-group.resources { gap: 1px; }
    #header-status .hs-label { color: var(--dim); font-size: 9px; font-weight: 700; }
    #header-status .hs-res {
      height: 22px; display: inline-flex; align-items: center; gap: 1px;
      padding: 0 3px; border-radius: 4px; color: var(--sub); cursor: pointer;
    }
    #header-status .hs-res:hover, #header-status .hs-chip:hover, #header-status .hs-cap:hover { background: var(--bg3); color: var(--accent); }
    #header-status .hs-res .material-icon.xs { width: 12px; height: 12px; }
    /* 数字位保底 5 字形宽（2026-08-16 用户定的槽位常驻口径）：四资源 fmtShort
       最宽「14.8k」、四材料到顶「3,000」（上限 3000）都是 5 字形——桶从 34 涨到
       3,000 或燃料跨过 1 万，这一格都不再变宽。右对齐=数位向右看齐，八格整列。 */
    #header-status .hs-res b { font: 9.5px var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 24px; text-align: right; }
    #header-status .hs-res.warn b { color: var(--warn); }
    #header-status .hs-res.bad b { color: var(--bad); }
    #header-status .hs-cap {
      height: 21px; display: inline-flex; align-items: center; gap: 3px;
      padding: 0 5px; border: 1px solid var(--line-soft); border-radius: 5px;
      color: var(--sub); background: var(--bg0); cursor: pointer;
    }
    #header-status .hs-cap i { color: var(--dim); font: 8.5px var(--sans); font-style: normal; }
    #header-status .hs-cap b { color: var(--text); font: 9px var(--mono); font-weight: 500; }
    #header-status .hs-cap.warn { border-color: color-mix(in srgb, var(--warn) 48%, var(--line)); }
    #header-status .hs-cap.warn b { color: var(--warn); }
    #header-status .hs-cap.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
    #header-status .hs-cap.bad b { color: var(--bad); }
    #header-status .hs-chip {
      height: 21px; display: inline-flex; align-items: center; gap: 3px;
      padding: 0 5px; border: 1px solid var(--line-soft); border-radius: 5px;
      color: var(--dim); background: var(--bg0); cursor: pointer;
    }
    #header-status .hs-chip i {
      width: 13px; height: 13px; display: grid; place-items: center;
      border-radius: 50%; background: var(--bg3); color: var(--sub);
      font: 8.5px var(--mono); font-style: normal;
    }
    /* 标签保底两个汉字宽（2026-08-16 用户定的）：单字舰名（雪）或短文案
       也占满两字位，芯片宽度不随内容抖动 */
    #header-status .hs-chip b { color: var(--text); font: 9.5px var(--mono); font-weight: 500; min-width: 19px; text-align: center; }
    #header-status .hs-chip em { color: var(--dim); font-size: 9px; font-style: normal; min-width: 18px; text-align: center; }
    /* 远征三态（2026-08-21 用户拍板：在外 / 归来 / 未补给 各一个颜色，看边框）。
       在外＝现行的进行中色系（--dock）；归来＝待领取的金（与建造坞「待领」同一句话，
       全应用「可以去拿了」就是这一枚金）；未补给＝警示色系（--warn，与演习未打、
       仓库将满同一档）。三者两两 ΔE 实算护栏在 core-regressions「色板」。 */
    #header-status .hs-chip.exp.on { border-color: color-mix(in srgb, var(--dock) 38%, var(--line)); }
    #header-status .hs-chip.exp.on i { color: var(--dock); }
    #header-status .hs-chip.exp.on.back { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
    #header-status .hs-chip.exp.on.back i, #header-status .hs-chip.exp.on.back b { color: var(--gold); }
    #header-status .hs-chip.exp.unsupplied { border-color: color-mix(in srgb, var(--warn) 48%, var(--line)); }
    #header-status .hs-chip.exp.unsupplied i { color: var(--warn); }
    #header-status .hs-chip.dock.on { border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
    #header-status .hs-chip.dock.on i { color: var(--ok); }
    /* 顶栏里同时是 EntityLink 的芯片（建造坞 → 建造坞预览；入渠 → 在修的那艘舰）。
       `.el` 那套点划下划线是给正文里的实体名用的，套在芯片上会顶出一条歪线——
       芯片本来就有边框，改为整块提亮即可。按 .hs-chip.el 写而不是钉死某一种芯片：
       下一枚挂实体的芯片不必再来补一遍同样的三行。 */
    #header-status .hs-chip.el { border-bottom-style: solid; }
    #header-status .hs-chip.el:hover { border-bottom-color: currentColor; }
    #header-status .hs-chip.el.peeked { box-shadow: 0 0 0 1px currentColor inset; }
    /* 建造坞：建造中与「完成待领」要一眼分得开——后者是可以去拿了 */
    #header-status .hs-chip.build.on { border-color: color-mix(in srgb, var(--r-build) 38%, var(--line)); }
    #header-status .hs-chip.build.on i { color: var(--r-build); }
    #header-status .hs-chip.build.ready { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
    #header-status .hs-chip.build.ready i, #header-status .hs-chip.build.ready b { color: var(--gold); }
    #header-status .hs-chip.practice.pending { border-color: color-mix(in srgb, var(--warn) 48%, var(--line)); }
    #header-status .hs-chip.practice.pending i { color: var(--warn); }
    #header-status .hs-chip.practice.done { border-color: color-mix(in srgb, var(--ok) 42%, var(--line)); }
    #header-status .hs-chip.practice.done i { color: var(--ok); }
    #header-status .hs-chip.practice.stale { opacity: .62; }
    #header-status .hs-count { color: var(--sub); font: 9px var(--mono); }
    #header-status .pulse { animation: header-status-pulse .55s ease-in-out 4 alternate; }
    @keyframes header-status-pulse {
      to { background: color-mix(in srgb, var(--accent) 30%, var(--bg2)); box-shadow: 0 0 0 1px var(--accent); }
    }
    @media (max-width: 2199px) {
      #header-status { width: min(980px, 51vw); }
    }

    /* 只指工作区那一个 <main>。别写回裸 main：模块自己也用语义化 <main>
       （史 .shi-body、镖 .detail），裸选择器会把 display:flex + padding-left 泼进去——
       史的内容列因此被当成 flex 项按 max-content 收窄（各卷实测只占面板宽的
       32%～72%，右边整片空着），镖收起的详情栏也会被 padding 撑出 8px 空边。 */
    #app > main {
      flex: 1; display: flex; min-height: 0;
      position: relative; padding-left: 7px;
    }

    /* ══ 游戏区 ══ */
    #game-area {
      flex: 1 1 auto;
      min-width: 380px; /* 保底：坞位再宽也不许把游戏挤没 */
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden; /* 拖动分隔条时 wrapper 定宽缩放，溢出裁掉 */
      container-type: size; /* 给 wrapper 提供 cqw/cqh：区高不够时宽度要能缩回来 */
    }
    /* 等比包含（2026-08-12 用户实锤：区域比 5:3 矮时游戏底部被裁掉）。
       原先 width:100% + max-height:100% —— 高度被钳住但宽度不缩，比例失真；
       缩放系数按宽度算，游戏内容比可视区高，底下就切了。宽度显式取
       「区宽」与「区高×5/3」的小者，比例永远成立，横竖都只留黑边不裁内容。 */
    #game-wrapper { width: min(100cqw, calc(100cqh * (1200 / 720))); aspect-ratio: 1200 / 720; position: relative; }
    #game-wrapper webview { position: absolute; inset: 0; width: 100%; height: 100%; }
    #voice-danmaku {
      position: absolute; z-index: 8; inset: 3.5% 0 auto; height: 42%;
      overflow: hidden; pointer-events: none; background: transparent;
    }
    #voice-danmaku .voice-danmaku-item {
      position: absolute; top: calc(var(--voice-lane) * 1.8em);
      display: block; width: max-content; max-width: none; white-space: nowrap;
      font-size: clamp(13px, 1.45vw, 19px); font-weight: 650; line-height: 1.55;
      letter-spacing: .01em;
      animation-duration: var(--voice-duration);
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      text-shadow:
        -1px -1px 1px rgba(0, 0, 0, .96),
        1px -1px 1px rgba(0, 0, 0, .96),
        -1px 1px 1px rgba(0, 0, 0, .96),
        1px 1px 1px rgba(0, 0, 0, .96),
        0 2px 5px rgba(0, 0, 0, .92);
    }
    #voice-danmaku .voice-danmaku-item.friendly {
      left: 0; color: #b9f0e4; animation-name: voice-danmaku-ltr;
    }
    #voice-danmaku .voice-danmaku-item.enemy {
      right: 0; color: #ffc0c7; animation-name: voice-danmaku-rtl;
    }
    /* 受损语音按播放时刻的实际血量分档：小破黄、中破琥珀、大破红、击沉紫（敌我通用，压过阵营色） */
    #voice-danmaku .voice-danmaku-item.dmg-light { color: var(--voice-dmg-light); }
    #voice-danmaku .voice-danmaku-item.dmg-mid { color: var(--voice-dmg-mid); }
    #voice-danmaku .voice-danmaku-item.dmg-heavy { color: var(--voice-dmg-heavy); }
    #voice-danmaku .voice-danmaku-item.dmg-sunk { color: var(--voice-dmg-sunk); }
    /* 婚礼台词（24 号槽 ケッコンカッコカリ）。它不是伤害轴上的一档，所以另起 class 名 */
    #voice-danmaku .voice-danmaku-item.voice-wedding { color: var(--wedding); }
    @keyframes voice-danmaku-ltr {
      from { left: 0; transform: translateX(-50%); }
      to { left: 100%; transform: translateX(0); }
    }
    @keyframes voice-danmaku-rtl {
      from { right: 0; transform: translateX(50%); }
      to { right: 100%; transform: translateX(0); }
    }
    #voice-subtitle {
      position: absolute; z-index: 7; left: 4%; right: 4%; bottom: 3.5%;
      display: block; pointer-events: none; background: transparent;
      color: #f4f8fb; text-align: center; font-size: clamp(13px, 1.55vw, 20px);
      font-weight: 650; line-height: 1.45; letter-spacing: .01em;
      opacity: 0; transform: translateY(7px);
      transition: opacity var(--motion-fast) ease, transform var(--motion-fast) ease;
      text-shadow:
        -1px -1px 1px rgba(0, 0, 0, .95),
        1px -1px 1px rgba(0, 0, 0, .95),
        -1px 1px 1px rgba(0, 0, 0, .95),
        1px 1px 1px rgba(0, 0, 0, .95),
        0 2px 5px rgba(0, 0, 0, .95);
    }
    #voice-subtitle.show { opacity: 1; transform: translateY(0); }
    #voice-subtitle .voice-subtitle-speaker { color: #8fe0cc; white-space: nowrap; }
    #voice-subtitle .voice-subtitle-line { overflow-wrap: anywhere; }
    /* 婚礼那一句整条染粉（含舰名）：底部字幕是同一个常驻元素反复复用，
       这个 class 由 showSubtitle 逐句摘挂，不会粘在后面的日常台词上。 */
    #voice-subtitle.voice-wedding .voice-subtitle-line { color: var(--wedding); }
    #voice-subtitle.voice-wedding .voice-subtitle-speaker { color: var(--wedding-lit); }
    #game-overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(13, 19, 24, 0.92);
      z-index: 10;
      text-align: center;
      line-height: 1.8;
      padding: 24px;
    }
    #game-overlay.visible { display: flex; }
    #game-overlay .overlay-title { color: var(--bad); font-weight: 600; }
    #game-overlay .overlay-detail { color: var(--dim); font-family: var(--mono); font-size: 12px; }
    #game-overlay .overlay-more { margin-top: 10px; text-align: left; }
    #game-overlay .overlay-more summary { cursor: pointer; color: var(--dim); text-align: center; }
    #game-overlay .overlay-more summary:hover { color: var(--accent); }
    #game-overlay .overlay-more pre {
      margin: 8px 0 0; padding: 8px 10px; max-height: 220px; overflow: auto;
      background: var(--bg1); border: 1px solid var(--line); border-radius: 3px;
      font-family: var(--mono); font-size: 11px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-all; color: var(--dim);
    }
    #game-overlay button {
      background: var(--bg2); color: var(--text);
      border: 1px solid var(--line); border-radius: 3px; padding: 5px 18px; cursor: pointer;
    }
    #game-overlay button:hover { border-color: var(--accent); color: var(--accent); }

    /* ══ 工作台骨架（镇 + 铆）══
       游戏居中，三面环坞：左=速览(盯) 右=战斗(打) 底=工作台(管)；
       最左是模块导航条（按功能名列全部模块，点亮即已装配）。 */
    #element-rail {
      position: absolute; z-index: 40; inset: 0 auto 0 0;
      width: 7px; box-sizing: border-box;
      display: flex; flex-direction: column; gap: 2px;
      padding: 5px 0; overflow: hidden;
      background: var(--bg1); border-right: 1px solid var(--line);
      /* filter 在列表里是给哀悼态失色用的（见 body.kanso-mourning）：
         过渡必须写在**基础规则**上，写进 .kanso-mourning 那一条的话，
         解除时元素已经不匹配那条选择器，颜色会「啪」地弹回来。 */
      transition: width var(--motion-fast) ease, padding var(--motion-fast) ease, box-shadow var(--motion-fast) ease, filter var(--motion-solemn) ease;
    }
    #element-rail::after {
      content: ''; position: absolute; top: 50%; right: 1px;
      width: 2px; height: 36px; border-radius: 2px;
      background: var(--accent-dim); opacity: .75;
      transform: translateY(-50%);
      transition: opacity var(--motion-micro) ease;
    }
    #element-rail:has(.badge-n)::after { background: var(--bad); opacity: 1; }
    #element-rail:hover {
      width: 44px; padding: 5px 4px; overflow-y: auto; overflow-x: hidden;
      box-shadow: 7px 0 16px rgba(0, 0, 0, .32);
    }
    #element-rail:hover::after { opacity: 0; }
    #element-rail > * {
      opacity: 0; pointer-events: none; transform: translateX(-5px);
      transition: opacity var(--motion-micro) ease, transform var(--motion-fast) ease;
    }
    #element-rail:hover > * {
      opacity: 1; pointer-events: auto; transform: none;
    }
    #element-rail .rail-sep { height: 1px; background: var(--line); margin: 3px 2px; flex: none; }
    .element-tile {
      flex: none; height: 32px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg2); border: 1px solid var(--line); border-radius: 4px;
      font-size: 13px; line-height: 1; color: var(--dim); white-space: nowrap;
      cursor: default; user-select: none; position: relative;
    }
    .element-tile[hidden] { display: none; }
    .element-tile.active { color: var(--accent); border-color: var(--accent-dim); background: color-mix(in srgb, var(--accent) 10%, var(--bg2)); }
    .element-tile.mounted { cursor: pointer; }
    .element-tile.mounted:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--bg2)); }
    .element-tile.showing { color: #fff; background: var(--accent-dim); border-color: var(--accent); }
    /* 被搁置的模块：留在导航条上但压暗——这是唯一的恢复入口，不能消失 */
    .element-tile.shelved { opacity: .45; border-style: dashed; }
    /* 左上角小点：所属坞位（左青/右紫/底金） */
    .element-tile .dk { position: absolute; top: 2px; right: 3px; width: 4px; height: 4px; border-radius: 50%; }
    .element-tile .dk.left { background: var(--dock); }
    .element-tile .dk.right { background: #b489ff; }
    .element-tile .dk.bottom { background: var(--gold); }
    .element-tile .dk.overlay { background: var(--sub); }
    .element-tile .badge-n {
      position: absolute; top: -3px; left: -3px; font-family: var(--mono); font-size: 8px; font-weight: 700;
      background: var(--bad); color: #fff; border-radius: 6px; padding: 0 3px; line-height: 1.5;
    }

    #workbench { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    /* 游戏区优先：窗口不够宽/高时先压缩坞位（flex-shrink 开），游戏保底尺寸 */
    #wb-mid { flex: 1 1 auto; min-height: 300px; display: flex; }

    /* 坞 = 多个「格」的容器：底坞横切成列，左右坞纵切成行 */
    .dock {
      display: flex; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg1);
      transition: flex-basis var(--motion-view) var(--motion-ease), border-color var(--motion-fast) ease, filter var(--motion-solemn) ease;
    }
    body:has(#drag-overlay) .dock { transition: none; }
    .dock[data-dock='left'] { flex: 0 1 330px; flex-direction: column; border-right: 1px solid var(--line); }
    .dock[data-dock='right'] { flex: 0 1 420px; flex-direction: column; border-left: 1px solid var(--line); }
    .dock[data-dock='bottom'] { flex: 0 1 280px; flex-direction: row; border-top: 1px solid var(--line); }
    /* 收起态：不归零，留一条可点的把手（列出该坞住着谁） */
    .dock.collapsed { flex-basis: 26px !important; }
    .dock.collapsed .dock-group, .dock.collapsed .splitter.g { display: none; }
    .dock.empty { flex-basis: 0 !important; border: none; }
    .dock-stub { display: none; }
    .dock.collapsed .dock-stub {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      width: 100%; height: 100%; background: var(--bg1); color: var(--dim); font-size: 11px;
    }
    .dock.collapsed .dock-stub:hover { background: var(--bg2); color: var(--sub); }
    .dock[data-dock='bottom'].collapsed .dock-stub { padding: 0 10px; }
    .dock[data-dock='left'].collapsed .dock-stub,
    .dock[data-dock='right'].collapsed .dock-stub { flex-direction: column; padding: 8px 0; }
    .dock-stub .st-h { font-size: 10px; letter-spacing: 1px; white-space: nowrap; }
    .dock[data-dock='left'].collapsed .st-h,
    .dock[data-dock='right'].collapsed .st-h { display: none; }
    .dock-stub .st-c { font-size: 11px; color: var(--sub); white-space: nowrap; }
    .dock-stub .st-a { margin-left: auto; font-size: 10px; }
    .dock[data-dock='left'].collapsed .st-a,
    .dock[data-dock='right'].collapsed .st-a { margin-left: 0; margin-top: auto; }
    .dock-group { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
    .splitter.g { background: var(--line); flex: none; }
    .splitter.g.v { width: 4px; cursor: col-resize; }
    .splitter.g.h { height: 4px; cursor: row-resize; }
    .splitter.g:hover { background: var(--accent-dim); }
    /* 标签条是恒显的，每一格都要交一次高度税，所以按「薄」调：条上下留白收到
       2px/0，标签自己 3px，行高显式写 1.3——button 的 UA 行高是 normal（实测
       12px 字撑出 17px 行盒），不写死就白白高出两三个像素。整条 34px → 24.9px。 */
    .dock-tabs {
      display: flex; gap: 2px; padding: 2px 6px 0; flex: none;
      border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none;
    }
    .dock-tabs::-webkit-scrollbar { height: 0; }
    .dock-tabs .dock-fold {
      margin-left: auto; flex: none; align-self: stretch; display: flex; align-items: center; gap: 2px;
      color: var(--dim); font-size: 10.5px; padding: 0 3px 2px 6px;
      position: sticky; right: 0; background: var(--bg1); /* Tab 溢出滚动时把手常驻 */
    }
    /* × 自己拉满并加宽内边距：条变薄了，热区反而要比原先大（13.5×16.5 → 15.2×19.9） */
    .dock-tabs .dock-fold-btn {
      cursor: pointer; padding: 0 4px;
      align-self: stretch; display: flex; align-items: center;
    }
    .dock-tabs .dock-fold-btn:hover { color: var(--accent); }
    .dock-panes { flex: 1; min-height: 0; position: relative; display: flex; }
    .ws-tab {
      background: none; color: var(--dim); white-space: nowrap; flex: none;
      border: 1px solid transparent; border-bottom: none;
      border-radius: 3px 3px 0 0; padding: 3px 10px; cursor: pointer;
      font-size: 11.5px; line-height: 1.3;
      transition: color var(--motion-fast) ease, background-color var(--motion-fast) ease, border-color var(--motion-fast) ease;
    }
    .ws-tab:hover { color: var(--sub); }
    .ws-tab.active { background: var(--bg2); color: var(--accent); border-color: var(--line); }
    .ws-pane { display: none; flex: 1; min-height: 0; min-width: 0; flex-direction: column; }
    .ws-pane.active {
      display: flex;
      animation: kanso-view-enter var(--motion-view) var(--motion-ease) both;
    }
    @keyframes kanso-view-enter {
      from { opacity: .35; transform: translate3d(0, 5px, 0) scale(.997); }
      to { opacity: 1; transform: none; }
    }

    /* 分隔条：拖动实时改坞尺寸；双击折叠/展开 */
    .splitter { flex: none; background: var(--line-soft); }
    .splitter:hover { background: var(--accent-dim); }
    .splitter.v { width: 5px; cursor: col-resize; }
    .splitter.h { height: 5px; cursor: row-resize; }
    .splitter.off { display: none; }
    /* 拖动分隔条时的全屏透明遮罩：防 webview 吞鼠标事件 */
    #drag-overlay { position: fixed; inset: 0; z-index: 1000; }

    /* 专注模式：三坞全收，只留游戏 */
    #app.focus .dock { flex-basis: 0 !important; border: none; }
    #app.focus .splitter { display: none; }

    /* ══ 启动点亮（测试性功能，钥里默认关）══
       开着时启动瞬间整屏罩暗，随后一格一格「点火」亮起（导航条与各格一起洗牌，
       顺序每次不同；游戏永远最后）。只动 opacity（合成器友好），**不用 filter**
       ——尤其不给游戏 webview 上滤镜。每个元素的 animation-name / delay / duration
       由 renderer/launch-glow.ts 逐个写在行内，变体分配、错峰抖动与时长口径的单一
       出处是 shared/launch-glow.ts（测试期手调），所以这里不新立 --motion 档位，
       也不写死任何毫秒数。
       关掉时下面这些选择器一条都匹配不上：body 上那两个类根本不会被加。 */

    /* ══ 第零幕 · 欢迎返港 ══
       罩暗那一刻盖上来的全屏一层：正中一块铭牌，最底一行小字，此外什么都没有
       （2026-08-25 用户裁决「大道至简」——上一版那条进度条前 95% 是演的，撤了）。
       它盖住**整个窗口**（游戏区那会儿本来也还在黑屏加载），所以 z-index 压过
       所有浮层——这一层退场之前，屏幕上不该有别的东西冒头。
       底色与 body 同取 --bg0：淡出时露出的正是罩暗态的工作台，两层同色，
       于是读成一次连续的暗转，而不是「换了一张图」。
       时长（淡入淡出）由 renderer/launch-glow.ts 从 shared 的 LAUNCH_WELCOME_TIMING
       写在行内，这里同样不写死任何毫秒数；减少动态效果时那几个行内值根本不写，
       0ms 就是「直接就位」。 */
    #kanso-welcome {
      position: fixed; inset: 0; z-index: 9500;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg0);
      user-select: none; cursor: default;
    }
    /* 淡入挂在两块内容上、淡出挂在整层上——同一个元素放不下两条动画名 */
    #kanso-welcome > * {
      animation-name: kanso-welcome-in;
      animation-timing-function: ease;
      animation-fill-mode: both;
      animation-duration: 0ms;
    }
    #kanso-welcome.kw-out {
      animation-name: kanso-welcome-out;
      animation-timing-function: ease;
      animation-fill-mode: forwards;
      animation-duration: 0ms;
    }
    /* 铭牌：一块带框的小牌子，「欢迎返港，」与提督名并排落在**同一条基线**上。
       两段走**行内文本**而不是 flex 两栏：提督名要省略号就得让容器 overflow 非
       visible，而 overflow 非 visible 的盒子做基线对齐时用的是合成基线（边框盒下缘），
       小字会因此掉到大字底下去。行内文本天生同基线，截断也就顺理成章地落在整块上
       ——提督名可长可短，一行装不下就整块末尾省略号；换行会把铭牌撑成两层，
       那一下比截断难看得多。
       line-height 显式取 normal：body 那份 1.5 会把牌子撑高一截，而更小的值又会
       在 overflow: hidden 下切掉 24px 那行的上下沿。 */
    #kanso-welcome .kw-box {
      display: inline-block;
      padding: 14px 18px;
      border: 1px solid var(--line); border-radius: 5px;
      background: var(--bg1);
      line-height: normal;
      max-width: min(560px, 78vw);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* 招呼那半句退到副色小字：它是称呼的前缀，真正要看的是右边那个名字 */
    #kanso-welcome .kw-lead {
      font-family: var(--sans); font-size: 13px; color: var(--sub);
      margin-right: 10px;
    }
    #kanso-welcome .kw-name {
      font-family: var(--mono); font-size: 24px; font-weight: 600;
      letter-spacing: 1px; color: var(--text);
    }
    /* 最底一行：只是告诉你「这屏可以跳过」，不该跟铭牌抢眼睛，所以贴底、压暗一档 */
    #kanso-welcome .kw-skip {
      position: absolute; bottom: 28px;
      font-size: 10.5px; letter-spacing: .5px; color: var(--dim);
    }
    @keyframes kanso-welcome-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes kanso-welcome-out { from { opacity: 1; } to { opacity: 0; } }

    body.kanso-glow #element-rail,
    body.kanso-glow .dock-group { opacity: 0; }
    body.kanso-glow-run #element-rail,
    body.kanso-glow-run .dock-group {
      /* linear + **成对关键帧**：每个亮度靠「到达帧 + 保持帧」两帧撑成平台，
         明暗切换只发生在相邻 3~5% 的那一小段里（840ms 下 25~42ms 的插值窗）。
         2026-08-23 用户实机：上一版用 steps(1, end) 零毫秒硬跳，「闪的有点闪眼睛」
         ——微斜坡快到仍读作电火花，慢到不再是频闪。收尾那一段在各变体的
         倒数第二帧里改回 ease-out。 */
      animation-timing-function: linear;
      animation-fill-mode: both; /* 延时期间保持暗、放完保持亮，中间不用 JS 插手 */
      animation-name: kanso-glow-a; /* 兜底：JS 会逐个改成分配到的变体 */
      animation-duration: 0ms; /* JS 没写到的元素直接就位，不会卡在暗态 */
    }
    /* 三套点火节奏，由同一个随机流分配到各格，**相邻两格必不同**
       （判据在 shared/launch-glow 的 pickVariant）。两条收敛纪律，护栏逐条实算：
       ① **首次点亮之后 opacity 不再跌破 .35**——真正刺眼的是「亮→近黑→亮」，
          不是切换本身；② **每个暗谷都比前一个浅**，于是整条读成「越闪越亮」的
          预热，而不是忽明忽暗的故障告警。每格明暗至多三次，b 只留两次。 */
    @keyframes kanso-glow-a { /* 稳中带闪：着火早，两谷渐浅地站稳（斜坡窗 4%） */
      0% { opacity: 0; }
      12% { opacity: 0; }
      16% { opacity: .55; }
      30% { opacity: .55; }
      34% { opacity: .35; }
      46% { opacity: .35; }
      50% { opacity: .8; }
      62% { opacity: .8; }
      66% { opacity: .55; }
      76% { opacity: .55; animation-timing-function: ease-out; }
      100% { opacity: 1; }
    }
    @keyframes kanso-glow-b { /* 迟疑后猛亮：暗得久、先弱着一会儿、抖一下才轰起来（斜坡窗 5%） */
      0% { opacity: 0; }
      25% { opacity: 0; }
      30% { opacity: .44; }
      43% { opacity: .44; }
      48% { opacity: .36; }
      61% { opacity: .36; }
      66% { opacity: .9; }
      78% { opacity: .9; animation-timing-function: ease-out; }
      100% { opacity: 1; }
    }
    @keyframes kanso-glow-c { /* 先爆后稳：开头一记大亮，再两下越来越浅的回落（斜坡窗 3%） */
      0% { opacity: 0; }
      9% { opacity: 0; }
      12% { opacity: .88; }
      25% { opacity: .88; }
      28% { opacity: .45; }
      41% { opacity: .45; }
      44% { opacity: .72; }
      57% { opacity: .72; }
      60% { opacity: .58; }
      72% { opacity: .58; animation-timing-function: ease-out; }
      100% { opacity: 1; }
    }
    /* 游戏区那层罩：pointer-events 不拦（动画纯视觉，点得穿），z-index 压在
       #game-overlay(10) 之下——加载失败/启动失败的说明必须照常看得见。 */
    #game-glow {
      position: absolute; inset: 0; z-index: 9;
      background: #000; /* 与 #game-area 的底色一致，罩上去不会显出一块方形色差 */
      pointer-events: none;
    }
    /* 游戏区**不跟着硬闪**：整块画面明暗硬跳太刺眼。只给两段很轻的脉冲再放亮，
       时间函数另起一条——上面那条 steps 只作用在坞位与导航条上。 */
    body.kanso-glow-run #game-glow {
      animation-timing-function: ease-in-out;
      animation-fill-mode: both;
      animation-name: kanso-glow-game;
      animation-duration: 0ms;
    }
    @keyframes kanso-glow-game {
      0% { opacity: 1; }
      24% { opacity: .84; }
      38% { opacity: .93; }
      62% { opacity: .46; }
      74% { opacity: .58; }
      100% { opacity: 0; }
    }

    /* 仪式一开场（罩暗那一刻）编队的舰娘行就隐身，一直隐到第二幕给它们挂上进场动画。
       2026-08-23 用户实机报的时序 bug：第一幕点亮锐那一格时舰娘行跟着全露脸，
       第二幕开场才藏起来重演——「先全看一遍再擦掉重演」很出戏。
       **用祖先选择器而不是逐行加类**：锐在第一幕期间随时可能首渲/重渲，
       祖先规则让那一刻新生的行**天生隐身**，不必追着 DOM 跑；也不碰模块输出，
       被动重渲的逐字节闸门照旧无感。只压 opacity，不动布局——面板框架
       （标签/抬头/度量/页脚）照常跟着格子一起点亮，用户点名的只是舰娘行。
       摘除时机与「漏摘就是编队永远隐身」的防线见 renderer/launch-glow.ts 的 CEREMONY_CLASS。 */
    body.kanso-ceremony .ws-pane.mod-ru .ships .ship { opacity: 0; }
    /* 第三幕（资源数字自检）同理，压的只是**数字本身**：顶栏的图标照常随格点亮。
       顶栏尤其要压——它压根不在第一幕的罩暗范围里、从头就看得见，
       不压就是「先看真值再重演」。 */
    body.kanso-ceremony .ws-pane.mod-zi .tiles .tile .v,
    body.kanso-ceremony #header-status .hs-res b { opacity: 0; }
    /* 锱 · 资源盘那一幕：磁贴**外壳**与右栏各卡整块预隐。数字本身归上面那条
       （自检幕已经接管 `.tile .v`，这里不再隐第二次——两幕压同一个元素，
       摘的时候就要靠运气了）。压的是磁贴与卡片这一层而不是它们的内容：
       锱在第一幕期间随时可能首渲/重渲，压这一层才管得住那一刻新生的块。 */
    body.kanso-ceremony .ws-pane.mod-zi .tiles .tile,
    body.kanso-ceremony .ws-pane.mod-zi .side > * { opacity: 0; }
    /* 顶栏其余几组角标（远/渠/建/演/库）整组预隐；顶栏自身的底色、提督名与 BGM
       那一段是框架，照常随第一幕亮着。 */
    body.kanso-ceremony #header-status .hs-group:not(.resources) { opacity: 0; }
    /* 镝与铎共用右坞那一格，当前页是谁谁演——两页的**内容区**都从开场就隐身，
       页签/抬头随第一幕照常点亮。压的是内容容器而不是逐块：镝的分区、铎的卡片
       在第一幕期间随时可能首渲/重渲，压容器才管得住那一刻新生的东西。 */
    body.kanso-ceremony .ws-pane.mod-di .di-app,
    body.kanso-ceremony .ws-pane.mod-du .du-app { opacity: 0; }
    /* 鉴/钦/镖：压的都是**内容**，各自的框架照常随第一幕点亮——
       鉴留卷标签（.book-tabs）、钦留筛选条、镖留搜索与筛选条。
       压容器而不是逐块：这几个面板在第一幕期间随时可能首渲/重渲。 */
    body.kanso-ceremony .ws-pane.mod-ji .ji-app > *:not(.book-tabs),
    body.kanso-ceremony .ws-pane.mod-qn .q-work,
    body.kanso-ceremony .ws-pane.mod-bi .elist,
    body.kanso-ceremony .ws-pane.mod-bi .detail { opacity: 0; }
    /* 乱滚期间每一位都在换字形：等宽 + tabular-nums 才不会逐帧改宽度、把面板抖出重排。
       顶栏那份本来就写了（.hs-res b），这里给锱的数字补上。 */
    .mod-zi .tile .v { font-variant-numeric: tabular-nums; }

    /* ══ 并行各幕 · 入场（同一个 kanso.launchGlow 开关，接在最后一格亮透那一刻，
       与游戏区那 1.8 秒的淡入并排跑）══
       节点与 data 标记都是 renderer/launch-glow.ts 在**挂载后的真实 DOM 上**加的，
       一个字都不进模块的 HTML 输出管线（被动重渲的逐字节闸门要拿那份输出做比较）。
       时长逐个写在行内，口径在 shared/launch-glow 的三张 *_TIMING 表。
       面板开机后必然被真重渲一次，那一下这些节点和标记会随 innerHTML 一起没掉
       ——那正是「体面收场」：新 DOM 本来就是终态，不重挂、不跟渲染器抢。

       **进场标记走 data 属性而不是 class**：换 DOM 之前 withViewStateKept 会按
       className 分桶存滚动位置与 <details> 展开态，往 class 上加东西会把元素挪桶。
       data 属性完全不碰 className，这条路彻底堵死（理由详见 launch-glow.ts 的 MARK）。

       加第五幕＝一条注册 + 这里一段关键帧 + 一条预隐规则，别的都不用动。 */

    /* 罩层（锐的加载光带 / 镝的扫描线）共用的形态：绝对定位、不挡点击、随宿主被裁 */
    .kanso-roster-load, .kanso-battle-scan {
      position: absolute; inset: 0; z-index: 4;
      pointer-events: none; /* 纯视觉，不挡任何点击 */
      overflow: hidden;
      animation-timing-function: ease-in-out;
      animation-fill-mode: both;
      animation-duration: 0ms; /* JS 逐个写行内值；没写到的直接就位，不会赖着不走 */
    }
    .kanso-roster-load > i, .kanso-battle-scan > i {
      position: absolute; top: 0; bottom: 0;
      animation-timing-function: ease-in-out;
      animation-fill-mode: both;
      animation-duration: 0ms;
    }
    /* 逐元素进场：轮到它之前保持在起点（fill-mode both），不用 JS 逐帧插手 */
    [data-kanso-in] {
      animation-timing-function: var(--motion-ease);
      animation-fill-mode: both;
      animation-duration: 0ms;
    }

    /* ── 锐 · 编队入场：加载光带扫过，舰娘行一排排落位 ── */
    .kanso-roster-load { background: color-mix(in srgb, var(--bg1) 74%, transparent); animation-name: kanso-roster-veil; }
    /* 扫动光带：一条细亮带横过面板一次。不做转圈 spinner——那个老气，
       而且转圈是「不知道要多久」的语气，这里明明马上就好。 */
    .kanso-roster-load > i {
      left: 0; width: 30%;
      background: linear-gradient(90deg,
        transparent,
        color-mix(in srgb, var(--accent) 22%, transparent),
        transparent);
      animation-name: kanso-roster-sweep;
    }
    @keyframes kanso-roster-veil {
      0% { opacity: 0; }
      16% { opacity: 1; }
      74% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes kanso-roster-sweep {
      from { transform: translate3d(-110%, 0, 0); }
      to { transform: translate3d(370%, 0, 0); }
    }
    [data-kanso-in='roster'] { animation-name: kanso-roster-row; }
    @keyframes kanso-roster-row {
      from { opacity: 0; transform: translate3d(0, 6px, 0); }
      to { opacity: 1; transform: none; }
    }

    /* ── 镝 · 战术屏开机：一道扫描线横扫，随后左右两栏相向合拢 ──
       战斗面板的气质是敌我对阵，所以两栏**相向归位**：左栏从更左、右栏从更右
       各推 10px 回到中线两侧。扫描线比锐的光带更窄更亮，读作「自检」而不是「加载」。 */
    .kanso-battle-scan { background: color-mix(in srgb, var(--bg0) 62%, transparent); animation-name: kanso-battle-veil; }
    .kanso-battle-scan > i {
      left: 0; width: 14%;
      background: linear-gradient(90deg,
        transparent,
        color-mix(in srgb, var(--accent) 34%, transparent),
        transparent);
      animation-name: kanso-battle-sweep;
    }
    @keyframes kanso-battle-veil {
      0% { opacity: 0; }
      14% { opacity: 1; }
      72% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes kanso-battle-sweep {
      from { transform: translate3d(-120%, 0, 0); }
      to { transform: translate3d(800%, 0, 0); }
    }
    /* 一幕两条变体：JS 只打一个标记，左右由**祖先**决定走哪一条
       （收场认的是 `kanso-battle-` 这个前缀，两条都收得住）。 */
    .mod-di .battle-col > [data-kanso-in='battle'] { animation-name: kanso-battle-l; }
    .mod-di .sidebar > [data-kanso-in='battle'] { animation-name: kanso-battle-r; }
    @keyframes kanso-battle-l {
      from { opacity: 0; transform: translate3d(-10px, 0, 0); }
      to { opacity: 1; transform: none; }
    }
    @keyframes kanso-battle-r {
      from { opacity: 0; transform: translate3d(10px, 0, 0); }
      to { opacity: 1; transform: none; }
    }

    /* ── 铎 · 作战公告揭幕：自上而下逐块垂下，不带罩 ──
       公告的气质是「一段段展开」，先蒙一层反而多此一举，所以这一幕 loading = 0。 */
    [data-kanso-in='brief'] { animation-name: kanso-brief-drop; }
    @keyframes kanso-brief-drop {
      from { opacity: 0; transform: translate3d(0, -8px, 0); }
      to { opacity: 1; transform: none; }
    }

    /* ── 鉴 · 开卷：书架按对角线波纹一格格点起来 ──
       藏书楼的气质：不是滑进来，是**就地亮起来**，所以位移只留一点点缩放感的下沉，
       主要靠 opacity。次序由 shared 的 rippleOrder 按左上→右下排，元素数封顶 24。 */
    [data-kanso-in='tome'] { animation-name: kanso-tome-lit; }
    @keyframes kanso-tome-lit {
      from { opacity: 0; transform: translate3d(0, 4px, 0) scale(.985); }
      to { opacity: 1; transform: none; }
    }

    /* ── 钦 · 军令下达：任务行从左侧轻推入 ──
       与锐的纵向错峰形成横纵对照：那边是一层层落下，这边是一条条递进来。 */
    [data-kanso-in='order'] { animation-name: kanso-order-in; }
    @keyframes kanso-order-in {
      from { opacity: 0; transform: translate3d(-8px, 0, 0); }
      to { opacity: 1; transform: none; }
    }

    /* ── 顶栏浮层（铃/史/钥）· 打开时的内容入场 ──
       **与启动仪式无关**：触发是每次打开浮层，所以不走 body.kanso-ceremony 预隐，
       起点由动画自己的 fill-mode 管。面板本体的淡入/位移是上面 .ov-panel 那条
       早就有的过渡（与开关无关），这里只加内容区那一层很快的微错峰。
       三家共用同一段——给每家做专属性格是过度设计。关闭是瞬时的，不做退场。 */
    [data-kanso-open] {
      animation-name: kanso-overlay-block;
      animation-timing-function: var(--motion-ease);
      animation-fill-mode: both;
      animation-duration: 0ms; /* JS 逐个写行内值 */
    }
    @keyframes kanso-overlay-block {
      from { opacity: 0; transform: translate3d(0, 6px, 0); }
      to { opacity: 1; transform: none; }
    }

    /* ── 顶栏角标 · 逐组点亮 ──
       形态刻意克制：顶栏只有一行高，位移大一点就成了抖动。淡入 + 2px 上抬 + 一丝
       缩放，读作「这一组仪表通电了」。收官时刻与资源数字对齐（见注册表的 alignEnd）。 */
    [data-kanso-in='badge'] { animation-name: kanso-badge-lit; }
    @keyframes kanso-badge-lit {
      from { opacity: 0; transform: translate3d(0, 2px, 0) scale(.97); }
      to { opacity: 1; transform: none; }
    }

    /* ── 锱 · 资源盘通电：磁贴一块块亮起，右栏各卡跟着推上来 ──
       磁贴是密排的方格，位移大一点整片就成了抖动，所以只抬 3px；右栏各卡跟着同一条
       （一幕一个标记，不给同一幕做两条变体）。收官时刻对齐资源数字的共同终点
       ——数字就住在磁贴里，两边不同刻落定就读不成「一台仪表同时完成自检」。 */
    [data-kanso-in='zi'] { animation-name: kanso-zi-lit; }
    @keyframes kanso-zi-lit {
      from { opacity: 0; transform: translate3d(0, 3px, 0); }
      to { opacity: 1; transform: none; }
    }

    /* ── 镖 · 出航调度：时刻表逐行快速点亮，右栏详情随后整块现身 ──
       调度板刷新的利落劲：位移极小（2px），几乎就是「啪啪啪」地亮过去。 */
    [data-kanso-in='dispatch'] { animation-name: kanso-dispatch-tick; }
    @keyframes kanso-dispatch-tick {
      from { opacity: 0; transform: translate3d(0, -2px, 0); }
      to { opacity: 1; transform: none; }
    }

    /* ══ 顶栏独立模块（史 铃 钥 铭 锚）══ */
    #overlay-bar { display: flex; gap: 3px; margin-right: 6px; }
    /* 形态全在 `header button` 那条（同族统一）；这里只留角标的定位锚与激活态 */
    .ov-btn { position: relative; }
    .ov-btn.on { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
    .ov-btn .ov-badge:not(:empty) {
      position: absolute; top: -5px; right: -5px; font-family: var(--mono); font-size: 8px; font-weight: 700;
      background: var(--bad); color: #fff; border-radius: 6px; padding: 0 3px; line-height: 1.5;
    }
    #overlay-host {
      position: fixed; inset: 0; z-index: 900;
      visibility: hidden; opacity: 0; pointer-events: none;
      transition: opacity var(--motion-fast) ease, visibility 0s linear var(--motion-fast);
    }
    #overlay-host.show {
      visibility: visible; opacity: 1; pointer-events: auto;
      transition: opacity var(--motion-fast) ease;
    }
    #overlay-host .ov-back {
      position: absolute; inset: 0; background: rgba(5, 8, 11, 0.5);
      backdrop-filter: blur(1.5px);
    }
    #overlay-host .ov-panel {
      position: absolute; top: 42px; right: 10px;
      width: min(1280px, 90vw); height: min(820px, 84vh);
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg0); border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.6);
      opacity: 0; transform: translate3d(0, -7px, 0) scale(.99);
      transform-origin: top right;
      transition: opacity var(--motion-fast) ease, transform var(--motion-view) var(--motion-ease);
    }
    #overlay-host.show .ov-panel { opacity: 1; transform: none; }
    #overlay-host .ov-head {
      display: flex; align-items: center; gap: 6px; flex: none;
      padding: 6px 10px; background: var(--bg1); border-bottom: 1px solid var(--line);
    }
    #overlay-host .ov-tabs { display: flex; gap: 3px; flex: 1; min-width: 0; overflow-x: auto; }
    #overlay-host .ov-tab {
      font-size: 11.5px; padding: 3px 11px; border-radius: 5px; cursor: pointer;
      background: var(--bg2); color: var(--sub); white-space: nowrap;
    }
    #overlay-host .ov-tab.on { background: var(--accent-dim); color: #fff; }
    #overlay-host .ov-x { flex: none; color: var(--dim); cursor: pointer; font-size: 12px; padding: 0 4px; }
    #overlay-host .ov-x:hover { color: var(--bad); }
    #overlay-host .ov-body { flex: 1; min-height: 0; display: flex; }

    /* ══ 锚 · 事件流 ══ */
    .mod-anchor #console-head {
      display: flex; align-items: baseline; gap: 8px; padding: 8px 10px 4px; color: var(--dim);
    }
    .mod-anchor #event-count { flex: none; }
    .mod-anchor #reconcile-audit { margin-left: auto; position: relative; }
    .mod-anchor #reconcile-summary {
      cursor: pointer; list-style: none; color: var(--sub); white-space: nowrap;
      border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px;
    }
    .mod-anchor #reconcile-summary::-webkit-details-marker { display: none; }
    .mod-anchor #reconcile-list {
      position: absolute; z-index: 20; top: calc(100% + 5px); right: 0; width: min(460px, 78vw);
      max-height: 280px; overflow-y: auto; padding: 6px; border: 1px solid var(--line);
      /* 底色必须显式给 --bg1：背景透明会让浮层文字直接叠在下方事件流上 */
      border-radius: 5px; background: var(--bg1); box-shadow: 0 8px 24px rgba(0, 0, 0, .38);
    }
    .mod-anchor .reconcile-row {
      display: grid; grid-template-columns: 58px minmax(70px, auto) 1fr;
      gap: 5px 8px; align-items: baseline; padding: 5px; border-bottom: 1px solid var(--line);
      font-family: var(--mono); font-size: 10px;
    }
    .mod-anchor .reconcile-row:last-child { border-bottom: 0; }
    .mod-anchor .reconcile-row time { color: var(--dim); }
    .mod-anchor .reconcile-row strong { color: var(--sub); }
    .mod-anchor .reconcile-row span { grid-column: 3; color: var(--bad); }
    .mod-anchor .reconcile-row span b { color: var(--text); }
    .mod-anchor .reconcile-empty { padding: 10px; color: var(--dim); line-height: 1.55; }
    .mod-anchor #event-log {
      flex: 1; overflow-y: auto; margin: 0; padding: 0 6px 8px; list-style: none;
      font-family: var(--mono); font-size: 11px;
    }
    .mod-anchor li { display: flex; gap: 6px; padding: 2px 4px; border-radius: 2px; white-space: nowrap; }
    .mod-anchor li:nth-child(odd) { background: var(--bg2); }
    .mod-anchor .ev-time { color: var(--dim); flex: 0 0 60px; }
    .mod-anchor .ev-badge { flex: 0 0 30px; text-align: center; font-size: 10px; }
    .mod-anchor .ev-badge.res { color: var(--ok); }
    .mod-anchor .ev-badge.req { color: var(--dim); }
    .mod-anchor .ev-badge.err { color: var(--bad); }
    .mod-anchor .ev-path { overflow: hidden; text-overflow: ellipsis; }
    .mod-anchor .ev-size { margin-left: auto; color: var(--dim); }
    .mod-anchor #empty-hint { padding: 30px 20px; color: var(--dim); line-height: 1.8; }

    /* ══ 铭 · 状态（验收工具页）══ */
    .mod-mgstate { overflow-y: auto; padding: 10px; gap: 12px; container-type: inline-size; }
    .mod-mgstate .mg-section-title { color: var(--dim); font-size: 11px; margin-bottom: 4px; letter-spacing: 1px; }
    /* 战斗特效模拟台。只在 KANSO_DEBUG_UI=1 时由 mgstate 生成，发布形态里没有这段 DOM。 */
    .mod-mgstate .mg-sim { display: flex; flex-wrap: wrap; gap: 6px; }
    .mod-mgstate .mg-sim button {
      background: var(--bg2); color: var(--sub); border: 1px solid var(--line);
      border-radius: 5px; padding: 4px 9px; font: inherit; font-size: 11px; cursor: pointer;
    }
    .mod-mgstate .mg-sim button:hover { color: var(--text); border-color: var(--accent-dim); }
    .mod-mgstate .mg-sim-note { margin-top: 5px; color: var(--dim); font-size: 10.5px; line-height: 1.5; }
    /* 按号试听。同上，只在 KANSO_DEBUG_UI=1 时生成；♪ 本身用全局的 .bgm-pv 样式。 */
    .mod-mgstate .mg-bgm-probe { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .mod-mgstate .mg-bgm-no, .mod-mgstate .mg-bgm-tree {
      background: var(--bg2); color: var(--text); border: 1px solid var(--line);
      border-radius: 5px; padding: 4px 6px; font: inherit; font-size: 11px;
    }
    .mod-mgstate .mg-bgm-no { width: 76px; }
    .mod-mgstate .mg-bgm-tree { cursor: pointer; }
    .mod-mgstate .mg-freshness { font-size: 11px; color: var(--dim); }
    .mod-mgstate .mg-freshness.stale { color: var(--warn); }
    .mod-mgstate .mg-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
    .mod-mgstate .mat-tile { background: var(--bg2); border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; }
    .mod-mgstate .mat-tile small { display: block; color: var(--dim); font-size: 10px; }
    .mod-mgstate .mat-tile b { font-size: 13px; font-weight: 600; }
    .mod-mgstate .mg-deck { background: var(--bg2); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; margin-bottom: 6px; }
    .mod-mgstate .mg-deck-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
    .mod-mgstate .mg-deck-head b { color: var(--accent); }
    .mod-mgstate .mg-deck-head .deck-badge { font-size: 10px; color: var(--warn); }
    .mod-mgstate .mg-deck-head .deck-custom { font-size: 10px; color: var(--dim); }
    .mod-mgstate .mg-ship { display: flex; gap: 6px; font-size: 12px; padding: 1px 0; white-space: nowrap; }
    .mod-mgstate .ship-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .mod-mgstate .ship-lv { color: var(--dim); flex: 0 0 44px; }
    .mod-mgstate .ship-hp { flex: 0 0 70px; text-align: right; }
    .mod-mgstate .ship-hp.hp-mid { color: var(--warn); }
    .mod-mgstate .ship-hp.hp-low { color: var(--bad); }
    .mod-mgstate .ship-cond { flex: 0 0 30px; text-align: right; color: var(--dim); }
    .mod-mgstate .ship-cond.cond-high { color: var(--ok); }
    .mod-mgstate .ship-cond.cond-low { color: var(--bad); }
    .mod-mgstate .mg-dock { display: flex; gap: 8px; padding: 3px 4px; font-size: 12px; }
    .mod-mgstate .dock-no { color: var(--dim); flex: 0 0 18px; }
    .mod-mgstate .dock-body { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .mod-mgstate .dock-timer { color: var(--warn); font-family: var(--mono); }
    .mod-mgstate .dock-timer.done { color: var(--ok); }
    @container (max-width: 360px) {
      .mod-mgstate .mg-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* ══ 锐 · 编队（移植自设计稿 06，.fleet-skin 作用域）══ */
    .fleet-skin { overflow: hidden; }
    .fleet-skin .ru-app { flex: 1; min-height: 0; display: flex; background: var(--bg0); }
    .fleet-skin .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    /* 页签行与抬头一样是给编队区让路的（见下面 .fleet-head 的注释）：
       上沿留白 8→5、页签自身上下 6→5，行高 39.7→34.7px（993px 面板实测）。
       页签的点击热区跟着从 30.8 降到 28.8px（1.15 缩放下 33 设备像素），
       仍高于 24px 的舒适下限——这也是这一档只削 1px 的原因。 */
    .fleet-skin .ftabs {
      display: flex; gap: 2px; padding: 5px 12px 0; overflow-x: auto;
      background: var(--bg1); border-bottom: 1px solid var(--line); scrollbar-width: thin;
    }
    .fleet-skin .ftab {
      display: flex; flex: none; align-items: center; gap: 6px; cursor: pointer;
      padding: 5px 10px; font-size: 12px; color: var(--sub);
      border: 1px solid transparent; border-bottom: none; border-radius: 7px 7px 0 0;
    }
    .fleet-skin .ftab.on { background: var(--bg0); border-color: var(--line); color: var(--text); }
    .fleet-skin .ftab .d { width: 7px; height: 7px; border-radius: 50%; }
    .fleet-skin .ftab .d.warn { background: var(--warn); }
    .fleet-skin .ftab .d.ok { background: var(--ok); }
    .fleet-skin .ftab .d.exp { background: var(--dock); }
    .fleet-skin .ftab .d.sortie { background: var(--accent); box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 48%, transparent); }
    .fleet-skin .ftab.is-sortie { color: #a9dcf4; }
    .fleet-skin .ftab .d.air { background: #8fb8e0; box-shadow: 0 0 5px rgba(143, 184, 224, .38); }
    .fleet-skin .ftab .t { font-family: var(--mono); font-size: 10px; color: var(--dim); }
    .fleet-skin .ftab .t.sortie-state { color: var(--accent); }
    /* 抬头是给编队区让路的：它每多占一行，下面就少显示一艘舰。
       实测（993px 面板）压缩前 91px、编队区 161px、6 行只完整显示 3 行。
       2026-08-21 再压一档：上下 4→3，配合裁决胶囊自身的 3→2，行高 36.1→32.1px。
       三块（舰队名 / 裁决胶囊 / 度量芯片）仍由 align-items:center 竖向居中，
       行高由最高的裁决胶囊决定，压的是它们上下的空白而不是任何一块自己。 */
    .fleet-skin .fleet-head {
      display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px;
      padding: 3px 12px; background: var(--bg1); border-bottom: 1px solid var(--line);
    }
    .fleet-skin .fleet-ident {
      flex: none; min-width: 118px; display: flex; align-items: baseline; gap: 4px 7px;
      color: var(--sub); font-size: 11px;
    }
    .fleet-skin .fleet-ident b { color: #8fd8f0; font-weight: 600; font-size: 12px; }
    .fleet-skin .fleet-ident small { color: var(--dim); font-size: 9px; }
    .fleet-skin .verdict {
      flex: 1 1 210px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px;
      padding: 2px 8px; border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line));
      border-radius: 6px;
      background: linear-gradient(90deg, rgba(232, 160, 76, 0.08), transparent 60%);
    }
    .fleet-skin .verdict.ok {
      border-color: color-mix(in srgb, var(--ok) 30%, var(--line));
      background: linear-gradient(90deg, rgba(103, 201, 138, 0.08), transparent 60%);
    }
    .fleet-skin .verdict .ic {
      width: 18px; height: 18px; flex: none; border-radius: 50%; display: grid; place-items: center;
      background: #2e2313; border: 1px solid #4a3a22; color: var(--warn); font-size: 10px; font-weight: 700;
    }
    .fleet-skin .verdict.ok .ic { background: #132a1c; border-color: #2b4a37; color: var(--ok); }
    /* 出击中：裁决换成海上状态陈述（就绪与否只对在港舰队有意义）。
       accent 与顶部「正在出击」徽记同语；带大破时保持警示底色不加 .ok */
    .fleet-skin .verdict.sortie {
      border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%);
    }
    .fleet-skin .verdict.sortie .ic { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent-ink); font-size: 11px; }
    .fleet-skin .verdict.sortie .tx b { color: var(--accent-ink); }
    .fleet-skin .verdict.sortie:not(.ok) .tx span { color: var(--warn); }
    .fleet-skin .verdict .tx { flex: 1; min-width: 0; }
    .fleet-skin .verdict .tx b { font-size: 11.5px; color: var(--warn); }
    .fleet-skin .verdict.ok .tx b { color: var(--ok); }
    .fleet-skin .verdict .tx span { display: inline; margin-left: 5px; font-size: 10px; color: var(--sub); }
    /* 陆航与札：都不是这支舰队自己的就绪与否，却决定现在出击划不划算，
       藏在几百行外的对应面板里等于没有。**两条并排共占一行**——
       原来是各占一行，两条一起出现时裁决框就三行高，把编队区挤没了。 */
    .fleet-skin .vflags {
      flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px;
      padding-top: 2px; border-top: 1px dashed var(--line-soft);
    }
    .fleet-skin .verdict .ab-flag { font-size: 9.5px; color: var(--dim); }
    .fleet-skin .verdict .ab-flag.warn { color: var(--warn); cursor: pointer; }
    .fleet-skin .verdict .ab-flag.bad { color: var(--bad); cursor: pointer; }
    .fleet-skin .verdict .ab-flag.warn:hover, .fleet-skin .verdict .ab-flag.bad:hover { text-decoration: underline; }
    .fleet-skin .verdict .eta { flex: none; text-align: right; font-size: 9.5px; color: var(--dim); }
    .fleet-skin .verdict .eta b { display: inline; margin-left: 3px; font-family: var(--mono); font-size: 10px; color: var(--text); font-weight: 600; }
    /* 度量行与裁决胶囊共线（basis 320px）。
       2026-08-21 用户看过实机后拍板的最终态：**宽档紧凑优先，一行加省略号**。
       中途曾改成 `flex: 1 1 100%` 让它独占一行，图的是行宽随面板单调；
       但那样抬头在宽档从 1 行变 2 行（实测 32.1→57.0px，带陆航/札挂牌时 57→78），
       用户的判断是「两行明显更适合窄框，宽度够还是该用一行加省略号」——
       单调性的诉求让位于紧凑。
       共线必然带来一处跳变（面板跨过两者 basis 之和时，行宽掉一个「舰队名+裁决+间距」
       ≈433px），那一跳由芯片收纳的 ⋯ 消化：放不下就收进收纳，点开还在。
       **这是预期的降级方式，不是缺陷**——收纳的放回/滞回在 25cf8a5 已经修好，
       跳变前后不会出现「收进去就再也回不来」。
       窄档（<700 面板）仍旧堆叠，见下面 .fleet-skin.narrow 那条覆盖。 */
    .fleet-skin .metrics {
      flex: 2 1 320px; display: flex; flex-wrap: wrap; gap: 3px; align-items: center;
    }
    /* flex:none + nowrap 是收纳判定的前提：芯片不参与伸缩、也不在内部折行，
       量到的才是它真正要占的宽度（见 ru.ts foldMetricsRow）。放不下不再靠换行
       解决——换行会把编队区的高度吃掉，改由「⋯N」按优先级收起。 */
    .fleet-skin .mchip {
      display: inline-flex; align-items: baseline; gap: 4px; flex: none; white-space: nowrap;
      background: var(--bg0); border: 1px solid var(--line); border-radius: 5px;
      padding: 1px 6px; font-size: 9.5px; color: var(--sub); cursor: default;
    }
    .fleet-skin .mchip.m-folded { display: none; }
    /* 行尾的「⋯N」：形态贴齐普通 chip，只把边框改虚线 + cursor:help，
       与 .sd-runs / .sd-exp.dim 同一套「这里还有得看」的暗示 */
    .fleet-skin .mchip.mfold { border-style: dashed; cursor: help; }
    .fleet-skin .mchip.mfold:hover,
    .fleet-skin .mchip.mfold:focus-visible { border-color: var(--accent-dim); color: var(--accent-ink); }
    .fleet-skin .mchip b { font-family: var(--mono); font-size: 11px; color: var(--text); font-weight: 600; }
    .fleet-skin .mchip b.g { color: var(--ok); }
    /* 制空 / 索敌33：出击前最常看的两个数，给强调色 */
    .fleet-skin .mchip b.hi { color: var(--accent); font-size: 11.5px; }
    .fleet-skin .mchip.cmb { border-color: var(--accent-dim); color: var(--accent-ink); background: #14222c; }
    .fleet-skin .mchip.warn { border-color: #6b4f2a; background: #241c12; }
    .fleet-skin .mchip.bad { border-color: #6b3038; background: #241315; }
    .fleet-skin .mchip em { font-style: normal; font-size: 9.5px; color: var(--bad); }
    /* 图专用口径的图号标注（如 TP[62-5]）：这不是警示，所以不能用 em 那档红，
       走强调色——与 .mchip.cmb 同一套「当前处在某个特殊语境」的暗示 */
    .fleet-skin .mchip i.mtag { font-style: normal; font-size: 9px; color: var(--accent-ink); }
    /* 「⋯N」的展开卡。挂在 body 上（面板既裁 overflow 又带 transform 包含块），

      display: grid; grid-template-columns: 38px minmax(96px, 1fr) 100px 52px 40px 150px;
      /* 行距只留给列间：.ship-detail 是 grid-column:1/-1 的第七个孩子，永远自成一行，
         没展开时高度为 0——原来的 gap:8px 于是在**每一行**都留了 8px 的空白行距，
         看不见也点不着，六行白吃 48px。收起来的那份间距改由 .ship.open .ship-detail
         的 margin-top 承担（它本来就在 transition 名单里，展开时的观感一像素不变）。

         省下来的 48px 不全部让给「更矮」：先按 6→5 压过一版，实测六舰满编只占
         257px、列表底下空出 41px 的白——比原来更难看。所以纵向 padding 改成 8px，
         行高 52.8→48.9px（993 面板 / 1.15 缩放 / 坞高 428 实测），六舰 293px
         对上可用的 298px，余白 5px。这一档同时把行的上下留白摆匀了：原来是上 6
         下 6+8（那 8px 行距落在内容与分隔线之间），现在上下各 8。
         注意 8 不是「比原来还松」——真正决定观感的是行高，它仍比压缩前矮 4px。 */
      align-items: center; gap: 0 8px; padding: 8px 14px; cursor: pointer;

    .fleet-skin .ship.dock { border-left-color: var(--dock); }
    /* 碎裂卡：这次出击里她真的沉了（判据见 kernel.ts sortieSunkShips）。
       纯 CSS：裂纹用几条 1px 的 linear-gradient 细线交叉，头像格切一个缺角并歪掉，
       整行压暗——不引任何库、不加图片资源。整个坞此时已经在失色，
       所以这里只负责「碎」，不再重复涂灰。 */
    .fleet-skin .ship.shattered {
      position: relative;
      border-left-color: var(--dim);
      background: linear-gradient(90deg, rgba(0, 0, 0, .34), rgba(0, 0, 0, .1) 60%, transparent);
      filter: brightness(.72) contrast(1.06);
      animation: ru-shatter-in 620ms var(--motion-ease) both;
    }
    .fleet-skin .ship.shattered:hover { background: linear-gradient(90deg, rgba(0, 0, 0, .3), rgba(0, 0, 0, .08) 60%, transparent); }
    .fleet-skin .ship.shattered .shatter {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      /* 主裂纹：四条粗细不一的斜线贯穿整行。整行还压着 brightness(.72)，
         所以这里的不透明度要按「乘完之后仍看得见」来定，不能照静态取值。 */
      background:
        linear-gradient(72deg, transparent calc(24% - 1.4px), rgba(233, 243, 250, .95) 24%, transparent calc(24% + 1.4px)),
        linear-gradient(-58deg, transparent calc(43% - 1.1px), rgba(233, 243, 250, .8) 43%, transparent calc(43% + 1.1px)),
        linear-gradient(96deg, transparent calc(63% - 1.2px), rgba(233, 243, 250, .72) 63%, transparent calc(63% + 1.2px)),
        linear-gradient(-104deg, transparent calc(81% - .9px), rgba(233, 243, 250, .6) 81%, transparent calc(81% + .9px));
      /* 每条裂纹带一道黑边 = 玻璃的厚度感，否则四条白线看着像划痕 */
      filter: drop-shadow(1px 1px 0 rgba(0, 0, 0, .75));
    }
    /* 碎片：两块被裂纹切出来的楔形压暗一档，行看起来是「碎开」而不是「被划了几刀」 */
    .fleet-skin .ship.shattered .shatter::before,
    .fleet-skin .ship.shattered .shatter::after {
      content: ''; position: absolute; inset: 0;
    }
    .fleet-skin .ship.shattered .shatter::before {
      background:
        linear-gradient(24deg, transparent calc(50% - 1px), rgba(233, 243, 250, .6) 50%, transparent calc(50% + 1px)),
        linear-gradient(160deg, rgba(0, 0, 0, .5), rgba(0, 0, 0, .16));
      clip-path: polygon(18% 0, 46% 0, 33% 100%, 8% 100%);
    }
    .fleet-skin .ship.shattered .shatter::after {
      background:
        linear-gradient(-32deg, transparent calc(50% - 1px), rgba(233, 243, 250, .5) 50%, transparent calc(50% + 1px)),
        linear-gradient(-160deg, rgba(0, 0, 0, .46), rgba(0, 0, 0, .12));
      clip-path: polygon(58% 0, 88% 0, 96% 100%, 66% 100%);
    }
    .fleet-skin .ship.shattered .fc {
      transform: rotate(-9deg) translate(-2px, 2px);

    .fleet-skin .ei {

    .fleet-skin .ei .pc.pc-g, .fleet-skin .equip-icon .pc.pc-g { color: var(--ok); }
